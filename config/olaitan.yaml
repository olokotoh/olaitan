# Olaitan central configuration.
# See _bmad-output/planning-artifacts/architecture.md#Configuration-Format
# for the full schema. All keys are snake_case; durations are Go-style
# strings ("24h", "10s").

detection:
  confidence_bands:
    watch: 40
    alert: 70
    act: 90
  baseline_window: 24h
  # Story 1.7: per-source adapter configuration. The audit-webhook
  # receiver is gated on enabled; chart deploys with
  # auditWebhook.enabled=false leave this block at its zero value and
  # the collector subcommand does not spawn the audit goroutine.
  sources:
    audit:
      enabled: false
      listen_addr: ":8443"
      tls_cert_file: "/etc/olaitan/audit-tls/tls.crt"
      tls_key_file: "/etc/olaitan/audit-tls/tls.key"
      client_ca_file: "/etc/olaitan/audit-tls/ca.crt"
      max_payload_bytes: 8388608
      staleness_timeout: "5m"
      publish_retry:
        min: "100ms"
        max: "1s"
        multiplier: 2.0
        jitter: 0.1
        max_attempts: 3
    # Story 1.8: containerd CRI lifecycle adapter (FR3). Default
    # disabled until the operator confirms the cluster's CRI socket
    # path and is comfortable with the host-socket mount documented in
    # deploy/helm/olaitan/CRI.md. The watchdog only flips the source
    # unhealthy when the gRPC connection is not Ready AND staleness
    # exceeds the timeout: CRI lifecycle events are sparse on a stable
    # cluster, so staleness alone is not actionable.
    containerd:
      enabled: false
      socket_path: "/run/containerd/containerd.sock"
      dial_timeout: "10s"
      staleness_timeout: "5m"
      connect_retry:
        min: "1s"
        max: "30s"
        multiplier: 2.0
        jitter: 0.5
        max_attempts: 0
      publish_retry:
        min: "100ms"
        max: "1s"
        multiplier: 2.0
        jitter: 0.1
        max_attempts: 3
    # Story 1.10: Calico CNI flow adapter (FR4). Default disabled
    # until the operator confirms the Tigera operator install path
    # is in place (Calico v3.31.5+) and the mTLS material has been
    # provisioned. See deploy/helm/olaitan/CNI.md and
    # ADR-2026-04-30-01 / ADR-2026-05-12-01 for the full workflow.
    # The watchdog only flips unhealthy when stale AND not-Ready:
    # Goldmane flows are quiet by design.
    calico:
      enabled: false
      goldmane_addr: "goldmane.calico-system.svc:7443"
      server_name: "goldmane.calico-system.svc"
      ca_bundle_path: "/etc/olaitan/cni/ca.crt"
      client_cert_path: "/etc/olaitan/cni/client.crt"
      client_key_path: "/etc/olaitan/cni/client.key"
      dial_timeout: "10s"
      staleness_timeout: "10m"
      max_event_bytes: 196608
      start_time_gte: -60
      aggregation_interval: 15
      connect_retry:
        min: "1s"
        max: "60s"
        multiplier: 2.0
        jitter: 1.0
        max_attempts: 0
      publish_retry:
        min: "100ms"
        max: "1s"
        multiplier: 2.0
        jitter: 1.0
        max_attempts: 3
  # Story 1.11: read-on-demand workload posture client (FR7,
  # architecture.md:45, :324, :751). The client queries the K8s API
  # for the workload's RBAC bindings, applicable NetworkPolicies, and
  # PodSecurityContext at investigation time; results are cached for
  # cache_ttl seconds keyed by workload identity. The TTL ceiling is
  # 60s per architecture.md:324 + AC3; the chart rejects higher.
  posture:
    enabled: true
    cache_ttl: "60s"
    fetch_timeout: "5s"

# Story 1.12: Prometheus metrics surface (FR8, FR50). Every Olaitan
# process exposes Prometheus metrics on :9090/metrics from a dedicated
# http.Server running alongside the kubelet probe surface at
# :8080/healthz. The two surfaces have different consumer SLOs so they
# never share a port. Validation rejects an empty address per
# guardrail 27 (the surface is mandatory, not optional).
metrics:
  address: ":9090"

response:
  excluded_namespaces:
    - kube-system
    - olaitan

analyst:
  provider: api
  api:
    endpoint: ""
    model: ""
    api_key_secret: olaitan-llm
  local:
    endpoint: "http://ollama:11434"
    model: "gemma:2b"
  score_cap: 35
  timeout: 10s
  chain:
    enabled: false
    l1:
      prompt: config/prompts/l1-triage.tmpl
      model: ""
    l2:
      prompt: config/prompts/l2-review.tmpl
      model: ""
  subtasks:
    enabled: false
    max_per_assessment: 3
    severity_threshold: 70
    timeout: 10s
    available_types:
      - network_forensics
      - privilege_escalation
      - lateral_movement
      - mitre_mapping
      - data_exfiltration
