# Olaitan central configuration.
# See _bmad-output/planning-artifacts/architecture.md#Configuration-Format
# for the full schema. All keys are snake_case; durations are Go-style
# strings ("24h", "10s").

detection:
  # confidence_bands are the FSM transition thresholds (BI-3): watch maps
  # to SUSPICIOUS, alert to RESTRICTED, act to QUARANTINED. Story 2.2 pins
  # the AC1 defaults 20/40/70 (epics.md:1012-1043). Must satisfy
  # watch < alert < act, each in [0,100].
  confidence_bands:
    watch: 20
    alert: 40
    act: 70
  baseline_window: 24h
  # Story 1.14: Ring-2 sliding-window correlator and EvidencePackage
  # assembler. The window duration is hot-reloadable; max_package_bytes
  # is pinned to the 128 KiB on-wire cap from AC3.
  correlator:
    window_duration: "60s"
    max_package_bytes: 131072
    multi_signal_min_sources: 2
    high_severity_threshold: 50
  # Story 1.7: per-source adapter configuration. The audit-webhook
  # receiver is gated on enabled; chart deploys with
  # auditWebhook.enabled=false leave this block at its zero value and
  # the collector subcommand does not spawn the audit goroutine.
  sources:
    audit:
      enabled: false
      listen_addr: ":8443"
      tls_cert_file: "/etc/olaitan/audit-tls/tls.crt"
      tls_key_file: "/etc/olaitan/audit-tls/tls.key"
      client_ca_file: "/etc/olaitan/audit-tls/ca.crt"
      max_payload_bytes: 8388608
      staleness_timeout: "5m"
      publish_retry:
        min: "100ms"
        max: "1s"
        multiplier: 2.0
        jitter: 0.1
        max_attempts: 3
    # Story 1.8: containerd CRI lifecycle adapter (FR3). Default
    # disabled until the operator confirms the cluster's CRI socket
    # path and is comfortable with the host-socket mount documented in
    # deploy/helm/olaitan/CRI.md. The watchdog only flips the source
    # unhealthy when the gRPC connection is not Ready AND staleness
    # exceeds the timeout: CRI lifecycle events are sparse on a stable
    # cluster, so staleness alone is not actionable.
    containerd:
      enabled: false
      socket_path: "/run/containerd/containerd.sock"
      dial_timeout: "10s"
      staleness_timeout: "5m"
      connect_retry:
        min: "1s"
        max: "30s"
        multiplier: 2.0
        jitter: 0.5
        max_attempts: 0
      publish_retry:
        min: "100ms"
        max: "1s"
        multiplier: 2.0
        jitter: 0.1
        max_attempts: 3
    # Story 1.10: Calico CNI flow adapter (FR4). Default disabled
    # until the operator confirms the Tigera operator install path
    # is in place (Calico v3.31.5+) and the mTLS material has been
    # provisioned. See deploy/helm/olaitan/CNI.md and
    # ADR-2026-04-30-01 / ADR-2026-05-12-01 for the full workflow.
    # The watchdog only flips unhealthy when stale AND not-Ready:
    # Goldmane flows are quiet by design.
    calico:
      enabled: false
      goldmane_addr: "goldmane.calico-system.svc:7443"
      server_name: "goldmane.calico-system.svc"
      ca_bundle_path: "/etc/olaitan/cni/ca.crt"
      client_cert_path: "/etc/olaitan/cni/client.crt"
      client_key_path: "/etc/olaitan/cni/client.key"
      dial_timeout: "10s"
      staleness_timeout: "10m"
      max_event_bytes: 196608
      start_time_gte: -60
      aggregation_interval: 15
      connect_retry:
        min: "1s"
        max: "60s"
        multiplier: 2.0
        jitter: 1.0
        max_attempts: 0
      publish_retry:
        min: "100ms"
        max: "1s"
        multiplier: 2.0
        jitter: 1.0
        max_attempts: 3
  # Story 1.11: read-on-demand workload posture client (FR7,
  # architecture.md:45, :324, :751). The client queries the K8s API
  # for the workload's RBAC bindings, applicable NetworkPolicies, and
  # PodSecurityContext at investigation time; results are cached for
  # cache_ttl seconds keyed by workload identity. The TTL ceiling is
  # 60s per architecture.md:324 + AC3; the chart rejects higher.
  posture:
    enabled: true
    cache_ttl: "60s"
    fetch_timeout: "5s"
  # Story 1.15: OLT Sigma rule engine. The engine reads its rule
  # corpus from `path` (a ConfigMap-projected directory mounted into
  # the aggregator pod) and reloads on fsnotify-driven ConfigMap
  # ..data symlink swaps. Setting enabled=false leaves the engine
  # out of startAggregatorRing entirely so a sensing-only deployment
  # never spawns the JetStream consumer.
  rules:
    enabled: true
    path: "/etc/olaitan/rules"
  # Story 1.17: Welford baseline engine (FR16/FR17/FR18). Maintains
  # per-workload Gaussian baselines for five default metrics and emits
  # BaselineDeviation triggers when an observation exceeds
  # sigma_multiplier above the rolling mean. warmup_duration and
  # sigma_multiplier are hot-reloadable; enabled and redis_addr are
  # restart-required because they reconfigure startAggregatorRing.
  baselines:
    enabled: true
    warmup_duration: "30m"
    sigma_multiplier: 3.0
    redis_addr: "redis:6379"
  # Story 2.1: deterministic ThreatScore calculator (FR30). Collapses
  # rule severity and baseline deviation contributions into a single
  # 0-100 score using the formula
  #   total = rule_weight * max(rule_severity)
  #         + baseline_weight * normalised(max_sigma)
  #         + llm_weight * llm_capped_confidence
  # where llm_capped_confidence is zero in Epic 2 and populated by the
  # Epic 3 analyst tier. Defaults pin the algebraic trust-bound
  # max(LLM-only) = 0.3 * 35 = 10.5 < SUSPICIOUS-threshold 20 per
  # prd.md:294. All four knobs are hot-reloadable via FR49.
  score:
    rule_weight: 0.4
    baseline_weight: 0.3
    llm_weight: 0.3
    llm_cap: 35
  # Story 2.2: response-ring FSM dwell guards and de-escalation cooldown
  # (FR31/FR32). The escalation thresholds are reused from
  # confidence_bands above (BI-3); this block adds only the durations
  # those bands do not cover (BI-4). suspicious_dwell_seconds defaults to
  # 0 so a freshly-flagged workload can escalate to RESTRICTED as soon as
  # the score crosses the alert band; the RESTRICTED and QUARANTINED
  # dwells damp oscillation (AC2) and the cooldown gates de-escalation so
  # a single low sample does not de-escalate (AC3). All four are
  # hot-reloadable via FR49: the FSM reads config.Manager.Get() once per
  # Evaluate call, following the Story 2.1 score precedent.
  #
  # Story 2.3: durable FSM-state persistence in Redis with restart recovery
  # (FR37/NFR24). Unlike the dwell/cooldown knobs above (hot-reloadable),
  # persistence_enabled and redis_addr are restart-required: toggling
  # persistence or its Redis target rewires the aggregator's FSM sink and
  # the restore-on-startup hook. The fsm: Redis family carries NO TTL so
  # state survives an arbitrary restart gap. In a Helm install the chart
  # overlays redis_addr with the resolved Redis Service address; the
  # "redis:6379" literal here is the development-host default. The
  # persistence_enabled and redis_addr keys MUST stay directly below
  # deescalation_cooldown_seconds with no intervening comment so the
  # configmap.yaml regex bridge anchors match.
  fsm:
    suspicious_dwell_seconds: 0
    restricted_dwell_seconds: 120
    quarantined_dwell_seconds: 120
    deescalation_cooldown_seconds: 600
    persistence_enabled: true
    redis_addr: "redis:6379"
    # Story 4.1 (FR31): the Helm-tunable kill condition that drives the
    # QUARANTINED -> PRESERVED_KILLED transition. kill_threat_score is the
    # ThreatScore (a fourth band above the QUARANTINED band 70) the score must
    # hold; kill_sustain_seconds is how long it must hold it AND how long the
    # workload must have been QUARANTINED before the kill edge fires. Both are
    # hot-reloadable. These keys sit AFTER redis_addr so they do not break the
    # deescalation_cooldown_seconds -> persistence_enabled -> redis_addr regex
    # anchors the configmap.yaml bridge relies on.
    kill_threat_score: 90
    kill_sustain_seconds: 300

# Story 1.12: Prometheus metrics surface (FR8, FR50). Every Olaitan
# process exposes Prometheus metrics on :9090/metrics from a dedicated
# http.Server running alongside the kubelet probe surface at
# :8080/healthz. The two surfaces have different consumer SLOs so they
# never share a port. Validation rejects an empty address per
# guardrail 27 (the surface is mandatory, not optional).
metrics:
  address: ":9090"

# Story 1.13: per-source per-node rate-limit circuit breaker (FR51
# sensing half; NFR22). Engages above threshold_events_per_sec and
# switches to deterministic hash-based sampling at sampling_rate;
# surviving events carry Sampled=true so downstream consumers (Story
# 1.14 correlator, Story 1.18 detection observability, Story 4.x DFIR
# report writer) can honestly disclose degradation. The four knobs are
# Helm-tunable and hot-reload via the config.Manager.Subscribe callback
# per FR49.
rate_limit:
  enabled: true
  threshold_events_per_sec: 1000
  cooldown_seconds: 60
  sampling_rate: 0.1

response:
  excluded_namespaces:
    - kube-system
    - olaitan

  # Story 2.4: RESTRICTED-state NetworkPolicy enforcement (FR33/NFR6). When
  # enabled, a workload entering the RESTRICTED FSM state is given a
  # NetworkPolicy that allows egress only to the RFC 1918 private ranges
  # (always allowed), the cluster pod/service CIDRs (cluster_cidrs), and any
  # extra_allowed_cidrs, and blocks all other (external) egress so a suspect
  # workload cannot exfiltrate to the internet while internal traffic keeps
  # flowing. Disabled by default; the per-mode (RS/RSL/RSLT) graduated-
  # isolation wiring is Story 2.10. Operators MUST set cluster_cidrs to
  # their own pod and service CIDRs (the defaults below match the kind/
  # Calico evaluation cluster) so in-cluster traffic and DNS (CoreDNS in the
  # service CIDR) survive the egress block. reconcile_interval_seconds is
  # the orphan-GC cadence and must stay within the 60 s budget.
  network_policy:
    enabled: false
    cluster_cidrs:
      - "10.244.0.0/16"
      - "10.96.0.0/12"
    extra_allowed_cidrs: []
    reconcile_interval_seconds: 30

  # Story 2.7: operator-override controller (FR38/FR39). When enabled, a
  # controller polls (LISTs) pods on poll_interval_seconds for the
  # olaitan.io/state-override annotation (with an optional
  # olaitan.io/state-override-ttl), pins the workload's FSM state, and records
  # an override:{workload_id} Redis key with a native TTL equal to the
  # requested duration (default 1h when the TTL annotation is absent). The pin
  # transition routes through the existing FSM sink, so a pinned RESTRICTED/
  # QUARANTINED drives the Story 2.4/2.5 NetworkPolicy enforcement and a pinned
  # CLEAN drives the Story 2.6 removal with no new enforcement code. Release is
  # detected by the poll: native-TTL expiry (Redis key gone) or manual
  # annotation removal both release the pin within one poll interval. An
  # override to PRESERVED_KILLED (Epic 4, not implemented) is rejected with an
  # OVERRIDES.applied {rejected:true, reason:state_unavailable} event and the
  # olaitan_response_override_rejected_total{reason} metric. Disabled by
  # default; observation is poll, never watch (no new RBAC). Full values.yaml
  # mode-surfacing is deferred to Story 2.10 (the Story 2.4 precedent).
  override:
    enabled: false
    poll_interval_seconds: 15
    default_ttl_seconds: 3600
  # Story 2.8: append-only SIEM audit subjects (FR40/NFR16). One flag gates
  # the three subjects (AUDIT.transitions/overrides/policies); off by default
  # (Story 2.10 surfaces it in the graduated-isolation mode). The retention
  # days drive the AUDIT_* JetStream stream MaxAge (90/365/365 d, AC4).
  audit:
    enabled: false
    retention_transitions_days: 90
    retention_overrides_days: 365
    retention_policies_days: 365
    # Story 3.14 (FR41): AUDIT.assessments SIEM-audit stream retention.
    retention_assessments_days: 365
  # Story 4.2: PRESERVED_KILLED forensic capture controller (FR36). When the
  # FSM kills a workload, the controller captures the doomed pod(s) (logs incl.
  # previous, spec/status/events) into a content-addressed forensic bundle,
  # uploads it KMS-encrypted to S3, and only after the upload-ack deletes the
  # pod(s). On S3 failure after retry the pod is NOT deleted and stays
  # QUARANTINED (Story 4.7 retry queue catches up). Off by default. The S3
  # access/secret keys are NFR8 secrets read from S3_ACCESS_KEY / S3_SECRET_KEY
  # env vars, never this file.
  forensics:
    enabled: false
    s3_endpoint: ""
    s3_bucket: ""
    s3_region: ""
    s3_use_ssl: true
    # kms_key_alias is REQUIRED when enabled=true: the agent applies SSE-KMS
    # per PUT, so an empty alias would persist unredacted forensic logs with no
    # agent-applied encryption (config load fails fast in that case).
    kms_key_alias: ""
  # Story 4.3: settling-window controller (FR42/NFR7). When enabled, a workload
  # that stays stable in a non-CLEAN FSM state for window_seconds (default 60)
  # finalises into an IncidentFinalised event on INCIDENTS.finalised, which the
  # Story 4.4 DFIR agent consumes. retention_days drives the INCIDENTS JetStream
  # stream MaxAge (365 d, append-only via LimitsPolicy, audit-grade like the
  # AUDIT_* family). Off by default.
  settling:
    enabled: false
    window_seconds: 60
    retention_days: 365
  # Story 4.4: DFIR forensic-report agent (FR43). When enabled, a durable
  # JetStream consumer on INCIDENTS.finalised produces an analyst-grade
  # ForensicReport (Markdown with YAML front-matter) via the LLM provider and
  # announces it on REPORTS.generated. The DFIR LLM provider/model are config
  # under analyst.dfir_provider / analyst.dfir_model. Off by default (opt-in).
  dfir:
    enabled: false

# Story 3.1: the Ring-5 report layer. The redact sub-block gates the
# AUDIT.redactions SIEM emission (FR41); redaction itself is ALWAYS applied at
# every LLM/persistence boundary regardless of config (turning it off would
# violate NFR15 and is forbidden, BI-7). audit_enabled is off by default: an
# operator without a SIEM pays no NATS-publish cost while still getting full
# redaction. retention_redactions_days drives the AUDIT_REDACTIONS JetStream
# stream MaxAge (365 d, append-only via LimitsPolicy, NFR16). The audit event
# carries field_path + reason + package_id but NEVER the secret value (NFR18).
report:
  redact:
    audit_enabled: false
    retention_redactions_days: 365

analyst:
  provider: api
  api:
    endpoint: ""
    model: ""
    api_key_secret: olaitan-llm
  local:
    endpoint: "http://ollama:11434"
    model: "gemma:2b"
  score_cap: 35
  # Story 3.8 (FR25/FR53): per-role provider routing + ablation toggles.
  # Each *_provider is a concrete family {claude, openai, ollama, none} or
  # "" to inherit the top-level provider mapping (api -> claude, local ->
  # ollama). *_enabled flags drive the RSLT ablation cells. Empty/default
  # values keep the full claude chain; configmap.yaml bridges Helm values
  # over these (the same C11 overlay analyst.provider uses).
  l1_provider: ""
  l1_model: ""
  l2_provider: ""
  l2_model: ""
  l2_enabled: true
  senior_provider: ""
  senior_model: ""
  senior_enabled: true
  # Story 4.4 (FR43): the DFIR forensic-report agent's own LLM provider/model,
  # mirroring the per-role knobs above. dfir_provider is a concrete family
  # {claude, openai, ollama, none} or "" to inherit the top-level mapping
  # (api -> claude, local -> ollama). The DFIR agent is gated by
  # response.dfir.enabled and is a separate JetStream consumer, not a chain
  # tier. configmap.yaml bridges Helm values over these.
  dfir_provider: ""
  dfir_model: ""
  # Story 3.9 (FR29): INVESTIGATIONS checkpoint stream retention. 6h is the
  # architecture default (just enough for controller-restart resume); a
  # Helm value bridges over this.
  checkpoint_retention: 6h
  # Story 3.12 (FR51/NFR23): LLM-tier backpressure circuit breaker. Above
  # rate_per_min LLM-eligible packages/min globally the chain is bypassed
  # (deterministic-only) for a cooling_seconds window. Helm values bridge over
  # these defaults.
  circuit_breaker:
    rate_per_min: 10
    cooling_seconds: 60
    enabled: true
  # Story 3.13 (NFR41, FR49 prompt half): directory the per-role system
  # prompts are loaded from (the Helm prompts ConfigMap mount). A role whose
  # "<role>.txt" is absent uses the binary-embedded default. configmap.yaml
  # bridges Helm's analyst.prompts.mountPath over this so the rendered path
  # always tracks the actual mount.
  prompts_dir: /etc/olaitan/prompts
  timeout: 10s
  chain:
    enabled: false
    l1:
      prompt: config/prompts/l1-triage.tmpl
      model: ""
    l2:
      prompt: config/prompts/l2-review.tmpl
      model: ""
  subtasks:
    enabled: false
    max_per_assessment: 3
    severity_threshold: 70
    timeout: 10s
    available_types:
      - network_forensics
      - privilege_escalation
      - lateral_movement
      - mitre_mapping
      - data_exfiltration
