# Story 4.10 (AC4, BI-6): the in-cluster MinIO fixture for the forensics
# RSLT-full + forensics kind e2e smoke. MinIO is an S3-compatible object store;
# the durable report writer (Story 4.6) and the forensic-bundle uploader
# (Story 4.2) PUT to it under content-addressed, KMS-directive keys. The smoke
# test points the forensics facade (forensics.s3.bucket / kms_key_alias) at this
# in-cluster endpoint so the report PUT is captured with no external egress.
#
# The bucket is created + object-lock-enabled by an init step in
# `make e2e-local-forensics` (mc mb --with-lock); the report bucket MUST be
# object-lock-enabled + versioned (an operator precondition the writer never
# creates, per Story 4.6). s3_use_ssl is set false for this plaintext local
# MinIO via the chart's response.*.s3UseSsl knobs.
#
# NOTE (honest gating, PO Ratification 4): this fixture + the
# forensics_smoke_test.go that drives it are the AC4 TEST CODE. The live kind
# RUN is folded into the carry-forward Epic-3-retro A1 RSLT-full-kind gate
# before Epic 5. The default CI e2e job is RS-arm only and does NOT apply this
# fixture.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # The same image as the forensics-integration CI job, pinned by tag
          # AND digest (deploy/helm/minio_pin_test.go). MinIO archived its
          # community edition and no longer serves minio/minio from Docker
          # Hub or quay.io, so this is pgsty/minio, a maintained fork built
          # with the same Dockerfile: no default server entrypoint (the
          # server command is explicit), and mc is bundled for the bucket
          # provisioning step.
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: "olaitan-e2e"
            - name: MINIO_ROOT_PASSWORD
              value: "olaitan-e2e-secret"
            # Story 10.7. The config validator requires kms_key_alias whenever
            # forensics or the report archive is enabled (a HIGH finding from
            # the Story 4.2 round-1 review: without an alias the uploader skips
            # the SSE-KMS PUT directive and persists UNREDACTED bundles relying
            # only on a bucket default that may not exist). That guard made the
            # shipped validator unsatisfiable against this fixture, which ran
            # with no KMS at all: set the alias and MinIO rejects the PUT,
            # leave it empty and config load fails.
            #
            # MINIO_KMS_SECRET_KEY is MinIO's built-in single-key KMS, intended
            # for exactly this (development and test). The key name must match
            # the kms_key_alias the chart is given. NOT for production, where a
            # real KES/KMS backend belongs.
            - name: MINIO_KMS_SECRET_KEY
              value: "olaitan-e2e-key:b2xhaXRhbi1lMmUtdGVzdC1rbXMta2V5LTMyYnl0ZXM="
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
