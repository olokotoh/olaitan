# kind cluster definition for the CRIU forensic checkpoint feasibility spike.
#
# Pinned to Kubernetes 1.29.14 to match the project's K8s version pin
# (architecture.md:79). The kind v0.27.0 release bundles containerd 2.x
# in its node image; this is NOT the project's pinned containerd 1.7.
# The spike documents this version skew explicitly in the README and
# in the feasibility ADR.
#
# The ContainerCheckpoint feature gate is alpha at K8s 1.29 and must
# be enabled on both the kubelet (where the HTTP endpoint lives) and
# at the apiserver level for cluster-wide consistency.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: olaitan-criu-spike
featureGates:
  ContainerCheckpoint: true
nodes:
  - role: control-plane
    image: kindest/node:v1.29.14@sha256:8703bd94ee24e51b778d5556ae310c6c0fa67d761fae6379c8e0bb480e6fea29
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            feature-gates: "ContainerCheckpoint=true"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            feature-gates: "ContainerCheckpoint=true"
