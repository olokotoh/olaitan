apiVersion: v1
kind: Namespace
metadata:
  name: spike-traffic
---
apiVersion: v1
kind: Pod
metadata:
  name: target
  namespace: spike-traffic
  labels:
    app: target
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: target
  namespace: spike-traffic
spec:
  selector:
    app: target
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: spike-traffic
  labels:
    app: client
spec:
  containers:
    - name: busybox
      image: busybox:1.37
      command: ["sh", "-c", "while true; do wget -q -O - http://target.spike-traffic.svc:80 >/dev/null 2>&1 || true; sleep 1; done"]
