version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Falco's protos use lowercase enum values and a service named `service`,
    # which trips many of buf's STANDARD-suite naming lints. We vendor the
    # files unmodified so a future re-vendor from upstream stays a clean
    # `gh api` fetch + a single sed against go_package, hence the broad
    # except list mirrors the calico-flow spike convention.
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_LOWER_SNAKE_CASE
    - FIELD_LOWER_SNAKE_CASE
    - ENUM_PASCAL_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_ZERO_VALUE_SUFFIX
    - SERVICE_PASCAL_CASE
    - SERVICE_SUFFIX
    - RPC_PASCAL_CASE
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - MESSAGE_PASCAL_CASE
breaking:
  use:
    - FILE
