title: Outbound traffic to stratum mining pool port from tenant Pod
id: OLT-IMPACT-006
description: |
  Detects an outbound TCP flow from a tenant Pod whose destination
  port lies in the standard stratum mining pool port set. This is the
  network half of a cryptomining detection: a process inside the Pod
  has opened a TCP connection to a mining pool endpoint. The Calico
  Goldmane flow exporter emits no severity, so detection rests on the
  stratum-port association scoped to tenant namespaces; the process
  half (OLT-IMPACT-005 on the Falco execve) is the corroborating
  single-source signal the correlator fuses with this one.
status: experimental
attack:
  - T1496
severity: 75
detection:
  outbound_flow:
    event.category: 'flow'
  pool_port:
    network.dst_port:
      - 3333
      - 4444
      - 5555
      - 7777
      - 14444
  tenant_namespace:
    k8s.pod.namespace|startswith: 'tenant-'
  condition: outbound_flow and pool_port and tenant_namespace
falsepositives:
  - Genuine mining workloads in dedicated namespaces; allowlist via a dedicated tenant namespace shape
  - Game servers reusing the 7777 port for tunnelled traffic
fields:
  - network.dst_port
  - k8s.pod.namespace
