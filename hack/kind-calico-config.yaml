# kind cluster config for the Story 10.11 Calico / Goldmane bring-up
# (hack/install-calico-kind.sh).
#
# hack/kind-config.yaml is the e2e cluster and runs kindnetd, which
# accepts NetworkPolicy objects and enforces nothing and ships no
# Goldmane. Neither the Calico flow adapter (FR4) nor the release
# NetworkPolicy can be exercised on it, so this sibling config replaces
# the default CNI with Calico instead.
#
# Used by:
#   `hack/install-calico-kind.sh` (developer and evaluation workflow)
#
# Falco stays ON in every install against this cluster, exactly as on
# the e2e cluster; nothing here turns a sensor off.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Cluster name is supplied via `kind create cluster --name ...` from the
# script so its CLUSTER_NAME override is the single source of truth; do
# not embed the name here or the override is silently ignored.
networking:
  # Calico replaces kindnetd. The Tigera operator installs the CNI
  # plugin once the Installation CR is applied, so bootstrap pods sit
  # without a network until then. That is expected, not a failure.
  disableDefaultCNI: true
  # Calico's own default IPPool CIDR. The Installation CR shipped in
  # the operator's custom-resources.yaml claims 192.168.0.0/16, so the
  # cluster pod CIDR has to match or the CNI hands out addresses the
  # node does not route.
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
    # Same kubelet resource budget as hack/kind-config.yaml, so a
    # containerised cluster on a developer machine does not OOM. Calico
    # plus Goldmane plus the Olaitan chart is a heavier load than the
    # e2e cluster carries, and the reservation is what keeps the node
    # responsive rather than merely alive.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            system-reserved: "cpu=200m,memory=512Mi"
