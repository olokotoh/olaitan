# S2 credential-exfiltration target workload (MITRE T1552, triggers
# OLT-CRED-001 / OLT-CRED-002).
#
# A tenant Deployment with a projected ServiceAccount token. OLT-CRED-001
# fires on a read of /run/secrets/kubernetes.io/serviceaccount/ by a
# non-system process; OLT-CRED-002 fires on an outbound connection to the
# cloud instance-metadata IP 169.254.169.254 from a non-system-namespace pod.
# The workload is a Deployment in a tenant-* namespace so the correlator
# resolves the namespace the rules' not-system-namespace clause checks.
#
# Target image (Story 11.1): curlimages/curl is a real, minimal image built
# for exactly this attack surface (sh + curl + CA bundle), so Story 11.2's
# runner can steal the SA token, use it against the kube API over TLS, and
# request the metadata IP (169.254.169.254). pause could do none of this.
# defaultMode 0644 on the projected token makes it readable by curl's
# non-root user, so the token-theft read actually succeeds in the pod.
# Pinned by tag AND digest per Story 12.6.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-acme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tenant-acme
  labels:
    olaitan.scenario: s2-credential-exfil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Story 11.2a (DP1): bind the least-privilege s2-attacker SA (created by
      # manifests/rbac.yaml, applied first) so the stolen token shows a real,
      # scoped API read (list Secrets in tenant-acme only) instead of a 403.
      serviceAccountName: s2-attacker
      automountServiceAccountToken: true
      containers:
        - name: web
          image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
          # curl is the image ENTRYPOINT; override it to keep the pod Running
          # so the attack runner can exec in.
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          volumeMounts:
            - name: kube-api-access
              mountPath: /run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 0644
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
