# S5 cryptomining target workload (MITRE T1496, triggers OLT-IMPACT-005 /
# OLT-IMPACT-006).
#
# A tenant Deployment NOT labelled as a crypto workload. OLT-IMPACT-005 fires
# on an xmrig/minerd/cpuminer-style process launch in a Deployment-owned
# tenant pod with outbound traffic to a mining-pool port (3333/4444/5555);
# OLT-IMPACT-006 fires on an outbound TCP flow to a stratum pool port
# (3333/4444/5555/7777/14444) with WARNING severity from a tenant pod. The
# workload is a Deployment in a tenant-* namespace so the rules'
# k8s_context / tenant_namespace clauses match; the absence of an
# app.kubernetes.io/component=crypto label keeps the false-positive allowlist
# from suppressing it.
#
# Target image (Story 11.1): busybox gives a real shell, a writable userland
# (so Story 11.2's runner can drop a miner-named process, e.g. copy the
# busybox binary to `xmrig`, the OLT-IMPACT-005 process signature), and nc to
# open the stratum connection to the in-cluster fake pool 11.2 stands up.
# pause could do none of this. Pinned by tag AND digest per Story 12.6.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-acme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tenant-acme
  labels:
    olaitan.scenario: s5-cryptomining
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
