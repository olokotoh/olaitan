# S5 cryptomining target contract (Story 5.2, BI-2).
#
# floor=false because AC6's success criterion is the EXACT state RESTRICTED.
scenario_id: s5
mitre_technique: T1496
target_fsm_state: RESTRICTED
target_time_to_detect_seconds: 120
floor: false
triggering_rules:
  - OLT-IMPACT-005
  - OLT-IMPACT-006

# Story 11.2b (AC4): the real in-cluster primitives the runner executes,
# mapped to their MITRE ATT&CK for Containers ID(s). Cited from the repo rule
# corpus (OLT-IMPACT-005/OLT-IMPACT-006 both tag T1496) and the ATT&CK for
# Containers matrix (T1496 Resource Hijacking). No egress leaves the cluster:
# the miner connects to the in-cluster fake stratum pool 11.2b stands up.
attack_steps:
  - id: stage-miner-process
    mitre:
      - T1496        # Resource Hijacking (xmrig-named miner process launch)
    primitive: copy busybox to a miner-named path (xmrig) and launch it in the tenant pod
  - id: stratum-pool-connect
    mitre:
      - T1496        # Resource Hijacking (stratum pool connection)
    primitive: open an outbound TCP connection from the miner to the in-cluster fake stratum pool on a miner port
