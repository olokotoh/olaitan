# S4 in-cluster C2 sink (Story 11.2b). The ONLY destination the beacon talks
# to, so nothing leaves the cluster (AC2). A busybox TCP listener on the
# C2-favoured web port 8443: the real pod->sink flows Goldmane records trip
# OLT-NET-002 (destination-port match) through the CNI path. Pinned by tag AND
# digest (Story 12.6). The Namespace is declared here too so this manifest
# applies cleanly whether or not the workload manifest has created it yet.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-acme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s4-c2-sink
  namespace: tenant-acme
  labels:
    olaitan.scenario: s4-c2-beaconing
    app: s4-c2-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s4-c2-sink
  template:
    metadata:
      labels:
        app: s4-c2-sink
    spec:
      containers:
        - name: sink
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["/bin/sh", "-c", "while true; do nc -l -p 8443 -w 2 >/dev/null 2>&1 || sleep 1; done"]
          ports:
            - containerPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: s4-c2-sink
  namespace: tenant-acme
  labels:
    olaitan.scenario: s4-c2-beaconing
spec:
  selector:
    app: s4-c2-sink
  ports:
    - port: 8443
      targetPort: 8443
      protocol: TCP
