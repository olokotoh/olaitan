# S4 C2-beaconing target contract (Story 5.2, BI-2).
#
# floor=true because AC5's success criterion is ">=SUSPICIOUS": the named
# state SUSPICIOUS OR any higher state satisfies it (FSM ordering, BI-6). S4
# is the longest window (300s) and the lowest-severity scenario; its
# detection may rest partly on the outbound_unique_dst_ips baseline deviation
# as well as the OLT-NET rule match (BI-4).
scenario_id: s4
mitre_technique: T1071
target_fsm_state: SUSPICIOUS
target_time_to_detect_seconds: 300
floor: true
# Story 11.2b: the real S4 beacon goes to an IN-CLUSTER sink (a Calico
# WorkloadEndpoint, AC2), so it trips OLT-NET-002 (C2 destination port) only.
# OLT-NET-001 now keys on a PUBLIC destination (dest_type=network/dest_name=pub)
# the in-cluster sink is not, by design, so it is no longer an S4 detector.
triggering_rules:
  - OLT-NET-002

# Story 11.2b (AC4): the real in-cluster primitives the runner executes,
# mapped to their MITRE ATT&CK for Containers ID(s). Cited from the repo rule
# corpus (OLT-NET-001/OLT-NET-002 both tag T1071; OLT-NET-002 is T1071.001
# Web Protocols) and the ATT&CK for Containers matrix. No egress leaves the
# cluster: the beacon flows go to the in-cluster sink 11.2b stands up.
attack_steps:
  - id: c2-beacon-flows
    mitre:
      - T1071        # Application Layer Protocol (C2 beaconing)
      - T1071.001    # Web Protocols (the 8443 beacon port)
    primitive: small periodic outbound TCP flows from the tenant pod to the in-cluster C2 sink on a web-looking port
