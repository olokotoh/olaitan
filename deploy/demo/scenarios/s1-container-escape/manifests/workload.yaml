# S1 container-escape target workload (MITRE T1611, triggers OLT-PRIV-001).
#
# A tenant Deployment whose pod runs privileged so that CAP_SYS_ADMIN /
# CAP_SYS_PTRACE are present in the container's effective capability set.
# OLT-PRIV-001 fires on a falco event whose process.cap_effective contains
# CAP_SYS_ADMIN or CAP_SYS_PTRACE for a Deployment/StatefulSet pod outside
# the system namespaces, so the workload MUST be a Deployment in a tenant-*
# namespace (the correlator resolves owner_kind=Deployment + namespace from
# the apiserver, matching OLT-PRIV-001's workload_kind + not-system-namespace
# clauses).
#
# Target image (Story 11.1): busybox is a real, minimal, single-binary
# userland (sh, mount, chroot, nsenter-adjacent coreutils) so Story 11.2's
# real attack runner can `kubectl exec` in and attempt a host-mount escape
# from the privileged container (mount the host disk, chroot onto it, read a
# host path). pause has no shell and cannot be attacked. Pinned by tag AND
# digest per Story 12.6: the tag says what it is, the digest makes it
# reproducible and un-repushable.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-acme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tenant-acme
  labels:
    olaitan.scenario: s1-container-escape
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          # Keep the pod Running so the attack runner can exec into it. sh is
          # the shell the escape attempt runs from.
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
