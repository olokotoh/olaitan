# S1 container-escape target contract (Story 5.2, BI-2).
#
# The machine-readable declaration Story 5.4's metadata writer measures
# `success_criterion_met` / `measured_time_to_detect` against. 5.2 OWNS this
# contract; 5.4 CONSUMES it. floor=false because AC2's success criterion is
# the EXACT state QUARANTINED (not ">=QUARANTINED").
scenario_id: s1
mitre_technique: T1611
target_fsm_state: QUARANTINED
target_time_to_detect_seconds: 30
floor: false
triggering_rules:
  - OLT-PRIV-001

# Story 11.2a (AC3): the real in-cluster primitive the runner executes, mapped
# to its MITRE ATT&CK for Containers ID(s). Cited from the repo rule corpus
# (OLT-PRIV-001/OLT-EXEC-001 both tag T1611) and the ATT&CK for Containers
# matrix (T1610). The scalar mitre_technique above stays the primary contract.
attack_steps:
  - id: privileged-host-escape
    mitre:
      - T1611   # Escape to Host
      - T1610   # Deploy Container (privileged pod)
    primitive: privileged pod; nsenter into pid 1 namespaces / read host view via /proc
