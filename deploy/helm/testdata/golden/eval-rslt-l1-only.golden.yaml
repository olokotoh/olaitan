            - mountPath: /host/proc
              name: proc-fs
            - mountPath: /host/etc
              name: etc-fs
              readOnly: true
            - mountPath: /sys/kernel
              name: sys-fs
              readOnly: true
            - mountPath: /etc/falco/falco.yaml
              name: falco-yaml
              subPath: falco.yaml
            
            - mountPath: /run/falco
              name: grpc-socket-dir
        - name: falcoctl-artifact-follow
          image: docker.io/falcosecurity/falcoctl:0.12.2
