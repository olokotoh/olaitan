apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: olaitan-collector
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: olaitan
      app.kubernetes.io/instance: olaitan
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: olaitan
        app.kubernetes.io/instance: olaitan
        app.kubernetes.io/component: collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: olaitan-collector
      hostNetwork: false
      hostPID: false
      # Pod-level securityContext: distroless nonroot UID 65532. Container
      # securityContext below pins capability drop / read-only rootfs /
      # no-priv-escalation per NFR11.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      # Story 9.6 -- make Falco's gRPC socket reachable by a non-root collector.
      #
      # Falco binds the socket without chmod, so it lands 0755 root:root from
      # the default umask. connect(2) on a Unix socket needs WRITE permission,
      # and the collector is UID/GID 65532 (NFR11), so without this the dial
      # fails with "permission denied" and the collector ingests nothing while
      # Falco itself looks perfectly healthy. Upstream exposes no socket-mode
      # setting (falcosecurity/falco#1351), so the mode is corrected here, from
      # the collector's own pod rather than Falco's -- an operator pointing
      # endpoints.falco at their own Falco DaemonSet needs the same fix, and
      # falco.extra.initContainers would only reach the bundled subchart.
      initContainers:
        - name: falco-socket-permissions
          image: "busybox:1.37.0"
          imagePullPolicy: IfNotPresent
          # Native sidecar (KEP-753): an initContainers entry with
          # restartPolicy: Always starts before the collector and keeps running
          # beside it. Ordering is the reason this is the default -- the socket
          # is already group-writable when the collector makes its first dial.
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              SOCK="/run/falco/falco.sock"
              MODE="0660"
              GID="65532"
              INTERVAL=10
              TIMEOUT=180
        
              log() { echo "falco-socket-permissions: $*"; }
        
              # Say something on startup. Found on a live kind cluster: while Falco is
              # still loading its driver this container produces NO output at all, so
              # an operator debugging a collector that has not come up sees an empty
              # log and cannot tell whether the container is waiting, wedged or
              # misconfigured. One line up front costs nothing and answers that.
              log "holding $SOCK at mode $MODE group $GID, re-checking every ${INTERVAL}s"
        
              # Wait for Falco to create the socket. Driver load can take a
              # minute or more on first start, so a slow appearance is normal and
              # only a total absence is worth failing on.
              wait_for_socket() {
                waited=0
                [ -S "$SOCK" ] || log "waiting for $SOCK to appear (Falco may still be loading its driver; up to ${TIMEOUT}s)"
                while [ ! -S "$SOCK" ]; do
                  if [ "$waited" -ge "$TIMEOUT" ]; then
                    log "$SOCK did not appear within ${TIMEOUT}s."
                    log "Is Falco running on this node, and is endpoints.falco the path it binds?"
                    return 1
                  fi
                  sleep 1
                  waited=$((waited + 1))
                done
                return 0
              }
        
              # Apply, then RE-READ from the filesystem and check the result.
              # A previous attempt at this fix set a Falco config key that does
              # not exist: the render looked right, Falco ignored it, and the
              # socket stayed 0755. Reporting success without observing the
              # outcome is how that would have shipped, so this verifies.
              apply_once() {
                before="$(stat -c '%a %u:%g' "$SOCK" 2>/dev/null)" || return 1
                chgrp "$GID" "$SOCK" 2>/dev/null
                chmod "$MODE" "$SOCK" 2>/dev/null
                after="$(stat -c '%a %u:%g' "$SOCK" 2>/dev/null)" || return 1
                [ "$before" != "$after" ] && log "$SOCK $before -> $after"
                # Group-writable is the property the collector actually needs, so
                # assert that rather than string-matching the requested mode: an
                # operator who sets 0670 or 0770 still passes.
                perms="$(stat -c '%a' "$SOCK" 2>/dev/null)"
                group_bit="$(echo "$perms" | tail -c 3 | head -c 1)"
                case "$group_bit" in
                  2|3|6|7) return 0 ;;
                  *) log "FAILED: $SOCK is $perms, still not group-writable."
                     log "The collector (GID $GID) cannot connect to it."
                     return 1 ;;
                esac
              }
        
              # Hold the permission for the life of the pod. A one-shot fix is
              # not enough: a Falco restart deletes and recreates the socket at
              # 0755, and an init container does not re-run when an app container
              # restarts, so the collector would be locked out until its pod was
              # recreated by hand.
              while true; do
                if [ ! -S "$SOCK" ]; then
                  wait_for_socket || exit 1
                fi
                apply_once || exit 1
                sleep "$INTERVAL"
              done
          securityContext:
            # Root, because only the socket's owner may chmod it and chgrp to a
            # group the process is not in needs CAP_CHOWN. This container does
            # nothing else: no network, no untrusted input, no long-lived
            # parsing. Running the COLLECTOR as root was the rejected
            # alternative -- that would put a root process on the hot path of
            # untrusted event data, which NFR11 exists to prevent.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                # CHOWN: chgrp to a group we are not a member of.
                # FOWNER: chmod when the socket is not root-owned (Falco run as a
                # non-root user under a custom securityContext).
                - CHOWN
                - FOWNER
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 5m
              memory: 16Mi
          volumeMounts:
            # Read-WRITE, unlike the collector's own mount. Changing an inode's
            # mode is a write; a read-only bind mount would return EROFS.
            - name: falco-socket
              mountPath: "/run/falco"
      containers:
        - name: collector
          image: ghcr.io/olokotoh/olaitan:edge
          imagePullPolicy: IfNotPresent
          command: ["/olaitan"]
          args:
            - collector
            - --config=/etc/olaitan/olaitan.yaml
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            # Story 1.12: Prometheus metrics surface (FR8, FR50). The
            # port is mandatory because the metrics surface is the
            # single source of truth for source health and event-rate
            # observability; downstream Stories 1.13/1.14/1.18 inherit
            # this exposition by registering against the same
            # internal/metrics.Registry. The if-guard mirrors the
            # configmap.yaml pattern so a chart deploy with `--set
            # metrics=null` fails fast at render rather than panicking
            # on nil .Values.metrics.containerPort (Review P4).
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: NATS_URL
              value: "nats://olaitan-nats:4222"
            - name: REDIS_ADDR
              value: "olaitan-redis-master:6379"
            - name: FALCO_SOCKET
              value: "unix:///run/falco/falco.sock"
            # Story 1.6: the Falco adapter records the node name on
            # every emitted Event.Pod.Node so host events without K8s
            # pod context still record where they were observed. Sourced
            # from the downward API because os.Hostname() returns the
            # pod name, not the node name, on Kubernetes.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Story 1.19 D6: the collector ring ALSO ensures streams (EVENTS /
            # EVENTS_RAW / EVIDENCE) on startup, so it MUST receive the same
            # per-stream MaxBytes cap as the aggregator (deployment.yaml). Without
            # it the collector creates those streams at their full production
            # MaxBytes (10 / 50 / 100 GiB) and, when it wins the create-stream race
            # against the (capped) aggregator, JetStream returns err 10047
            # "insufficient storage" on a constrained NATS PVC. This was masked in
            # lighter arms where the aggregator usually created the streams first.
            - name: OLT_NATS_STREAM_MAXBYTES_OVERRIDE
              value: "536870912"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          # Container securityContext: strip everything the distroless
          # image does not need. NFR11 compliance; auditor-friendly.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Whole-directory mount -- see Dev Notes § "The ConfigMap-
            # atomic-swap + Story 1.6 contract". Do not introduce subPath.
            - name: config
              mountPath: /etc/olaitan
              readOnly: true
            - name: rules
              mountPath: /etc/olaitan/rules
              readOnly: true
            - name: secrets
              mountPath: /etc/olaitan/secrets
              readOnly: true
            # /tmp emptyDir: readOnlyRootFilesystem=true blocks writes
            # anywhere else; the Go runtime occasionally writes trace
            # artefacts on crash which need a writable path.
            - name: tmp
              mountPath: /tmp
            # Falco gRPC socket bind-mounted from the host. Falco's chart
            # default exposes the socket at /run/falco/falco.sock on the
            # node; the collector pod opens it via the FALCO_SOCKET env
            # var. Read-only because the collector only ever connects
            # (reads) -- never writes -- to the socket. Mounted only when
            # endpoints.falco is a unix:// target; tcp:// targets reach
            # Falco over the pod network and need no host mount.
            - name: falco-socket
              mountPath: /run/falco
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: olaitan-config
        - name: rules
          configMap:
            name: olaitan-rules
        - name: secrets
          secret:
            secretName: olaitan-secrets
            # 0400 = owner read-only. Matches distroless nonroot UID;
            # protects api-key material from accidental world-readable.
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
        - name: falco-socket
          hostPath:
            path: /run/falco
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: nats-box
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nats
    app.kubernetes.io/version: 2.12.6
    helm.sh/chart: nats-2.12.6
  name: olaitan-nats-box
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nats-box
      app.kubernetes.io/instance: olaitan
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nats-box
        app.kubernetes.io/instance: olaitan
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: nats
        app.kubernetes.io/version: 2.12.6
        helm.sh/chart: nats-2.12.6
    spec:
      containers:
      - args:
        - sh
        - -ec
        - trap true INT TERM; sleep infinity & wait
        command:
        - sh
        - -ec
        - |
          work_dir="$(pwd)"
          mkdir -p "$XDG_CONFIG_HOME/nats"
          cd "$XDG_CONFIG_HOME/nats"
          if ! [ -s context ]; then
            ln -s /etc/nats-contexts context
          fi
          if ! [ -f context.txt ]; then
            echo -n "default" > context.txt
          fi
          cd "$work_dir"
          exec /entrypoint.sh "$@"
        - --
        image: natsio/nats-box:0.19.3
        name: nats-box
        resources: null
        volumeMounts:
        - mountPath: /etc/nats-contexts
          name: contexts
      enableServiceLinks: false
      volumes:
      - name: contexts
        secret:
          secretName: olaitan-nats-box-contexts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: olaitan-aggregator
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: aggregator
spec:
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) — see header comment. This is load-bearing
    # for Ring 2 correctness. Changing it to RollingUpdate corrupts the
    # correlator checkpoint under a busy upgrade.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: olaitan
      app.kubernetes.io/instance: olaitan
      app.kubernetes.io/component: aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: olaitan
        app.kubernetes.io/instance: olaitan
        app.kubernetes.io/component: aggregator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: olaitan-aggregator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # OnRootMismatch — kubelet skips the recursive chown of the PVC
        # when the volume root already has the right ownership. Without
        # this, pod restart time grows linearly with the number of files
        # in the reports PVC and quickly blows past the readiness probe
        # budget (initialDelay 3s + 10s × 3 failureThreshold = 33s).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aggregator
          image: ghcr.io/olokotoh/olaitan:edge
          imagePullPolicy: IfNotPresent
          command: ["/olaitan"]
          args:
            - aggregator
            - --config=/etc/olaitan/olaitan.yaml
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            # Story 1.12: Prometheus metrics surface (FR8, FR50). The
            # aggregator exposes posture counters here; Story 1.14 +
            # 1.18 will register correlator and detection metrics on
            # the same Registry. The if-guard mirrors the configmap.yaml
            # pattern so a chart deploy with `--set metrics=null` fails
            # fast at render rather than panicking on nil
            # .Values.metrics.containerPort (Review P4).
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: NATS_URL
              value: "nats://olaitan-nats:4222"
            - name: REDIS_ADDR
              value: "olaitan-redis-master:6379"
            - name: FALCO_SOCKET
              value: "unix:///run/falco/falco.sock"
            # NFR8: Redis AUTH is mandatory. The baseline engine and
            # any future aggregator-side Redis client read the password
            # from this env var rather than parsing the mounted Secret
            # file directly; matches the established 12-factor pattern
            # already used by the subchart for its own Redis pods.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: olaitan-secrets
                  key: redis-password
            # Story 3.16: project the LLM API key Secret into the env var the
            # analyst reads (config analyst.api.api_key_secret, default
            # olaitan-llm). The aggregator runs the investigation chain; the
            # "api" provider (claude / openai_compat) reads its key from this
            # env. An empty Secret value degrades the chain to rules-only
            # (NFR27) -- so this is safe to project unconditionally.
            - name: olaitan-llm
              valueFrom:
                secretKeyRef:
                  name: olaitan-secrets
                  key: llm-api-key
            # Story 1.19 D6: caps every JetStream stream's MaxBytes at
            # the given int64 byte count. Set this in CI/kind where the
            # NATS PVC backing is smaller than the production
            # streamConfigs sum (160 GiB). Production deployments leave
            # this empty and size the NATS PVC instead.
            - name: OLT_NATS_STREAM_MAXBYTES_OVERRIDE
              value: "536870912"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/olaitan
              readOnly: true
            - name: rules
              mountPath: /etc/olaitan/rules
              readOnly: true
            # Story 3.13: the per-role analyst system prompts ConfigMap,
            # mounted read-only. analyst.prompts_dir in the config points
            # here; a role absent from the mount uses the binary-embedded
            # default, so this mount is overridable per role.
            - name: prompts
              mountPath: /etc/olaitan/prompts
              readOnly: true
            - name: secrets
              mountPath: /etc/olaitan/secrets
              readOnly: true
            # DFIR reports — RW mount, aggregator-only. The collector
            # pod spec omits this volume entirely.
            - name: reports
              mountPath: /var/lib/olaitan/reports
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: olaitan-config
        - name: rules
          configMap:
            name: olaitan-rules
        - name: prompts
          configMap:
            name: olaitan-prompts
        - name: secrets
          secret:
            secretName: olaitan-secrets
            defaultMode: 0400
        - name: reports
          persistentVolumeClaim:
            claimName: olaitan-reports
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: nats
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nats
    app.kubernetes.io/version: 2.12.6
    helm.sh/chart: nats-2.12.6
  name: olaitan-nats
spec:
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nats
      app.kubernetes.io/instance: olaitan
      app.kubernetes.io/name: nats
  serviceName: olaitan-nats-headless
  template:
    metadata:
      annotations: null
      labels:
        app.kubernetes.io/component: nats
        app.kubernetes.io/instance: olaitan
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: nats
        app.kubernetes.io/version: 2.12.6
        helm.sh/chart: nats-2.12.6
    spec:
      containers:
      - args:
        - --config
        - /etc/nats-config/nats.conf
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVER_NAME
          value: $(POD_NAME)
        image: nats:2.12.6-alpine
        lifecycle:
          preStop:
            exec:
              command:
              - nats-server
              - -sl=ldm=/var/run/nats/nats.pid
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: nats
        ports:
        - containerPort: 4222
          name: nats
        - containerPort: 8222
          name: monitor
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz?js-server-only=true
            port: monitor
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources: {}
        startupProbe:
          failureThreshold: 90
          httpGet:
            path: /healthz
            port: monitor
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /etc/nats-config
          name: config
        - mountPath: /var/run/nats
          name: pid
        - mountPath: /data
          name: olaitan-nats-js
      - args:
        - -pid
        - /var/run/nats/nats.pid
        - -config
        - /etc/nats-config/nats.conf
        image: natsio/nats-server-config-reloader:0.21.1
        name: reloader
        volumeMounts:
        - mountPath: /var/run/nats
          name: pid
        - mountPath: /etc/nats-config
          name: config
      enableServiceLinks: false
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: olaitan-nats-config
        name: config
      - emptyDir: {}
        name: pid
  volumeClaimTemplates:
  - metadata:
      name: olaitan-nats-js
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: olaitan-redis-master
  namespace: "default"
  labels:
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.6.2
    helm.sh/chart: redis-25.3.11
    app.kubernetes.io/component: master
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: olaitan
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: master
  serviceName: olaitan-redis-headless
  updateStrategy:
