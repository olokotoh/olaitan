                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: olaitan
                    app.kubernetes.io/name: redis
                    app.kubernetes.io/component: master
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
