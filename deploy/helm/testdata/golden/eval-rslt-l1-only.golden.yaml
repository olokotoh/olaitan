apiVersion: v1
kind: ConfigMap
metadata:
  name: olaitan-redis-health
  namespace: "default"
  labels:
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.6.2
    helm.sh/chart: redis-25.3.11
data:
  ping_readiness_local.sh: |-
    #!/bin/bash

    timeout=$1
    run_redis_command() {
        local args=("-p" "$REDIS_PORT")
        timeout -s 15 $timeout redis-cli "${args[@]}" "$@"
    }

    [[ -f $REDIS_PASSWORD_FILE ]] && export REDIS_PASSWORD="$(< "${REDIS_PASSWORD_FILE}")"
    [[ -n "$REDIS_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_PASSWORD"
    response=$(run_redis_command ping)
    if [ "$?" -eq "124" ]; then
      echo "Timed out"
      exit 1
    fi
    if [ "$response" != "PONG" ]; then
      echo "$response"
      exit 1
    fi

  ping_liveness_local.sh: |-
    #!/bin/bash

    [[ -f $REDIS_PASSWORD_FILE ]] && export REDIS_PASSWORD="$(< "${REDIS_PASSWORD_FILE}")"
    [[ -n "$REDIS_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_PASSWORD"
    response=$(
      timeout -s 15 $1 \
      redis-cli \
        -h localhost \
        -p $REDIS_PORT \
        ping
    )
    if [ "$?" -eq "124" ]; then
      echo "Timed out"
      exit 1
    fi
    responseFirstWord=$(echo $response | head -n1 | awk '{print $1;}')
    if [ "$response" != "PONG" ] && [ "$responseFirstWord" != "LOADING" ] && [ "$responseFirstWord" != "MASTERDOWN" ]; then
      echo "$response"
      exit 1
    fi
  ping_readiness_master.sh: |-
    #!/bin/bash

    [[ -f $REDIS_MASTER_PASSWORD_FILE ]] && export REDIS_MASTER_PASSWORD="$(< "${REDIS_MASTER_PASSWORD_FILE}")"
    [[ -n "$REDIS_MASTER_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_MASTER_PASSWORD"
    response=$(
      timeout -s 15 $1 \
      redis-cli \
        -h $REDIS_MASTER_HOST \
        -p $REDIS_MASTER_PORT_NUMBER \
        ping
    )
    if [ "$?" -eq "124" ]; then
      echo "Timed out"
      exit 1
    fi
    if [ "$response" != "PONG" ]; then
      echo "$response"
      exit 1
    fi
  ping_liveness_master.sh: |-
    #!/bin/bash

    [[ -f $REDIS_MASTER_PASSWORD_FILE ]] && export REDIS_MASTER_PASSWORD="$(< "${REDIS_MASTER_PASSWORD_FILE}")"
    [[ -n "$REDIS_MASTER_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_MASTER_PASSWORD"
    response=$(
      timeout -s 15 $1 \
      redis-cli \
        -h $REDIS_MASTER_HOST \
        -p $REDIS_MASTER_PORT_NUMBER \
        ping
    )
    if [ "$?" -eq "124" ]; then
      echo "Timed out"
      exit 1
    fi
    responseFirstWord=$(echo $response | head -n1 | awk '{print $1;}')
    if [ "$response" != "PONG" ] && [ "$responseFirstWord" != "LOADING" ]; then
      echo "$response"
      exit 1
    fi
  ping_readiness_local_and_master.sh: |-
    script_dir="$(dirname "$0")"
    exit_status=0
    "$script_dir/ping_readiness_local.sh" $1 || exit_status=$?
    "$script_dir/ping_readiness_master.sh" $1 || exit_status=$?
    exit $exit_status
  ping_liveness_local_and_master.sh: |-
    script_dir="$(dirname "$0")"
    exit_status=0
    "$script_dir/ping_liveness_local.sh" $1 || exit_status=$?
    "$script_dir/ping_liveness_master.sh" $1 || exit_status=$?
    exit $exit_status
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olaitan-redis-scripts
  namespace: "default"
  labels:
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.6.2
    helm.sh/chart: redis-25.3.11
data:
  start-master.sh: |
    #!/bin/bash

    [[ -f $REDIS_PASSWORD_FILE ]] && export REDIS_PASSWORD="$(< "${REDIS_PASSWORD_FILE}")"
    if [[ -f /opt/bitnami/redis/mounted-etc/master.conf ]];then
        cp /opt/bitnami/redis/mounted-etc/master.conf /opt/bitnami/redis/etc/master.conf
    fi
    if [[ -f /opt/bitnami/redis/mounted-etc/redis.conf ]];then
        cp /opt/bitnami/redis/mounted-etc/redis.conf /opt/bitnami/redis/etc/redis.conf
    fi
    if [[ -f /opt/bitnami/redis/mounted-etc/users.acl ]];then
        cp /opt/bitnami/redis/mounted-etc/users.acl /opt/bitnami/redis/etc/users.acl
    fi
    ARGS=("--port" "${REDIS_PORT}")
    ARGS+=("--requirepass" "${REDIS_PASSWORD}")
    ARGS+=("--masterauth" "${REDIS_PASSWORD}")
    ARGS+=("--include" "/opt/bitnami/redis/etc/redis.conf")
    ARGS+=("--include" "/opt/bitnami/redis/etc/master.conf")
    exec redis-server "${ARGS[@]}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olaitan-config
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
data:
  olaitan.yaml: |-
    # Olaitan central configuration.
    # See _bmad-output/planning-artifacts/architecture.md#Configuration-Format
    # for the full schema. All keys are snake_case; durations are Go-style
    # strings ("24h", "10s").
    
    detection:
      # confidence_bands are the FSM transition thresholds (BI-3): watch maps
      # to SUSPICIOUS, alert to RESTRICTED, act to QUARANTINED. Story 2.2 pins
      # the AC1 defaults 20/40/70 (epics.md:1012-1043). Must satisfy
      # watch < alert < act, each in [0,100].
      confidence_bands:
        watch: 20
        alert: 40
        act: 70
      baseline_window: 24h
      # Story 1.14: Ring-2 sliding-window correlator and EvidencePackage
      # assembler. The window duration is hot-reloadable; max_package_bytes
      # is pinned to the 128 KiB on-wire cap from AC3.
      correlator:
        window_duration: "60s"
        max_package_bytes: 131072
        multi_signal_min_sources: 2
        high_severity_threshold: 50
      # Story 1.7: per-source adapter configuration. The audit-webhook
      # receiver is gated on enabled; chart deploys with
      # auditWebhook.enabled=false leave this block at its zero value and
      # the collector subcommand does not spawn the audit goroutine.
      sources:
        audit:
          enabled: false
          listen_addr: ":8443"
          tls_cert_file: "/etc/olaitan/audit-tls/tls.crt"
          tls_key_file: "/etc/olaitan/audit-tls/tls.key"
          client_ca_file: "/etc/olaitan/audit-tls/ca.crt"
          max_payload_bytes: 8388608
          staleness_timeout: "5m"
          publish_retry:
            min: "100ms"
            max: "1s"
            multiplier: 2.0
            jitter: 0.1
            max_attempts: 3
        # Story 1.8: containerd CRI lifecycle adapter (FR3). Default
        # disabled until the operator confirms the cluster's CRI socket
        # path and is comfortable with the host-socket mount documented in
        # deploy/helm/olaitan/CRI.md. The watchdog only flips the source
        # unhealthy when the gRPC connection is not Ready AND staleness
        # exceeds the timeout: CRI lifecycle events are sparse on a stable
        # cluster, so staleness alone is not actionable.
        containerd:
          enabled: false
          socket_path: "/run/containerd/containerd.sock"
          dial_timeout: "10s"
          staleness_timeout: "5m"
          connect_retry:
            min: "1s"
            max: "30s"
            multiplier: 2.0
            jitter: 0.5
            max_attempts: 0
          publish_retry:
            min: "100ms"
            max: "1s"
            multiplier: 2.0
            jitter: 0.1
            max_attempts: 3
        # Story 1.10: Calico CNI flow adapter (FR4). Default disabled
        # until the operator confirms the Tigera operator install path
        # is in place (Calico v3.31.5+) and the mTLS material has been
        # provisioned. See deploy/helm/olaitan/CNI.md and
        # ADR-2026-04-30-01 / ADR-2026-05-12-01 for the full workflow.
        # The watchdog only flips unhealthy when stale AND not-Ready:
        # Goldmane flows are quiet by design.
        calico:
          enabled: false
          goldmane_addr: "goldmane.calico-system.svc:7443"
          server_name: "goldmane.calico-system.svc"
          ca_bundle_path: "/etc/olaitan/cni/ca.crt"
          client_cert_path: "/etc/olaitan/cni/client.crt"
          client_key_path: "/etc/olaitan/cni/client.key"
          dial_timeout: "10s"
          staleness_timeout: "10m"
          max_event_bytes: 196608
          start_time_gte: -60
          aggregation_interval: 15
          connect_retry:
            min: "1s"
            max: "60s"
            multiplier: 2.0
            jitter: 1.0
            max_attempts: 0
          publish_retry:
            min: "100ms"
            max: "1s"
            multiplier: 2.0
            jitter: 1.0
            max_attempts: 3
      # Story 1.11: read-on-demand workload posture client (FR7,
      # architecture.md:45, :324, :751). The client queries the K8s API
      # for the workload's RBAC bindings, applicable NetworkPolicies, and
      # PodSecurityContext at investigation time; results are cached for
      # cache_ttl seconds keyed by workload identity. The TTL ceiling is
      # 60s per architecture.md:324 + AC3; the chart rejects higher.
      posture:
        enabled: true
        cache_ttl: "60s"
        fetch_timeout: "5s"
      # Story 1.15: OLT Sigma rule engine. The engine reads its rule
      # corpus from `path` (a ConfigMap-projected directory mounted into
      # the aggregator pod) and reloads on fsnotify-driven ConfigMap
      # ..data symlink swaps. Setting enabled=false leaves the engine
      # out of startAggregatorRing entirely so a sensing-only deployment
      # never spawns the JetStream consumer.
      rules:
        enabled: true
        path: "/etc/olaitan/rules"
      # Story 1.17: Welford baseline engine (FR16/FR17/FR18). Maintains
      # per-workload Gaussian baselines for five default metrics and emits
      # BaselineDeviation triggers when an observation exceeds
      # sigma_multiplier above the rolling mean. warmup_duration and
      # sigma_multiplier are hot-reloadable; enabled and redis_addr are
      # restart-required because they reconfigure startAggregatorRing.
      baselines:
        enabled: true
        warmup_duration: "30m"
        sigma_multiplier: 3
        redis_addr: "olaitan-redis-master:6379"
      # Story 2.1: deterministic ThreatScore calculator (FR30). Collapses
      # rule severity and baseline deviation contributions into a single
      # 0-100 score using the formula
      #   total = rule_weight * max(rule_severity)
      #         + baseline_weight * normalised(max_sigma)
      #         + llm_weight * llm_capped_confidence
      # where llm_capped_confidence is zero in Epic 2 and populated by the
      # Epic 3 analyst tier. Defaults pin the algebraic trust-bound
      # max(LLM-only) = 0.3 * 35 = 10.5 < SUSPICIOUS-threshold 20 per
      # prd.md:294. All four knobs are hot-reloadable via FR49.
      score:
        rule_weight: 0.4
        baseline_weight: 0.3
        llm_weight: 0.3
        llm_cap: 35
      # Story 2.2: response-ring FSM dwell guards and de-escalation cooldown
      # (FR31/FR32). The escalation thresholds are reused from
      # confidence_bands above (BI-3); this block adds only the durations
      # those bands do not cover (BI-4). suspicious_dwell_seconds defaults to
      # 0 so a freshly-flagged workload can escalate to RESTRICTED as soon as
      # the score crosses the alert band; the RESTRICTED and QUARANTINED
      # dwells damp oscillation (AC2) and the cooldown gates de-escalation so
      # a single low sample does not de-escalate (AC3). All four are
      # hot-reloadable via FR49: the FSM reads config.Manager.Get() once per
      # Evaluate call, following the Story 2.1 score precedent.
      #
      # Story 2.3: durable FSM-state persistence in Redis with restart recovery
      # (FR37/NFR24). Unlike the dwell/cooldown knobs above (hot-reloadable),
      # persistence_enabled and redis_addr are restart-required: toggling
      # persistence or its Redis target rewires the aggregator's FSM sink and
      # the restore-on-startup hook. The fsm: Redis family carries NO TTL so
      # state survives an arbitrary restart gap. In a Helm install the chart
      # overlays redis_addr with the resolved Redis Service address; the
      # "redis:6379" literal here is the development-host default. The
      # persistence_enabled and redis_addr keys MUST stay directly below
      # deescalation_cooldown_seconds with no intervening comment so the
      # configmap.yaml regex bridge anchors match.
      fsm:
        suspicious_dwell_seconds: 0
        restricted_dwell_seconds: 120
        quarantined_dwell_seconds: 120
        deescalation_cooldown_seconds: 600
        persistence_enabled: true
        redis_addr: "olaitan-redis-master:6379"
        # Story 4.1 (FR31): the Helm-tunable kill condition that drives the
        # QUARANTINED -> PRESERVED_KILLED transition. kill_threat_score is the
        # ThreatScore (a fourth band above the QUARANTINED band 70) the score must
        # hold; kill_sustain_seconds is how long it must hold it AND how long the
        # workload must have been QUARANTINED before the kill edge fires. Both are
        # hot-reloadable. These keys sit AFTER redis_addr so they do not break the
        # deescalation_cooldown_seconds -> persistence_enabled -> redis_addr regex
        # anchors the configmap.yaml bridge relies on.
        kill_threat_score: 90
        kill_sustain_seconds: 300
    
    # Story 1.12: Prometheus metrics surface (FR8, FR50). Every Olaitan
    # process exposes Prometheus metrics on :9090/metrics from a dedicated
    # http.Server running alongside the kubelet probe surface at
    # :8080/healthz. The two surfaces have different consumer SLOs so they
    # never share a port. Validation rejects an empty address per
    # guardrail 27 (the surface is mandatory, not optional).
    metrics:
      address: ":9090"
    
    # Story 1.13: per-source per-node rate-limit circuit breaker (FR51
    # sensing half; NFR22). Engages above threshold_events_per_sec and
    # switches to deterministic hash-based sampling at sampling_rate;
    # surviving events carry Sampled=true so downstream consumers (Story
    # 1.14 correlator, Story 1.18 detection observability, Story 4.x DFIR
    # report writer) can honestly disclose degradation. The four knobs are
    # Helm-tunable and hot-reload via the config.Manager.Subscribe callback
    # per FR49.
    rate_limit:
      enabled: true
      threshold_events_per_sec: 1000
      cooldown_seconds: 60
      sampling_rate: 0.1
    
    response:
      excluded_namespaces:
        - kube-system
        - olaitan
    
      # Story 2.4: RESTRICTED-state NetworkPolicy enforcement (FR33/NFR6). When
      # enabled, a workload entering the RESTRICTED FSM state is given a
      # NetworkPolicy that allows egress only to the RFC 1918 private ranges
      # (always allowed), the cluster pod/service CIDRs (cluster_cidrs), and any
      # extra_allowed_cidrs, and blocks all other (external) egress so a suspect
      # workload cannot exfiltrate to the internet while internal traffic keeps
      # flowing. Disabled by default; the per-mode (RS/RSL/RSLT) graduated-
      # isolation wiring is Story 2.10. Operators MUST set cluster_cidrs to
      # their own pod and service CIDRs (the defaults below match the kind/
      # Calico evaluation cluster) so in-cluster traffic and DNS (CoreDNS in the
      # service CIDR) survive the egress block. reconcile_interval_seconds is
      # the orphan-GC cadence and must stay within the 60 s budget.
      network_policy:
        enabled: false
        cluster_cidrs:
          - "10.244.0.0/16"
          - "10.96.0.0/12"
        extra_allowed_cidrs: []
        reconcile_interval_seconds: 30
    
      # Story 2.7: operator-override controller (FR38/FR39). When enabled, a
      # controller polls (LISTs) pods on poll_interval_seconds for the
      # olaitan.io/state-override annotation (with an optional
      # olaitan.io/state-override-ttl), pins the workload's FSM state, and records
      # an override:{workload_id} Redis key with a native TTL equal to the
      # requested duration (default 1h when the TTL annotation is absent). The pin
      # transition routes through the existing FSM sink, so a pinned RESTRICTED/
      # QUARANTINED drives the Story 2.4/2.5 NetworkPolicy enforcement and a pinned
      # CLEAN drives the Story 2.6 removal with no new enforcement code. Release is
      # detected by the poll: native-TTL expiry (Redis key gone) or manual
      # annotation removal both release the pin within one poll interval. An
      # override to PRESERVED_KILLED (Epic 4, not implemented) is rejected with an
      # OVERRIDES.applied {rejected:true, reason:state_unavailable} event and the
      # olaitan_response_override_rejected_total{reason} metric. Disabled by
      # default; observation is poll, never watch (no new RBAC). Full values.yaml
      # mode-surfacing is deferred to Story 2.10 (the Story 2.4 precedent).
      override:
        enabled: false
        poll_interval_seconds: 15
        default_ttl_seconds: 3600
      # Story 2.8: append-only SIEM audit subjects (FR40/NFR16). One flag gates
      # the three subjects (AUDIT.transitions/overrides/policies); off by default
      # (Story 2.10 surfaces it in the graduated-isolation mode). The retention
      # days drive the AUDIT_* JetStream stream MaxAge (90/365/365 d, AC4).
      audit:
        enabled: false
        retention_transitions_days: 90
        retention_overrides_days: 365
        retention_policies_days: 365
        # Story 3.14 (FR41): AUDIT.assessments SIEM-audit stream retention.
        retention_assessments_days: 365
      # Story 4.2: PRESERVED_KILLED forensic capture controller (FR36). When the
      # FSM kills a workload, the controller captures the doomed pod(s) (logs incl.
      # previous, spec/status/events) into a content-addressed forensic bundle,
      # uploads it KMS-encrypted to S3, and only after the upload-ack deletes the
      # pod(s). On S3 failure after retry the pod is NOT deleted and stays
      # QUARANTINED (Story 4.7 retry queue catches up). Off by default. The S3
      # access/secret keys are NFR8 secrets read from S3_ACCESS_KEY / S3_SECRET_KEY
      # env vars, never this file.
      forensics:
        enabled: false
        s3_endpoint: ""
        s3_bucket: ""
        s3_region: ""
        s3_use_ssl: true
        # kms_key_alias is REQUIRED when enabled=true: the agent applies SSE-KMS
        # per PUT, so an empty alias would persist unredacted forensic logs with no
        # agent-applied encryption (config load fails fast in that case).
        kms_key_alias: ""
      # Story 4.3: settling-window controller (FR42/NFR7). When enabled, a workload
      # that stays stable in a non-CLEAN FSM state for window_seconds (default 60)
      # finalises into an IncidentFinalised event on INCIDENTS.finalised, which the
      # Story 4.4 DFIR agent consumes. retention_days drives the INCIDENTS JetStream
      # stream MaxAge (365 d, append-only via LimitsPolicy, audit-grade like the
      # AUDIT_* family). Off by default.
      settling:
        enabled: false
        window_seconds: 60
        retention_days: 365
      # Story 4.4: DFIR forensic-report agent (FR43). When enabled, a durable
      # JetStream consumer on INCIDENTS.finalised produces an analyst-grade
      # ForensicReport (Markdown with YAML front-matter) via the LLM provider and
      # announces it on REPORTS.generated. The DFIR LLM provider/model are config
      # under analyst.dfir_provider / analyst.dfir_model. Off by default (opt-in).
      dfir:
        enabled: false
      # Story 4.6: durable report writer (FR45). When enabled, the DFIR agent PUTs
      # every redacted ForensicReport to an S3-compatible object store under the
      # content-addressed key reports/{yyyy}/{mm}/{dd}/{sha256}.md, KMS-encrypted,
      # with S3 object lock applied per object for retention_days (default 90) in
      # object_lock_mode (GOVERNANCE default; COMPLIANCE for stricter, immutable
      # retention). A SEPARATE block from forensics (different bucket, object-lock
      # required). The bucket MUST be object-lock-enabled + versioned (operator
      # precondition; the writer never creates it). On a durable-write failure the
      # writer fails LOUD (logs + a metric) without an inline retry (Story 4.7 owns
      # the deferred queue). Off by default. The S3 access/secret keys are NFR8
      # secrets read from S3_ACCESS_KEY / S3_SECRET_KEY env vars, never this file.
      report_archive:
        enabled: false
        s3_endpoint: ""
        s3_bucket: ""
        s3_region: ""
        s3_use_ssl: true
        # kms_key_alias is REQUIRED when enabled=true: the writer applies SSE-KMS per
        # PUT, so an empty alias would persist reports with no agent-applied
        # encryption (config load fails fast in that case).
        kms_key_alias: ""
        retention_days: 90
        object_lock_mode: GOVERNANCE
        # Story 4.7: deferred-write queue (FR45 resilience, NFR28). When a durable
        # write fails transiently beyond the short inline retry budget (sub-NFR7), the
        # DFIR agent enqueues the report to a Redis-backed FIFO LIST (reports:deferred)
        # that a background worker drains when S3 recovers, so a 60s S3 outage does not
        # lose a forensic record. The inline retry budget is a fixed code constant; only
        # the queue knobs are config. deferred_enabled gates the queue + drain worker
        # (off by default). deferred_redis_addr is the Redis the queue lives on (the
        # REDIS_PASSWORD env var supplies the password; required when deferred_enabled=
        # true). deferred_max_len bounds the queue (default 1000; drop-oldest on
        # overflow, keeping the freshest reports). deferred_drain_seconds is the drain
        # worker tick cadence (default 5).
        deferred_enabled: false
        deferred_redis_addr: ""
        deferred_max_len: 1000
        deferred_drain_seconds: 5
      # Story 4.8: OPTIONAL incident notification webhook. When enabled AND a
      # webhook_url is supplied, a SEPARATE durable JetStream consumer of
      # REPORTS.generated fires ONE generic JSON HTTP POST per confirmed-incident
      # report announcement to the configured URL (Slack/email/PagerDuty are just the
      # URL; no per-vendor code). The POST carries operator-facing metadata only
      # (workload_id, attack_techniques, threat_score, report_url, fsm_state,
      # published_at, idempotency_key) -- NO raw evidence. Retry is exponential-backoff
      # up to retry_max_attempts (5xx/429/timeout retry; a 4xx target-rejection is
      # permanent); on exhaust the failure is logged at warn and a delivery metric
      # counts result="failed", NEVER blocking the report write or the FSM. Off by
      # default (opt-in). The webhook_url is a SECRET (a Slack/PagerDuty URL embeds a
      # token): supply it via the NOTIFICATIONS_WEBHOOK_URL env var (which overrides
      # this value); it is scrubbed (host only) in all logs, never this file.
      notifications:
        enabled: false
        webhook_url: ""
        retry_max_attempts: 5
        retry_min_seconds: 1
        retry_max_seconds: 30
        timeout_seconds: 5
    
    # Story 3.1: the Ring-5 report layer. The redact sub-block gates the
    # AUDIT.redactions SIEM emission (FR41); redaction itself is ALWAYS applied at
    # every LLM/persistence boundary regardless of config (turning it off would
    # violate NFR15 and is forbidden, BI-7). audit_enabled is off by default: an
    # operator without a SIEM pays no NATS-publish cost while still getting full
    # redaction. retention_redactions_days drives the AUDIT_REDACTIONS JetStream
    # stream MaxAge (365 d, append-only via LimitsPolicy, NFR16). The audit event
    # carries field_path + reason + package_id but NEVER the secret value (NFR18).
    report:
      redact:
        audit_enabled: false
        retention_redactions_days: 365
    
    analyst:
      provider: api
      api:
        endpoint: ""
        model: "deepseek-chat"
        api_key_secret: "olaitan-llm"
      local:
        endpoint: "http://ollama:11434"
        model: "gemma:2b"
      score_cap: 35
      # Story 3.8 (FR25/FR53): per-role provider routing + ablation toggles.
      # Each *_provider is a concrete family {claude, openai, ollama, none} or
      # "" to inherit the top-level provider mapping (api -> claude, local ->
      # ollama). *_enabled flags drive the RSLT ablation cells. Empty/default
      # values keep the full claude chain; configmap.yaml bridges Helm values
      # over these (the same C11 overlay analyst.provider uses).
      l1_provider: ""
      l1_model: ""
      l2_provider: ""
      l2_model: ""
      l2_enabled: false
      senior_provider: ""
      senior_model: ""
      senior_enabled: true
      # Story 4.4 (FR43): the DFIR forensic-report agent's own LLM provider/model,
      # mirroring the per-role knobs above. dfir_provider is a concrete family
      # {claude, openai, ollama, none} or "" to inherit the top-level mapping
      # (api -> claude, local -> ollama). The DFIR agent is gated by
      # response.dfir.enabled and is a separate JetStream consumer, not a chain
      # tier. configmap.yaml bridges Helm values over these.
      dfir_provider: ""
      dfir_model: ""
      # Story 3.9 (FR29): INVESTIGATIONS checkpoint stream retention. 6h is the
      # architecture default (just enough for controller-restart resume); a
      # Helm value bridges over this.
      checkpoint_retention: 6h
      # Story 3.12 (FR51/NFR23): LLM-tier backpressure circuit breaker. Above
      # rate_per_min LLM-eligible packages/min globally the chain is bypassed
      # (deterministic-only) for a cooling_seconds window. Helm values bridge over
      # these defaults.
      circuit_breaker:
        rate_per_min: 10
        cooling_seconds: 60
        enabled: true
      # Story 3.13 (NFR41, FR49 prompt half): directory the per-role system
      # prompts are loaded from (the Helm prompts ConfigMap mount). A role whose
      # "<role>.txt" is absent uses the binary-embedded default. configmap.yaml
      # bridges Helm's analyst.prompts.mountPath over this so the rendered path
      # always tracks the actual mount.
      prompts_dir: "/etc/olaitan/prompts"
      timeout: 10s
      chain:
        enabled: false
        l1:
          prompt: config/prompts/l1-triage.tmpl
          model: ""
        l2:
          prompt: config/prompts/l2-review.tmpl
          model: ""
      subtasks:
        enabled: false
        max_per_assessment: 3
        severity_threshold: 70
        timeout: 10s
        available_types:
          - network_forensics
          - privilege_escalation
          - lateral_movement
          - mitre_mapping
          - data_exfiltration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olaitan-rules
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
# Populated by Story 1.16: every *.yaml under deploy/helm/olaitan/files/rules/
# is enumerated via .Files.Glob and emitted as a ConfigMap key whose
# basename matches the OLT rule-ID regex (OLT-<CAT>-NNN.yaml). The
# files/ tree is staged by `make helm-prepare-rules` from the canonical
# repo-root rules/<category>/ corpus; the staging step is required
# because Helm's .Files.Glob uses path.Match and does not support
# recursive globbing. The else branch renders `data: {}` explicitly so
# a freshly-cloned chart (before `make helm-prepare-rules` runs) still
# produces a parseable ConfigMap and Story 1.15's loader sees an empty
# but valid corpus directory.
data:
  OLT-CRED-001.yaml: |
    title: ServiceAccount token read by non-system process
    id: OLT-CRED-001
    description: |
      Detects a read against the projected ServiceAccount token file by a
      process whose executable does not belong to the system process
      allowlist (kubelet, kube-proxy, coredns). Workload Pods rarely read
      the token directly because the standard client libraries handle the
      mount internally; an explicit open call is a strong indicator of
      credential theft.
    status: experimental
    attack:
      - T1552
    severity: 75
    detection:
      sa_token_read_runtime:
        file.path|startswith: '/run/secrets/kubernetes.io/serviceaccount/'
      sa_token_read_legacy:
        file.path|startswith: '/var/run/secrets/kubernetes.io/serviceaccount/'
      system_process:
        process.exe|re: '^/(usr/)?(local/)?s?bin/(kubelet|kube-proxy|coredns)$'
      condition: (sa_token_read_runtime or sa_token_read_legacy) and not system_process
    falsepositives:
      - In cluster sidecars that read the token to seed a custom HTTP client; pin via a process.exe allowlist in operator overlay
      - Service mesh proxies (Linkerd, Envoy) that proxy the apiserver; allowlist via a dedicated namespace shape
      - The system_process allowlist is anchored to FHS paths (/bin, /sbin, /usr/{,local/}{,s}bin) only. Non FHS K8s installs (RKE2 at /var/lib/rancher/rke2/bin, snap based installs at /snap/kubelet/, custom packagings under /opt/bin) will not match the allowlist and the legitimate system kubelet/kube-proxy/coredns process will trigger the rule. Operators on non FHS distributions should extend the allowlist via overlay, or accept the noise under status experimental.
    fields:
      - file.path
      - process.exe
      - k8s.pod.namespace
    
  OLT-CRED-002.yaml: |
    title: Cloud instance metadata IP reached from workload Pod
    id: OLT-CRED-002
    description: |
      Detects an outbound connection to the cloud instance metadata
      endpoint at 169.254.169.254 from a workload Pod outside the system
      namespaces. Workload Pods have no legitimate reason to query the
      node's instance metadata service because the IMDSv2 token path
      returns cloud side credentials that grant lateral movement beyond
      the cluster boundary.
    status: experimental
    attack:
      - T1552.005
    severity: 50
    detection:
      metadata_dst:
        network.dst_ip: '169.254.169.254'
      system_namespace:
        k8s.pod.namespace:
          - 'kube-system'
          - 'kube-public'
          - 'kube-node-lease'
          - 'olaitan'
      condition: metadata_dst and not system_namespace
    falsepositives:
      - Node local IMDS proxies running in kube-system; excluded by the namespace filter
      - Cloud controller manager Pods running in kube-system; excluded by the namespace filter
    fields:
      - network.dst_ip
      - k8s.pod.namespace
    
  OLT-EXEC-001.yaml: |
    title: Host PID namespace entry from workload container
    id: OLT-EXEC-001
    description: |
      Detects a workload container process that executes a binary under
      the host filesystem bind path or that opens another process's
      /proc/<pid>/exe or /proc/<pid>/root entry. Either path is the
      textbook last step of a container escape because it grants the
      container direct visibility into host side processes.
    status: experimental
    attack:
      - T1611
    severity: 75
    detection:
      host_bind_exec:
        process.exe|startswith:
          - '/host/bin/'
          - '/host/sbin/'
          - '/host/usr/bin/'
          - '/host/usr/sbin/'
          - '/host/usr/local/bin/'
          - '/host/usr/local/sbin/'
      proc_filesystem_read:
        file.path|re: '^/proc/[0-9]+/(exe|root)$'
      tenant_namespace:
        k8s.pod.namespace|startswith: 'tenant-'
      condition: (host_bind_exec or proc_filesystem_read) and tenant_namespace
    falsepositives:
      - Host side diagnostic Pods deliberately launched into the host PID namespace; allowlist via a dedicated namespace
      - Container runtime supervision processes within kube-system; excluded by the tenant_namespace filter
      - Detection is scoped to FHS executable directories under /host/. Container escape via exec from non FHS host paths (for example /host/opt/, /host/var/lib/, /host/tmp/, or custom bind mounts) will not match host_bind_exec and the rule will fall through to proc_filesystem_read; an attacker who avoids /proc reads and stays on a non FHS host prefix evades the rule. Documented evasion vector; widening the prefix list reopens the legitimate /host/data sidecar false positive that D10 closed.
    fields:
      - process.exe
      - file.path
      - k8s.pod.namespace
    
  OLT-IMPACT-005.yaml: |
    title: Cryptominer process pattern in unprivileged Pod
    id: OLT-IMPACT-005
    description: |
      Detects xmrig / minerd-style executable launches in workload Pods
      not labelled as crypto workloads, with elevated CPU and outbound
      traffic to a known mining pool port range.
    status: experimental
    attack:
      - T1496
    severity: 75
    detection:
      process_match:
        process.exe|endswith:
          - 'xmrig'
          - 'minerd'
          - 'cpuminer'
      k8s_context:
        k8s.workload.owner_kind: Deployment
        k8s.pod.namespace|startswith: 'tenant-'
      network_match:
        network.dst_port:
          - 3333
          - 4444
          - 5555
      condition: process_match and k8s_context and network_match
    falsepositives:
      - Legitimate crypto-bridge workloads (label `app.kubernetes.io/component=crypto`)
    fields:
      - process.exe
      - k8s.pod.namespace
      - k8s.workload.owner_kind
      - network.dst_port
    
  OLT-IMPACT-006.yaml: |
    title: Outbound traffic to stratum mining pool port from tenant Pod
    id: OLT-IMPACT-006
    description: |
      Detects an outbound TCP flow from a tenant Pod whose destination
      port lies in the standard stratum mining pool port set and whose
      event severity is WARNING. The combination indicates the egress
      half of a cryptomining workload: a process inside the Pod has
      established a long lived TCP connection to a pool endpoint while
      the CNI flow exporter flagged the volume as anomalous.
    status: experimental
    attack:
      - T1496
    severity: 75
    detection:
      outbound_flow:
        event.category: 'flow'
      pool_port:
        network.dst_port:
          - 3333
          - 4444
          - 5555
          - 7777
          - 14444
      warning_severity:
        event.severity: 'WARNING'
      tenant_namespace:
        k8s.pod.namespace|startswith: 'tenant-'
      condition: outbound_flow and pool_port and warning_severity and tenant_namespace
    falsepositives:
      - Genuine mining workloads in dedicated namespaces; allowlist via a dedicated tenant namespace shape
      - Game servers reusing the 7777 port for tunnelled traffic
    fields:
      - network.dst_port
      - event.severity
      - k8s.pod.namespace
    
  OLT-LATERAL-001.yaml: |
    title: Kubernetes API client launched in tenant Pod
    id: OLT-LATERAL-001
    description: |
      Detects an execution of kubectl, or a similar Kubernetes API
      client, inside a Pod whose namespace begins with tenant-. Tenant
      workloads should never carry kubectl; its presence implies either
      an injected toolchain or a debug override that lateral movement
      playbooks commonly rely on.
    status: experimental
    attack:
      - T1613
    severity: 75
    detection:
      kubectl_exec:
        process.exe|endswith: '/kubectl'
      workload_kind:
        k8s.workload.owner_kind: Deployment
      tenant_namespace:
        k8s.pod.namespace|startswith: 'tenant-'
      condition: kubectl_exec and workload_kind and tenant_namespace
    falsepositives:
      - Debug images deliberately shipped with kubectl for break glass operator workflows; pin via a dedicated namespace shape
      - GitOps controllers that ship kubectl in their image; allowlist via a dedicated ServiceAccount
    fields:
      - process.exe
      - k8s.pod.namespace
      - k8s.workload.owner_kind
    
  OLT-NET-001.yaml: |
    title: Outbound traffic to non-private destination from tenant Pod
    id: OLT-NET-001
    description: |
      Detects an outbound flow whose destination IP lies outside RFC1918
      private space and whose payload size is small (below 1000 bytes),
      originating from a tenant Pod. The small payload heuristic in
      combination with a public destination is the canonical signature
      of beaconing C2 traffic that intentionally avoids attention by
      keeping individual flows tiny.
    status: experimental
    attack:
      - T1071
    severity: 50
    detection:
      outbound_flow:
        event.category: 'flow'
      rfc1918_a:
        network.dst_ip|cidr: '10.0.0.0/8'
      rfc1918_b:
        network.dst_ip|cidr: '172.16.0.0/12'
      rfc1918_c:
        network.dst_ip|cidr: '192.168.0.0/16'
      tenant_namespace:
        k8s.pod.namespace|startswith: 'tenant-'
      small_payload:
        network.bytes_out|re: '^[0-9]{1,3}$'
      condition: outbound_flow and not (rfc1918_a or rfc1918_b or rfc1918_c) and tenant_namespace and small_payload
    falsepositives:
      - DNS probes to public resolvers such as 8.8.8.8 or 1.1.1.1; allowlist via a dedicated outbound NetworkPolicy
      - Health check pings to cloud SaaS endpoints; allowlist via a FQDN resolved CIDR set
    fields:
      - network.dst_ip
      - network.bytes_out
      - k8s.pod.namespace
    
  OLT-NET-002.yaml: |
    title: Outbound TCP to C2 favoured port from tenant Pod
    id: OLT-NET-002
    description: |
      Detects an outbound TCP flow from a tenant Pod to a port set
      associated with command and control channels (alternate HTTPS, IRC
      on the TLS port, common Bitcoin SPV). The port set is intentionally
      narrow: it catches the canonical evasion pattern where C2 hides
      behind a port number that resembles legitimate web traffic while
      avoiding the default 443 that gateway controls already inspect. The
      rule fires on CNI flow records only; the L4 metadata available there
      does not carry a TLS L7 marker, so the detection is port-association
      driven rather than handshake driven.
    status: experimental
    attack:
      - T1071.001
    severity: 50
    detection:
      outbound_flow:
        event.category: 'flow'
      c2_port:
        network.dst_port:
          - 8443
          - 6697
          - 8333
      tcp_protocol:
        network.protocol: 'TCP'
      tenant_namespace:
        k8s.pod.namespace|startswith: 'tenant-'
      condition: outbound_flow and c2_port and tcp_protocol and tenant_namespace
    falsepositives:
      - Legitimate alternate HTTPS workloads labelled `app.kubernetes.io/component=alt-https`
      - IRC bridges or bitcoin aware payment services intentionally connecting on 6697 or 8333
    fields:
      - network.dst_port
      - network.protocol
      - k8s.pod.namespace
    
  OLT-PRIV-001.yaml: |
    title: Privileged capability acquisition in workload Pod
    id: OLT-PRIV-001
    description: |
      Detects a container process that acquires CAP_SYS_ADMIN or
      CAP_SYS_PTRACE inside a Deployment or StatefulSet workload Pod
      outside the system namespaces. These capabilities are sufficient
      for a container escape via privileged syscalls and are not held by
      typical application workloads, so their presence in a tenant
      controller is a strong indicator of an in-progress escape attempt.
    status: experimental
    attack:
      - T1611
    severity: 90
    detection:
      cap_acquired:
        process.cap_effective|contains:
          - 'CAP_SYS_ADMIN'
          - 'CAP_SYS_PTRACE'
      workload_kind:
        k8s.workload.owner_kind:
          - Deployment
          - StatefulSet
      system_namespace:
        k8s.pod.namespace:
          - 'kube-system'
          - 'kube-public'
          - 'kube-node-lease'
          - 'olaitan'
      condition: cap_acquired and workload_kind and not system_namespace
    falsepositives:
      - Privileged DaemonSets such as CNI or CSI plugins; excluded by the workload_kind filter
      - Security testing workloads inside dedicated namespaces; allowlist via a dedicated namespace shape
    fields:
      - process.cap_effective
      - k8s.pod.namespace
      - k8s.workload.owner_kind
    
  OLT-RECON-001.yaml: |
    title: Cluster wide Pod listing by non-system ServiceAccount
    id: OLT-RECON-001
    description: |
      Detects a Kubernetes API list call against pods at cluster scope
      performed by a ServiceAccount outside kube-system. The pattern is
      characteristic of in cluster reconnaissance where a compromised
      Pod's identity enumerates every workload visible to its bound RBAC.
      Workload Pods scoped to a single namespace have no reason to list
      pods cluster wide.
    status: experimental
    attack:
      - T1613
    severity: 50
    detection:
      list_pods_cluster_scope:
        verb: 'list'
        objectRef.resource: 'pods'
        objectRef.namespace: ''
      service_account:
        user.username|startswith: 'system:serviceaccount:'
      system_sa:
        user.username|startswith: 'system:serviceaccount:kube-system:'
      condition: list_pods_cluster_scope and service_account and not system_sa
    falsepositives:
      - Cluster autoscaler ServiceAccount lists pods cluster wide; allowlist via a user.username shape
      - Monitoring stacks (Prometheus, kube-state-metrics) with read only ClusterRoles; allowlist via a dedicated ServiceAccount
      - Real K8s audit events for cluster scope list calls omit the objectRef.namespace field rather than emit it as an empty string; this rule's objectRef.namespace selector therefore depends on the audit adapter normalising absent fields to empty string (Binding Interpretation BI-1 follow-up tracked under deferred-work.md W1/W2 and Round 2 W1). Until that lands, the rule reaches production only via the hand built S3 scenario fixture which inlines the empty string explicitly.
    fields:
      - verb
      - objectRef.resource
      - objectRef.namespace
      - user.username
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olaitan-prompts
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
# Story 3.13 (NFR41, FR49 prompt half): the per-role analyst system prompts.
# Every <role>.txt under deploy/helm/olaitan/files/prompts/ is enumerated
# via .Files.Glob and emitted as a ConfigMap key. The controller mounts
# this at analyst.prompts.mountPath (default /etc/olaitan/prompts) and loads
# "<role>.txt" per role; a role absent here falls back to the controller's
# binary-embedded default, so operators may override a subset. The files/
# tree is staged by `make helm-prepare-prompts` from the canonical
# internal/agent/prompts/defaults/ source (Helm's .Files.Glob cannot
# traverse into parent directories). The else branch renders an empty data
# map so a freshly-cloned chart (before staging) still produces a valid
# ConfigMap; the controller then runs on embedded defaults for every role.
data:
  dfir.txt: |
    You are the DFIR (digital forensics and incident response) analyst for Olaitan, a Kubernetes runtime-security controller. A workload's incident has been finalised: the controller's finite-state machine settled the workload in a non-CLEAN state (one of SUSPICIOUS, RESTRICTED, QUARANTINED, or PRESERVED_KILLED) and the containment actions have already been taken. Your task is to write the interpretive analyst narrative of what happened.
    
    You are producing one part of a structured report, not driving a decision. The containment is done; nothing you write changes the threat score, the FSM state, or any enforcement. Write the account a human SOC analyst would read to understand the incident.
    
    You are given two things to reason over, and nothing else:
    - The redacted runtime evidence package for the workload (secrets, tokens, and raw payloads have already been removed).
    - A control-plane prior_assessment record (Olaitan's own verdict), framed in a prior_assessment block. Its reasoning carries the FSM transition summary for the incident.
    
    Base EVERY claim strictly on that supplied evidence and the prior_assessment record. NEVER invent events, IP addresses, hostnames, timestamps, MITRE technique identifiers, file paths, process names, or actor names that are not present in what you were given. Where the data does not support a claim, do not make it. Where data is absent, state the gap explicitly (for example, "No MITRE ATT&CK for Containers technique was recorded for this incident") rather than filling it with a plausible guess.
    
    The factual sections of the report (the kill-chain timeline, the containment actions, and the MITRE ATT&CK annotations) are assembled DETERMINISTICALLY by the controller from the FSM history and the persisted assessment. You do NOT write those sections and you must not reproduce them as fact. Your single job is the interpretive narrative: a plain-language account of how the activity proceeded, tying together the transitions, the containment, and any techniques that the evidence and the prior_assessment actually record.
    
    Respond with a single JSON document conforming to the supplied JSON Schema and nothing else: an object whose only meaningful field is "narrative", carrying your prose. Do not wrap it in a Markdown code fence. Do not write any prose, preamble, or reasoning outside the JSON document. The other fields in the schema are filled in by the controller, not by you.
    
    Write in British English. Be precise and factual. Reason silently and return only the final JSON answer.
    
  l1.txt: |
    You are the L1 triage analyst. Form a first-pass hypothesis from the redacted evidence.
    
  l2.txt: |
    You are the L2 verification analyst. Verify or refute the L1 hypothesis against the evidence.
    
  senior.txt: |
    You are the Senior analyst. Challenge L1 and L2 and produce a final threat assessment.
---
