---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: olaitan-redis
  namespace: "default"
  labels:
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 8.6.2
    helm.sh/chart: redis-25.3.11
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: olaitan
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
    - Egress
  egress:
    - {}
  ingress:
    # Allow inbound connections
    - ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: olaitan
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: olaitan
      app.kubernetes.io/instance: olaitan
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: olaitan
              app.kubernetes.io/instance: olaitan
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: "10.96.0.1/32"
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - podSelector: {}
---
