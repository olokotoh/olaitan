  kind: ClusterRole
  name: olaitan-aggregator
subjects:
  - kind: ServiceAccount
    name: olaitan-aggregator
    namespace: default
---
# Collector: namespace-scoped pod/event reads. The collector enriches
# events for pods it sees on its own node; it MUST NOT be able to
# enumerate pods in unrelated namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: olaitan-collector
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: collector
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: olaitan-collector-binding
  namespace: default
  labels:
    helm.sh/chart: olaitan-CHART_VERSION_REDACTED
    app.kubernetes.io/name: olaitan
    app.kubernetes.io/instance: olaitan
    app.kubernetes.io/version: "APP_VERSION_REDACTED"
    app.kubernetes.io/managed-by: Helm
