# k3s / k3d overlay.
#
#   helm install olaitan oci://ghcr.io/olokotoh/charts/olaitan \
#     --version 1.0.0-rc4 \
#     -f values-k3s.yaml --namespace olaitan --create-namespace
#
# Deltas only. Template-verified, NOT verified.

platform: k3s

containerdSensor:
  # THE k3s delta. k3s bundles its own containerd and puts the socket under
  # /run/k3s/, not the standard path the chart defaults to. With the default
  # path the adapter finds no socket and the source stays DEGRADED. Story
  # 12.7: the sensor is on by default, and the chart also switches to this
  # path by itself when it detects k3s; this line makes it explicit (and
  # covers a k3s the chart cannot detect).
  socketPath: /run/k3s/containerd/containerd.sock

# AUDIT WEBHOOK. AVAILABLE here, unlike the managed platforms: k3s runs its
# own API server and you can pass --audit-webhook-config-file via
# --kube-apiserver-arg. Story 12.7: on by default, so the receiver is up and
# its kubeconfig is in Secret <fullname>-audit-webhook-kubeconfig; it stays
# DEGRADED until the API server is pointed at it (hack/audit-apiserver-patch.yaml).

# STORAGE. k3s ships local-path as the default StorageClass, so no override is
# needed. It is node-local: a rescheduled NATS pod will not find its data on
# another node. Single-node k3s is unaffected.
#
# NETWORKPOLICY. k3s bundles kube-router's policy controller and DOES enforce
# by default, unlike kind. Confirm with hack/check-netpol-enforcement.sh before
# enabling response.networkPolicy.
