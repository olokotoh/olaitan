{{/*
RBAC model (ring-scoped, no wildcards, no cluster-admin — NFR13).
Source of truth: architecture.md#K8s-API-Boundaries-(RBAC) lines 949-957.

  Collector (Ring 1): pod/event GET/LIST/WATCH inside its install
  namespace only. Narrower than the aggregator because the collector
  only enriches events for pods it already sees via the kubelet — an
  auditor reviewing the chart should see that the collector CANNOT
  enumerate pods cluster-wide.

  Aggregator (Rings 2-4): namespaced resources, cluster-wide reach.
    - networkpolicies (networking.k8s.io): CREATE/UPDATE/DELETE — must
      write into every pod's namespace, hence ClusterRole.
    - pods: PATCH — annotation updates for FSM state transitions
      (Ring 4a). Also cluster-wide.
    - pods, events: GET/LIST — pod metadata lookup for enrichment.

Do not shrink either role to a Role+RoleBinding pair — the aggregator
genuinely needs cluster-wide write on NetworkPolicy to enforce responses
in operator workload namespaces. See Dev Notes § "RBAC: Role vs ClusterRole split".
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "olaitan.collector.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "olaitan.aggregator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: aggregator
---
# Collector: namespace-scoped pod/event reads. The collector enriches
# events for pods it sees on its own node; it MUST NOT be able to
# enumerate pods in unrelated namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "olaitan.collector.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "olaitan.collector.serviceAccountName" . }}-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "olaitan.collector.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "olaitan.collector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Aggregator: cluster-wide. NetworkPolicy writes and pod annotation
# patches must reach every workload namespace; a Role would constrain
# us to a single namespace, which does not match the operator model.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "olaitan.aggregator.serviceAccountName" . }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: aggregator
rules:
  # Ring 4: response engine writes NetworkPolicy into every pod's ns.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "delete"]
  # Ring 4a: annotation-based FSM state transitions — patch only, no
  # delete, no exec. The agent flips pod labels/annotations to mark FSM
  # state; it never kills pods directly (that is kubelet's job via the
  # taint Ring 4 puts on the node/policy).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
  # Enrichment reads for correlator + analyst context assembly. GET/LIST
  # only — no WATCH (events flow through Ring 1's NATS publish path, not
  # direct watchers on the aggregator).
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  # Story 1.11 posture client (FR7): read-on-demand RBAC bindings,
  # NetworkPolicies, ServiceAccounts, and owner-controllers
  # (Deployment/ReplicaSet/StatefulSet/DaemonSet/Job/CronJob) for the
  # workload-identity walk plus posture assembly. Per
  # architecture.md:257 the controller ServiceAccount holds get,list
  # only on these resources (no watch, no wildcards). The
  # NetworkPolicy "get,list" verb-set composes additively with the
  # Ring 4 "create,update,delete" rule above; Kubernetes RBAC unions
  # verbs per resource.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings", "roles", "clusterroles"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list"]
{{- if and .Values.response .Values.response.forensics .Values.response.forensics.enabled }}
  # Story 4.2 forensic capture (FR36): when the PRESERVED_KILLED forensic
  # controller is enabled, the aggregator must read each doomed pod's logs
  # (including the previous terminated container's logs) and DELETE the pod
  # strictly AFTER the forensic bundle is durably uploaded to S3. This widens
  # the Ring-4 pod verb-set beyond the default patch/get/list ONLY when
  # forensics.enabled=true, so a deployment that never kills pods keeps the
  # narrower posture (architecture.md RBAC errata: pod delete is a Story 4.2
  # addition gated on the forensic controller). Kubernetes RBAC unions verbs
  # per resource, so this composes additively with the patch/get/list rules.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "olaitan.aggregator.serviceAccountName" . }}-binding
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: aggregator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "olaitan.aggregator.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "olaitan.aggregator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
