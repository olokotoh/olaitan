{{/*
Ring 1 collector -- one pod per node, receives Falco alerts, K8s audit,
and cgroup signals; publishes enriched events to NATS.

hostNetwork: false, hostPID: false. Falco already owns the host-level
signal-capture side on each node and POSTs its alerts to this pod over
HTTP through the node-local falco-ingest Service (Story 10.2), so the
collector needs no host mount for Falco at all. An auditor reviewing the
pod spec sees no host-level escape surface unless the containerd sensor
is enabled.
*/}}
{{- if .Values.containerdSensor.enabled }}
{{- /* Story 10.9 review: sprig's int turns a typo or an empty string into
       0, root's group, silently. Require a non-negative integer. */ -}}
{{- $sg := .Values.containerdSensor.socketGroup }}
{{- if kindIs "string" $sg }}
{{- if not (regexMatch "^[0-9]+$" $sg) }}
{{- fail (printf "containerdSensor.socketGroup must be a non-negative integer GID (got %q); check a node with `stat -c %%g /run/containerd/containerd.sock`" $sg) }}
{{- end }}
{{- else if or (kindIs "invalid" $sg) (lt (int64 $sg) 0) }}
{{- fail (printf "containerdSensor.socketGroup must be a non-negative integer GID (got %v)" $sg) }}
{{- end }}
{{- $sp := default "" .Values.containerdSensor.socketPath }}
{{- if eq $sp "" }}
{{- fail "containerdSensor.socketPath is required when containerdSensor.enabled=true. Default is /run/containerd/containerd.sock for stock containerd 1.7 on kubeadm; override only if your cluster uses a non-standard install layout. See deploy/helm/olaitan/CRI.md for guidance." }}
{{- end }}
{{- /* P16: reject paths that would mount unsafe locations or render
       a malformed volume. Absolute path required (relative paths are
       interpreted relative to the host's cwd, which is meaningless
       for hostPath); reject "/" and "/<anything>/" with no parent
       directory because dir(socketPath) would resolve to "/" and
       expose the entire host root. Also reject shell metachars
       ($, `, ;) so a values file pasted from a shell snippet cannot
       smuggle expansion into a literal yaml string. */}}
{{- if not (hasPrefix "/" $sp) }}
{{- fail (printf "containerdSensor.socketPath must be an absolute path (got %q). Examples: /run/containerd/containerd.sock or /run/k3s/containerd/containerd.sock." $sp) }}
{{- end }}
{{- $spTrim := $sp }}
{{- if and (gt (len $spTrim) 1) (hasSuffix "/" $spTrim) }}
{{- $spTrim = trimSuffix "/" $spTrim }}
{{- end }}
{{- if eq (dir $spTrim) "/" }}
{{- fail (printf "containerdSensor.socketPath would mount the host root (dir(%q)=\"/\"). Set socketPath to a real socket nested under at least one parent directory, e.g. /run/containerd/containerd.sock." $sp) }}
{{- end }}
{{- if regexMatch "[\\$\\`;]" $sp }}
{{- fail (printf "containerdSensor.socketPath contains shell metacharacters (got %q); paste a literal path without quoting/expansion characters." $sp) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "olaitan.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      {{- include "olaitan.collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olaitan.collector.selectorLabels" . | nindent 8 }}
      {{- /* Story 1.12: Prometheus scrape annotations, gated by
             metrics.scrapeAnnotations so a Prometheus-Operator-driven
             deployment can disable them and rely on a ServiceMonitor
             resource (future Story 1.18 follow-up). */ -}}
      {{- if and .Values.metrics .Values.metrics.scrapeAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.containerPort | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      serviceAccountName: {{ include "olaitan.collector.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: false
      hostPID: false
      # Pod-level securityContext: distroless nonroot UID 65532. Container
      # securityContext below pins capability drop / read-only rootfs /
      # no-priv-escalation per NFR11.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: {{ include "olaitan.collector.runAsGroup" . }}
        fsGroup: 65532
        {{- if .Values.containerdSensor.enabled }}
        # Story 10.9: the containerd socket is 0660 root:root on stock
        # nodes, so the non-root collector joins the socket's group to
        # connect(2). It stays UID 65532; group 0 only matters on the
        # read-only socket mount, since the image's own filesystem is
        # read-only. Set containerdSensor.socketGroup to your socket's GID.
        supplementalGroups: [{{ int64 .Values.containerdSensor.socketGroup }}]
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- if .Values.collector.runOnControlPlane }}
        # Control-plane taint tolerated only when opt-in. See
        # values.yaml:collector.runOnControlPlane for rationale.
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        {{- end }}
        {{- with .Values.collector.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "olaitan.falcoIngest.validate" . }}
      containers:
        - name: collector
          image: {{ include "olaitan.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/olaitan"]
          args:
            - collector
            - --config=/etc/olaitan/olaitan.yaml
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            # Story 1.12: Prometheus metrics surface (FR8, FR50). The
            # port is mandatory because the metrics surface is the
            # single source of truth for source health and event-rate
            # observability; downstream Stories 1.13/1.14/1.18 inherit
            # this exposition by registering against the same
            # internal/metrics.Registry. The if-guard mirrors the
            # configmap.yaml pattern so a chart deploy with `--set
            # metrics=null` fails fast at render rather than panicking
            # on nil .Values.metrics.containerPort (Review P4).
            {{- if .Values.metrics }}
            - name: metrics
              containerPort: {{ .Values.metrics.containerPort }}
              protocol: TCP
            {{- end }}
            # Story 10.2: Falco's http_output posts every alert here, via
            # the node-local falco-ingest Service.
            - name: falco-ingest
              containerPort: {{ .Values.falcoIngest.port }}
              protocol: TCP
            {{- if .Values.auditWebhook.enabled }}
            {{- include "olaitan.auditWebhook.validate" . }}
            # Story 1.7 audit-webhook receiver port, dialled by the
            # kube-apiserver at the address in the audit kubeconfig
            # (templates/audit-webhook-kubeconfig-secret.yaml).
            #
            # Story 10.8 (#137 B2): with auditWebhook.hostPort set, the
            # receiver is also published on the node, so an apiserver on
            # the host network reaches its OWN node's collector at
            # 127.0.0.1 with no cluster DNS and no Service in the path.
            # auditWebhook.hostIP (default 127.0.0.1) keeps that port off
            # the node's other interfaces; empty binds all of them.
            - name: audit-webhook
              containerPort: {{ .Values.auditWebhook.containerPort }}
              {{- if ne (int (default 0 .Values.auditWebhook.hostPort)) 0 }}
              hostPort: {{ int .Values.auditWebhook.hostPort }}
              {{- with (default "" .Values.auditWebhook.hostIP | toString | trim) }}
              hostIP: {{ . | quote }}
              {{- end }}
              {{- end }}
              protocol: TCP
            {{- end }}
          env:
            - name: NATS_URL
              value: {{ include "olaitan.endpoints.nats" . | quote }}
            - name: REDIS_ADDR
              value: {{ include "olaitan.endpoints.redis" . | quote }}
            # Story 10.10: track applog sidecar heartbeats only when applog is on.
            - name: OLAITAN_APPLOG_ENABLED
              value: {{ .Values.applogSidecar.enabled | toString | quote }}
            - name: FALCO_LISTEN_ADDR
              value: {{ printf ":%v" .Values.falcoIngest.port | quote }}
            # Read from the mounted release Secret (below), not an env
            # var, so the token stays out of `kubectl describe pod`.
            - name: FALCO_HTTP_TOKEN_FILE
              value: /etc/olaitan/secrets/falco-http-token
            # Story 1.6: the Falco adapter records the node name on
            # every emitted Event.Pod.Node so host events without K8s
            # pod context still record where they were observed. Sourced
            # from the downward API because os.Hostname() returns the
            # pod name, not the node name, on Kubernetes.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.nats.streamMaxBytesOverride }}
            # Story 1.19 D6: the collector ring ALSO ensures streams (EVENTS /
            # EVENTS_RAW / EVIDENCE) on startup, so it MUST receive the same
            # per-stream MaxBytes cap as the aggregator (deployment.yaml). Without
            # it the collector creates those streams at their full production
            # MaxBytes (10 / 50 / 100 GiB) and, when it wins the create-stream race
            # against the (capped) aggregator, JetStream returns err 10047
            # "insufficient storage" on a constrained NATS PVC. This was masked in
            # lighter arms where the aggregator usually created the streams first.
            - name: OLT_NATS_STREAM_MAXBYTES_OVERRIDE
              value: {{ . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          # Container securityContext: strip everything the distroless
          # image does not need. NFR11 compliance; auditor-friendly.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Whole-directory mount -- see Dev Notes § "The ConfigMap-
            # atomic-swap + Story 1.6 contract". Do not introduce subPath.
            - name: config
              mountPath: /etc/olaitan
              readOnly: true
            - name: rules
              mountPath: /etc/olaitan/rules
              readOnly: true
            - name: secrets
              mountPath: /etc/olaitan/secrets
              readOnly: true
            # /tmp emptyDir: readOnlyRootFilesystem=true blocks writes
            # anywhere else; the Go runtime occasionally writes trace
            # artefacts on crash which need a writable path.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.auditWebhook.enabled }}
            # Story 1.7: receiver TLS material (serving cert+key plus
            # cluster-CA bundle for verifying the apiserver client
            # cert). Mounted readonly; rendered by templates/
            # audit-webhook-tls-secret.yaml only when enabled=true.
            - name: audit-tls
              mountPath: /etc/olaitan/audit-tls
              readOnly: true
            {{- end }}
            {{- if .Values.containerdSensor.enabled }}
            # Story 1.8: containerd CRI socket bind-mounted from the
            # host. We mount the parent directory rather than the
            # socket file directly so a containerd restart that
            # removes-and-recreates the socket inode is observed by
            # the agent without a remount. Security boundary: this is
            # the collector's only host mount; see
            # deploy/helm/olaitan/CRI.md for the threat model.
            - name: containerd-socket
              mountPath: {{ dir .Values.containerdSensor.socketPath | quote }}
              # P2: read-only. The adapter only opens GetContainerEvents
              # (a server-streaming RPC) and never writes to the socket
              # inode. K8s hostPath best practice and 2026 Falco install
              # guidance both treat runtime-socket mounts as read-only;
              # no production CRI client requires write permission on
              # the parent directory.
              readOnly: true
            {{- end }}
            {{- if .Values.calicoSensor.enabled }}
            # Story 1.10: Calico Goldmane mTLS material. Mounted as a
            # Secret (read-only) under /etc/olaitan/cni/. The CNI
            # adapter reads ca.crt, client.crt, and client.key from
            # disk on every connect-loop iteration so cert-manager-
            # driven rotations are picked up without an adapter
            # restart. See deploy/helm/olaitan/CNI.md.
            - name: cni-tls
              mountPath: /etc/olaitan/cni
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "olaitan.fullname" . }}-config
        - name: rules
          configMap:
            name: {{ include "olaitan.fullname" . }}-rules
        - name: secrets
          secret:
            secretName: {{ include "olaitan.fullname" . }}-secrets
            # 0400 = owner read-only. Matches distroless nonroot UID;
            # protects api-key material from accidental world-readable.
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
        {{- if .Values.auditWebhook.enabled }}
        - name: audit-tls
          secret:
            secretName: {{ include "olaitan.fullname" . }}-audit-tls
            defaultMode: 0400
        {{- end }}
        {{- if .Values.containerdSensor.enabled }}
        - name: containerd-socket
          hostPath:
            path: {{ dir .Values.containerdSensor.socketPath | quote }}
            # P3: Directory (not DirectoryOrCreate). On a misconfigured
            # node (CRI-O cluster, tainted node, k3s without
            # /run/containerd) DirectoryOrCreate would silently
            # materialise an empty root-owned directory and pollute the
            # host filesystem; Directory fails the pod loudly so the
            # operator notices the misconfiguration.
            type: Directory
        {{- end }}
        {{- if .Values.calicoSensor.enabled }}
        - name: cni-tls
          secret:
            # Path A consumes the cert-manager-issued Secret directly;
            # Path B consumes the chart-rendered Secret (see
            # templates/cni-tls-secret.yaml). The two paths converge
            # on a single mount via this if/else.
            {{- if .Values.calicoSensor.tls.certManagerSecretName }}
            secretName: {{ .Values.calicoSensor.tls.certManagerSecretName | quote }}
            # Story 10.11 AC2: a cert-manager Certificate writes a
            # kubernetes.io/tls Secret, whose keys are tls.crt and
            # tls.key. The adapter opens client.crt and client.key
            # (config/olaitan.yaml detection.sources.calico), and a
            # missing file is a terminal error, so Path A used to
            # CrashLoop the collector. Project the cert-manager keys
            # onto the names the adapter reads. Path B renders its own
            # Secret with those names already and needs no projection.
            #
            # All three source keys are values, not chart constants. The
            # cert-manager defaults (tls.crt / tls.key / ca.crt) are the
            # common case, but a Secret assembled by hand, copied from
            # another namespace, or written by something that is not
            # cert-manager can carry the same material under other names,
            # and hardcoding two of the three turned such a Secret from
            # "works unprojected" into "hangs in ContainerCreating".
            # Every one is checked against the Secret-key charset by
            # olaitan.secretKeyName, so a bad name fails the render with
            # a message rather than at pod admission without one.
            items:
              - key: {{ include "olaitan.secretKeyName" (dict "value" .Values.calicoSensor.tls.certManagerCertKey "name" "calicoSensor.tls.certManagerCertKey") | quote }}
                path: client.crt
              - key: {{ include "olaitan.secretKeyName" (dict "value" .Values.calicoSensor.tls.certManagerKeyKey "name" "calicoSensor.tls.certManagerKeyKey") | quote }}
                path: client.key
              # ca.crt is only populated when the issuer supplies a CA,
              # and some issuers publish it under another key. See
              # CNI.md "Path A".
              - key: {{ include "olaitan.secretKeyName" (dict "value" .Values.calicoSensor.tls.certManagerCAKey "name" "calicoSensor.tls.certManagerCAKey") | quote }}
                path: ca.crt
            {{- else }}
            secretName: {{ include "olaitan.fullname" . }}-cni-tls
            {{- end }}
            defaultMode: 0400
        {{- end }}
