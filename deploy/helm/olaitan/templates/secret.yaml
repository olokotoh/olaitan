{{/*
Operator-provided secrets — three keys aligned with architecture.md:730.
This Secret is the single source of truth that both the Olaitan pods
and the Bitnami Redis subchart (via `redis.auth.existingSecret`) read
from. The Secret always renders so downstream pods can mount it
unconditionally (see Dev Notes § "Secrets").

Ring-level contract (enforced outside this chart):
  - redis-password: consumed by internal/redis client AND by the Redis
    subchart for its own AUTH. Both sides read the same key here.
  - nats-creds: consumed by internal/nats client. Empty → anonymous
    JetStream access (demo default). Required when NATS cluster auth is on.
  - llm-api-key: consumed by Epic 4 analyst ring. Empty → analyst refuses
    to start when provider=api. Local (Ollama) provider ignores this key.

Provisioning flow: operators supply real values via
  helm install ... --set-file secrets.llmApiKey=./my-llm.txt
or an external-secrets-operator (ESO) reconciliation that targets the
same Secret name. The chart does NOT auto-generate passwords — secret
lifecycle belongs to the operator's SRE toolchain (Vault/ESO/SOPS).
*/}}
{{- /*
Fail-fast guard: if the Bitnami Redis subchart is enabled and the
operator has not supplied a redisPassword, the subchart will refuse
AUTH and the aggregator restart-loops with no clear root cause. Render
a loud error instead.
*/}}
{{- if and .Values.redis.enabled (not .Values.secrets.redisPassword) }}
{{- fail "secrets.redisPassword is required when redis.enabled=true. Provide via --set-file secrets.redisPassword=./password.txt or --set secrets.redisPassword='...'." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olaitan.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  nats-creds: {{ .Values.secrets.natsCreds | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | quote }}
  # Story 4.2 (FR36/NFR8): S3 credentials for the forensic capture uploader.
  # Consumed by internal/response/forensics when response.forensics.enabled=true.
  # Empty -> the controller refuses to start when forensics is enabled.
  s3-access-key: {{ .Values.secrets.s3AccessKey | default "" | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | default "" | quote }}
  # Story 4.8 (NFR8): the OPTIONAL incident notification webhook URL (a
  # Slack/PagerDuty URL embeds a token). Consumed by internal/report/notify when
  # response.notifications.enabled=true. Empty -> the webhook is not wired.
  #
  # Story 4.10 (BI-3): the operator-facing facade notifications.webhook_url
  # OVERLAYS secrets.notificationsWebhookUrl here (facade WINS when set), so
  # the secret -> NOTIFICATIONS_WEBHOOK_URL env projection (deployment.yaml)
  # carries the facade value. A non-empty facade value takes precedence; an
  # empty facade value falls back to the secrets.* value (and empty -> "").
  {{- $notifFac := default (dict) .Values.notifications }}
  {{- $facadeWebhook := default "" $notifFac.webhook_url }}
  {{- $secretWebhook := default "" .Values.secrets.notificationsWebhookUrl }}
  notifications-webhook-url: {{ (ternary $facadeWebhook $secretWebhook (ne $facadeWebhook "")) | quote }}
