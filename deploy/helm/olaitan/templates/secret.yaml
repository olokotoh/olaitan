{{/*
Operator-provided secrets — three keys aligned with architecture.md:730.
All three default to empty strings so this Secret always renders and
downstream pods can mount it unconditionally (see Dev Notes § "Secrets").

Ring-level contract (enforced outside this chart):
  - redis-password: consumed by internal/redis client. Empty → Redis
    AUTH disabled path (demo cluster only). Production MUST set this.
  - nats-creds: consumed by internal/nats client. Empty → anonymous
    JetStream access (demo default). Required when NATS cluster auth is on.
  - llm-api-key: consumed by Epic 4 analyst ring. Empty → analyst refuses
    to start when provider=api. Local (Ollama) provider ignores this key.

Provisioning flow: operators supply real values via
  helm install ... --set-file secrets.llmApiKey=./my-llm.txt
or an external-secrets-operator (ESO) reconciliation that targets the
same Secret name. The chart does NOT auto-generate passwords — secret
lifecycle belongs to the operator's SRE toolchain (Vault/ESO/SOPS).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olaitan.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  nats-creds: {{ .Values.secrets.natsCreds | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | quote }}
