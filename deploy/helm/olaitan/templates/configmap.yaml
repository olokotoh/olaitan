{{/*
Two ConfigMaps:

  olaitan-config — the central olaitan.yaml. Copied into the chart at
    build time by `make helm-prepare` (see deploy/helm/README.md) so the
    chart remains portable: an operator with only the packaged chart
    (no repo checkout) can still install without the source tree.

  olaitan-rules: the detection rules bundle. Empty in Story 1.7; Story
    1.16 populates it with the initial OLT rule corpus. We ship the
    mount surface now so the Deployment's volumeMount is stable across
    releases, avoiding a "no such path" pod restart when rules first
    land. Story 1.15 wires the in-process rule engine that watches this
    mount for fsnotify-driven hot reloads.

ConfigMap mount pattern: whole-directory, NOT subPath. subPath breaks
kubelet's symlink-rotation atomic swap (it snapshots the file at pod-
start and never updates), silently defeating the Story 1.6 hot-reload
watcher. See Dev Notes § "The ConfigMap-atomic-swap + Story 1.6 contract".
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "olaitan.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
data:
  olaitan.yaml: |-
    {{- /*
    Story 1.19: fail-fast validation of the evaluation matrix surface.
    Runs before any rendering work so an invalid evaluation.config or
    analyst.provider surfaces as a clear render error rather than a
    downstream bridge panic.
    */ -}}
    {{- include "olaitan.evaluation.validate" . -}}
    {{- $cfg := required "files/olaitan.yaml is empty -- run `make helm-prepare` to copy config/olaitan.yaml into the chart" (.Files.Get "files/olaitan.yaml") }}
    {{- /*
    Dual-flag bridge (post-bmad-code-review fix C11): keep
    auditWebhook.enabled (chart-side) and detection.sources.audit.
    enabled (config-side) in lockstep. We do a targeted regex on the
    audit-source `enabled:` line so operators only flip the Helm flag.
    Without this overlay the chart rendered all the audit-webhook
    resources but the receiver goroutine stayed dormant -- a silent
    operator trap.
    */ -}}
    {{- if .Values.auditWebhook.enabled }}
    {{- $cfg = regexReplaceAll "(audit:[[:space:]]*\\n[[:space:]]+)enabled:[[:space:]]+false" $cfg "${1}enabled: true" }}
    {{- end }}
    {{- /*
    Story 1.8 P27 (resolves D1): bridge the chart-side
    containerdSensor knobs into the rendered detection.sources.
    containerd block so a single `--set containerdSensor.foo=...` flips
    both the host-path mount (gating) and the adapter's runtime
    behaviour. Pre-P27 only `enabled` and `socketPath` were exposed by
    the chart and the runtime knobs (dial_timeout, staleness_timeout,
    connect_retry, publish_retry) had to be edited in
    config/olaitan.yaml directly -- a silent operator trap.

    The nested retry blocks share scalar field names (min/max/
    multiplier/jitter/max_attempts) across connect_retry and
    publish_retry; we anchor each per-field regex to the block header
    via a 4-line lookahead window so the bridge is unambiguous. Sticking
    to per-scalar regex (rather than a templated full block) keeps the
    diff minimal and preserves the chart's single-source `.Files.Get`
    contract: the rest of olaitan.yaml is rendered verbatim.
    */ -}}
    {{- if .Values.containerdSensor.enabled }}
    {{- $cs := .Values.containerdSensor }}
    {{- /* Top-level scalars under detection.sources.containerd. The
           containerd block sits below detection.sources.audit so each
           top-level scalar field name is unique to the containerd
           block when matched alongside the literal `containerd:`
           prefix; we use a non-greedy lookahead window to anchor. */}}
    {{- $cfg = regexReplaceAll "(containerd:[[:space:]]*\\n[[:space:]]+)enabled:[[:space:]]+false" $cfg "${1}enabled: true" }}
    {{- $cfg = regexReplaceAll "(?s)(containerd:.{0,256}?\\n[[:space:]]+)socket_path:[[:space:]]+\"[^\"]*\"" $cfg (printf "${1}socket_path: %q" $cs.socketPath) }}
    {{- if $cs.dialTimeout }}
    {{- $cfg = regexReplaceAll "(?s)(containerd:.{0,512}?\\n[[:space:]]+)dial_timeout:[[:space:]]+\"[^\"]*\"" $cfg (printf "${1}dial_timeout: %q" $cs.dialTimeout) }}
    {{- end }}
    {{- if $cs.stalenessTimeout }}
    {{- $cfg = regexReplaceAll "(?s)(containerd:.{0,512}?\\n[[:space:]]+)staleness_timeout:[[:space:]]+\"[^\"]*\"" $cfg (printf "${1}staleness_timeout: %q" $cs.stalenessTimeout) }}
    {{- end }}
    {{- /* Nested retry blocks: connect_retry: appears under
           audit (no) and containerd (yes). To unambiguously target
           the containerd block, anchor each per-field regex on
           `connect_retry:` / `publish_retry:` directly; both keys
           appear once each in the containerd block and not at all in
           the audit block. */}}
    {{- if $cs.connectRetry }}
    {{- $cr := $cs.connectRetry }}
    {{- if $cr.min }}{{- $cfg = regexReplaceAll "(?s)(connect_retry:.{0,256}?\\n[[:space:]]+)min:[[:space:]]+\"[^\"]*\"" $cfg (printf "${1}min: %q" $cr.min) }}{{- end }}
    {{- if $cr.max }}{{- $cfg = regexReplaceAll "(?s)(connect_retry:.{0,256}?\\n[[:space:]]+)max:[[:space:]]+\"[^\"]*\"" $cfg (printf "${1}max: %q" $cr.max) }}{{- end }}
    {{- if $cr.multiplier }}{{- $cfg = regexReplaceAll "(?s)(connect_retry:.{0,256}?\\n[[:space:]]+)multiplier:[[:space:]]+[0-9.]+" $cfg (printf "${1}multiplier: %v" $cr.multiplier) }}{{- end }}
    {{- if hasKey $cr "jitter" }}{{- $cfg = regexReplaceAll "(?s)(connect_retry:.{0,256}?\\n[[:space:]]+)jitter:[[:space:]]+[0-9.]+" $cfg (printf "${1}jitter: %v" $cr.jitter) }}{{- end }}
    {{- if hasKey $cr "maxAttempts" }}{{- $cfg = regexReplaceAll "(?s)(connect_retry:.{0,256}?\\n[[:space:]]+)max_attempts:[[:space:]]+[0-9]+" $cfg (printf "${1}max_attempts: %v" $cr.maxAttempts) }}{{- end }}
    {{- end }}
    {{- if $cs.publishRetry }}
    {{- $pr := $cs.publishRetry }}
    {{- /* publish_retry: appears under both audit and containerd
           blocks. Anchor on `containerd:` plus the publish_retry header
           so the audit publish_retry stays untouched. */}}
    {{- if $pr.min }}{{- $cfg = regexReplaceAll "(?s)(containerd:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)min:[[:space:]]+\"[^\"]*\"" $cfg (printf "${1}min: %q" $pr.min) }}{{- end }}
    {{- if $pr.max }}{{- $cfg = regexReplaceAll "(?s)(containerd:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)max:[[:space:]]+\"[^\"]*\"" $cfg (printf "${1}max: %q" $pr.max) }}{{- end }}
    {{- if $pr.multiplier }}{{- $cfg = regexReplaceAll "(?s)(containerd:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)multiplier:[[:space:]]+[0-9.]+" $cfg (printf "${1}multiplier: %v" $pr.multiplier) }}{{- end }}
    {{- if hasKey $pr "jitter" }}{{- $cfg = regexReplaceAll "(?s)(containerd:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)jitter:[[:space:]]+[0-9.]+" $cfg (printf "${1}jitter: %v" $pr.jitter) }}{{- end }}
    {{- if hasKey $pr "maxAttempts" }}{{- $cfg = regexReplaceAll "(?s)(containerd:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)max_attempts:[[:space:]]+[0-9]+" $cfg (printf "${1}max_attempts: %v" $pr.maxAttempts) }}{{- end }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 1.10: bridge the chart-side calicoSensor knobs into the
    rendered detection.sources.calico block so a single
    `--set calicoSensor.foo=...` flips both the chart-side mount (gating)
    and the adapter's runtime behaviour. Mirrors the Story 1.8 P27
    containerd bridge pattern. Anchored on `calico:` block prefix; nested
    retry blocks anchor on `calico:` plus the retry-block header so the
    audit / containerd `publish_retry:` blocks stay untouched.
    */ -}}
    {{- /* Story 1.10 D4 (code-review patch P28): every regexReplaceAll
           below is preceded by `mustRegexFind` that fails the render
           with a clear message if the anchor pattern is not present
           in the upstream `config/olaitan.yaml`. Without this guard a
           silent miss (regexReplaceAll returns the unchanged string)
           would drop operator `--set` values without any signal. The
           `enabled` substitution matches `(?:true|false)` so it is
           idempotent across upstream-default flips. */ -}}
    {{- if .Values.calicoSensor.enabled }}
    {{- $cs := .Values.calicoSensor }}
    {{- $pEn := "(calico:[[:space:]]*\\n[[:space:]]+)enabled:[[:space:]]+(?:true|false)" -}}
    {{- if not (mustRegexFind $pEn $cfg) }}{{- fail (printf "helm bridge: calico.enabled anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pEn) }}{{- end }}
    {{- $cfg = regexReplaceAll $pEn $cfg (printf "${1}enabled: %t" $cs.enabled) }}
    {{- if $cs.goldmaneAddr }}{{- $p := "(?s)(calico:.{0,256}?\\n[[:space:]]+)goldmane_addr:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.goldmane_addr anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}goldmane_addr: %q" $cs.goldmaneAddr) }}{{- end }}
    {{- if $cs.serverName }}{{- $p := "(?s)(calico:.{0,512}?\\n[[:space:]]+)server_name:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.server_name anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}server_name: %q" $cs.serverName) }}{{- end }}
    {{- if $cs.dialTimeout }}{{- $p := "(?s)(calico:.{0,768}?\\n[[:space:]]+)dial_timeout:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.dial_timeout anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}dial_timeout: %q" $cs.dialTimeout) }}{{- end }}
    {{- if $cs.stalenessTimeout }}{{- $p := "(?s)(calico:.{0,768}?\\n[[:space:]]+)staleness_timeout:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.staleness_timeout anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}staleness_timeout: %q" $cs.stalenessTimeout) }}{{- end }}
    {{- if $cs.maxEventBytes }}{{- $p := "(?s)(calico:.{0,768}?\\n[[:space:]]+)max_event_bytes:[[:space:]]+[0-9]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.max_event_bytes anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}max_event_bytes: %v" $cs.maxEventBytes) }}{{- end }}
    {{- /* Story 1.10 P31: StartTimeGte is *int64 in Go; an explicit
           0 reaches Goldmane's documented "now" semantic, omission
           defaults to -60 replay. The bridge handles three shapes:
           operator passes a number (emit the number including 0),
           operator passes null (emit null so the Go loader stores
           nil), operator omits the key (leave the YAML default
           untouched, which is -60). */ -}}
    {{- if hasKey $cs "startTimeGte" }}
    {{- $pSt := "(?s)(calico:.{0,768}?\\n[[:space:]]+)start_time_gte:[[:space:]]+-?[0-9]+" -}}
    {{- if not (mustRegexFind $pSt $cfg) }}{{- fail (printf "helm bridge: calico.start_time_gte anchor not found (pattern %q)" $pSt) }}{{- end }}
    {{- if eq (kindOf $cs.startTimeGte) "invalid" }}{{- $cfg = regexReplaceAll $pSt $cfg "${1}start_time_gte: null" }}
    {{- else }}{{- $cfg = regexReplaceAll $pSt $cfg (printf "${1}start_time_gte: %v" $cs.startTimeGte) }}{{- end }}
    {{- end }}
    {{- if $cs.aggregationInterval }}{{- $p := "(?s)(calico:.{0,768}?\\n[[:space:]]+)aggregation_interval:[[:space:]]+[0-9]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.aggregation_interval anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}aggregation_interval: %v" $cs.aggregationInterval) }}{{- end }}
    {{- if $cs.connectRetry }}
    {{- $cr := $cs.connectRetry }}
    {{- if $cr.min }}{{- $p := "(?s)(calico:.{0,999}?connect_retry:.{0,256}?\\n[[:space:]]+)min:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.connect_retry.min anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}min: %q" $cr.min) }}{{- end }}
    {{- if $cr.max }}{{- $p := "(?s)(calico:.{0,999}?connect_retry:.{0,256}?\\n[[:space:]]+)max:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.connect_retry.max anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}max: %q" $cr.max) }}{{- end }}
    {{- if $cr.multiplier }}{{- $p := "(?s)(calico:.{0,999}?connect_retry:.{0,256}?\\n[[:space:]]+)multiplier:[[:space:]]+[0-9.]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.connect_retry.multiplier anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}multiplier: %v" $cr.multiplier) }}{{- end }}
    {{- if hasKey $cr "jitter" }}{{- $p := "(?s)(calico:.{0,999}?connect_retry:.{0,256}?\\n[[:space:]]+)jitter:[[:space:]]+[0-9.]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.connect_retry.jitter anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}jitter: %v" $cr.jitter) }}{{- end }}
    {{- if hasKey $cr "maxAttempts" }}{{- $p := "(?s)(calico:.{0,999}?connect_retry:.{0,256}?\\n[[:space:]]+)max_attempts:[[:space:]]+[0-9]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.connect_retry.max_attempts anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}max_attempts: %v" $cr.maxAttempts) }}{{- end }}
    {{- end }}
    {{- if $cs.publishRetry }}
    {{- $pr := $cs.publishRetry }}
    {{- if $pr.min }}{{- $p := "(?s)(calico:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)min:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.publish_retry.min anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}min: %q" $pr.min) }}{{- end }}
    {{- if $pr.max }}{{- $p := "(?s)(calico:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)max:[[:space:]]+\"[^\"]*\"" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.publish_retry.max anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}max: %q" $pr.max) }}{{- end }}
    {{- if $pr.multiplier }}{{- $p := "(?s)(calico:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)multiplier:[[:space:]]+[0-9.]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.publish_retry.multiplier anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}multiplier: %v" $pr.multiplier) }}{{- end }}
    {{- if hasKey $pr "jitter" }}{{- $p := "(?s)(calico:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)jitter:[[:space:]]+[0-9.]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.publish_retry.jitter anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}jitter: %v" $pr.jitter) }}{{- end }}
    {{- if hasKey $pr "maxAttempts" }}{{- $p := "(?s)(calico:.{0,999}?publish_retry:.{0,256}?\\n[[:space:]]+)max_attempts:[[:space:]]+[0-9]+" -}}{{- if not (mustRegexFind $p $cfg) }}{{- fail (printf "helm bridge: calico.publish_retry.max_attempts anchor not found (pattern %q)" $p) }}{{- end }}{{- $cfg = regexReplaceAll $p $cfg (printf "${1}max_attempts: %v" $pr.maxAttempts) }}{{- end }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 1.14: bridge Ring-2 correlator knobs into detection.
    correlator. maxPackageBytes is pinned to the AC3 128 KiB wire cap;
    the chart fails fast if an operator attempts to render a divergent
    value. Every replacement is anchor-guarded to avoid silent drift
    between values.yaml and config/olaitan.yaml.
    */ -}}
    {{- if .Values.correlator }}
    {{- $co := .Values.correlator }}
    {{- if and (hasKey $co "maxPackageBytes") (ne (int $co.maxPackageBytes) 131072) }}
    {{- fail (printf "correlator.maxPackageBytes must remain 131072 bytes for Story 1.14 AC3 (got %d)" (int $co.maxPackageBytes)) }}
    {{- end }}
    {{- if and (hasKey $co "multiSignalMinSources") (lt (int $co.multiSignalMinSources) 2) }}
    {{- fail (printf "correlator.multiSignalMinSources must be >= 2 (got %d)" (int $co.multiSignalMinSources)) }}
    {{- end }}
    {{- if and (hasKey $co "highSeverityThreshold") (or (lt (int $co.highSeverityThreshold) 0) (gt (int $co.highSeverityThreshold) 100)) }}
    {{- fail (printf "correlator.highSeverityThreshold must be in [0,100] (got %d)" (int $co.highSeverityThreshold)) }}
    {{- end }}
    {{- if $co.windowDuration }}
    {{- $pCw := "(?s)(correlator:.{0,256}?\\n[[:space:]]+)window_duration:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pCw $cfg) }}{{- fail (printf "helm bridge: correlator.window_duration anchor not found (pattern %q)" $pCw) }}{{- end }}
    {{- $cfg = regexReplaceAll $pCw $cfg (printf "${1}window_duration: %q" $co.windowDuration) }}
    {{- end }}
    {{- if hasKey $co "maxPackageBytes" }}
    {{- $pCm := "(?s)(correlator:.{0,256}?\\n[[:space:]]+)max_package_bytes:[[:space:]]+[0-9]+" -}}
    {{- if not (mustRegexFind $pCm $cfg) }}{{- fail (printf "helm bridge: correlator.max_package_bytes anchor not found (pattern %q)" $pCm) }}{{- end }}
    {{- $cfg = regexReplaceAll $pCm $cfg (printf "${1}max_package_bytes: %d" (int $co.maxPackageBytes)) }}
    {{- end }}
    {{- if hasKey $co "multiSignalMinSources" }}
    {{- $pCs := "(?s)(correlator:.{0,256}?\\n[[:space:]]+)multi_signal_min_sources:[[:space:]]+[0-9]+" -}}
    {{- if not (mustRegexFind $pCs $cfg) }}{{- fail (printf "helm bridge: correlator.multi_signal_min_sources anchor not found (pattern %q)" $pCs) }}{{- end }}
    {{- $cfg = regexReplaceAll $pCs $cfg (printf "${1}multi_signal_min_sources: %d" (int $co.multiSignalMinSources)) }}
    {{- end }}
    {{- if hasKey $co "highSeverityThreshold" }}
    {{- $pCh := "(?s)(correlator:.{0,256}?\\n[[:space:]]+)high_severity_threshold:[[:space:]]+[0-9]+" -}}
    {{- if not (mustRegexFind $pCh $cfg) }}{{- fail (printf "helm bridge: correlator.high_severity_threshold anchor not found (pattern %q)" $pCh) }}{{- end }}
    {{- $cfg = regexReplaceAll $pCh $cfg (printf "${1}high_severity_threshold: %d" (int $co.highSeverityThreshold)) }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 1.11: bridge the chart-side posture knobs into the
    rendered detection.posture block. The cacheTTL ceiling is 60s
    per architecture.md:324 + AC3; the chart fails render if a
    higher value is supplied. mustRegexFind precedes every
    regexReplaceAll so a missing anchor surfaces as a clear render
    error rather than a silent miss (Story 1.10 P28 pattern).
    */ -}}
    {{- if .Values.posture }}
    {{- $ps := .Values.posture }}
    {{- if hasKey $ps "enabled" }}
    {{- $pEn := "(posture:[[:space:]]*\\n[[:space:]]+)enabled:[[:space:]]+(?:true|false)" -}}
    {{- if not (mustRegexFind $pEn $cfg) }}{{- fail (printf "helm bridge: posture.enabled anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pEn) }}{{- end }}
    {{- /* Normalise the chart-side enabled value to a literal bool
            string. Helm `--set posture.enabled=true` arrives as a
            string, and `printf "%t"` on a string emits
            `%!t(string=true)` which would break the rendered YAML.
            Use an `if` to project to the literal "true"/"false". */ -}}
    {{- $pEnVal := "false" }}
    {{- if $ps.enabled }}{{- $pEnVal = "true" }}{{- end }}
    {{- $cfg = regexReplaceAll $pEn $cfg (printf "${1}enabled: %s" $pEnVal) }}
    {{- end }}
    {{- if $ps.cacheTTL }}
    {{- /* Cache TTL ceiling: architecture.md:324 + Story 1.11 AC3.
            Accepts seconds-only ("Ns") and minute-plus-second
            combinations ("Nm", "NmNs", "NmNs", "0m30s", "1m0s") up
            to a 60s total budget. Anything outside that grammar
            falls through to the regex substitution and the Go-side
            validator catches it at boot. The chart-side ceiling
            stays in sync with the Go-side ceiling in
            internal/config/config.go PostureConfig.validate. */ -}}
    {{- $ttl := $ps.cacheTTL }}
    {{- $ttlSecs := -1 }}
    {{- if regexMatch "^([0-9]+s)$" $ttl }}
    {{- $ttlSecs = int (regexReplaceAll "[^0-9]+" $ttl "") }}
    {{- else if regexMatch "^([0-9]+)m$" $ttl }}
    {{- $mins := int (regexReplaceAll "[^0-9]+" $ttl "") }}
    {{- $ttlSecs = mul $mins 60 }}
    {{- else if regexMatch "^([0-9]+)m([0-9]+)s$" $ttl }}
    {{- $mins := int (first (regexFindAll "[0-9]+" $ttl 2)) }}
    {{- $secs := int (index (regexFindAll "[0-9]+" $ttl 2) 1) }}
    {{- $ttlSecs = add (mul $mins 60) $secs }}
    {{- end }}
    {{- if and (ge $ttlSecs 0) (gt $ttlSecs 60) }}
    {{- fail (printf "posture.cacheTTL must be <= 60s per architecture.md:324 + Story 1.11 AC3 (got %s)" $ttl) }}
    {{- end }}
    {{- $pCt := "(?s)(posture:.{0,256}?\\n[[:space:]]+)cache_ttl:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pCt $cfg) }}{{- fail (printf "helm bridge: posture.cache_ttl anchor not found (pattern %q)" $pCt) }}{{- end }}
    {{- $cfg = regexReplaceAll $pCt $cfg (printf "${1}cache_ttl: %q" $ps.cacheTTL) }}
    {{- end }}
    {{- if $ps.fetchTimeout }}
    {{- $pFt := "(?s)(posture:.{0,512}?\\n[[:space:]]+)fetch_timeout:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pFt $cfg) }}{{- fail (printf "helm bridge: posture.fetch_timeout anchor not found (pattern %q)" $pFt) }}{{- end }}
    {{- $cfg = regexReplaceAll $pFt $cfg (printf "${1}fetch_timeout: %q" $ps.fetchTimeout) }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 1.12: bridge the chart-side metrics.address knob into the
    rendered metrics block. The address knob is mandatory at the Go
    side (guardrail 27); the chart's default ":9090" matches the
    containerPort below so a single --set metrics.containerPort=N
    plus --set metrics.address=:N keeps the two in sync. Anchor is
    mustRegexFind-guarded per the Story 1.10 P28 pattern.
    */ -}}
    {{- if .Values.metrics }}
    {{- $m := .Values.metrics }}
    {{- if $m.address }}
    {{- $pMa := "(?s)(metrics:[[:space:]]*\\n[[:space:]]+)address:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pMa $cfg) }}{{- fail (printf "helm bridge: metrics.address anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pMa) }}{{- end }}
    {{- $cfg = regexReplaceAll $pMa $cfg (printf "${1}address: %q" $m.address) }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 1.13 P28: bridge the chart-side rateLimit knobs into the
    rendered rate_limit block. Each knob is anchored by its YAML key
    inside the rate_limit block; an anchor mismatch fails render with a
    clear message rather than silently dropping the operator's --set.
    Booleans are rendered as YAML literals via `printf %t`. Numeric
    fields use the operator-supplied value verbatim so an integer
    threshold is bridged without quotes.
    */ -}}
    {{- if .Values.rateLimit }}
    {{- $rl := .Values.rateLimit }}
    {{- $rateLimitEnabled := true -}}
    {{- if hasKey $rl "enabled" }}{{- $rateLimitEnabled = $rl.enabled }}{{- end }}
    {{- if $rateLimitEnabled }}
    {{- if and (hasKey $rl "thresholdEventsPerSec") (lt (int $rl.thresholdEventsPerSec) 1) }}
    {{- fail (printf "rateLimit.thresholdEventsPerSec must be >= 1 when enabled=true (got %d)" (int $rl.thresholdEventsPerSec)) }}
    {{- end }}
    {{- if and (hasKey $rl "cooldownSeconds") (lt (int $rl.cooldownSeconds) 1) }}
    {{- fail (printf "rateLimit.cooldownSeconds must be >= 1 when enabled=true (got %d)" (int $rl.cooldownSeconds)) }}
    {{- end }}
    {{- if and (hasKey $rl "samplingRate") (or (le (float64 $rl.samplingRate) 0.0) (gt (float64 $rl.samplingRate) 1.0)) }}
    {{- fail (printf "rateLimit.samplingRate must be in (0, 1] when enabled=true (got %v)" $rl.samplingRate) }}
    {{- end }}
    {{- end }}
    {{- if hasKey $rl "enabled" }}
    {{- $pRle := "(?s)(rate_limit:[[:space:]]*\\n([[:space:]]+[^\\n]*\\n)*?[[:space:]]+)enabled:[[:space:]]+(true|false)" -}}
    {{- if not (mustRegexFind $pRle $cfg) }}{{- fail (printf "helm bridge: rateLimit.enabled anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pRle) }}{{- end }}
    {{- $cfg = regexReplaceAll $pRle $cfg (printf "${1}enabled: %t" $rl.enabled) }}
    {{- end }}
    {{- if hasKey $rl "thresholdEventsPerSec" }}
    {{- $pRlt := "(?s)(rate_limit:[[:space:]]*\\n([[:space:]]+[^\\n]*\\n)*?[[:space:]]+)threshold_events_per_sec:[[:space:]]+[0-9]+" -}}
    {{- if not (mustRegexFind $pRlt $cfg) }}{{- fail (printf "helm bridge: rateLimit.thresholdEventsPerSec anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pRlt) }}{{- end }}
    {{- $cfg = regexReplaceAll $pRlt $cfg (printf "${1}threshold_events_per_sec: %d" (int $rl.thresholdEventsPerSec)) }}
    {{- end }}
    {{- if hasKey $rl "cooldownSeconds" }}
    {{- $pRlc := "(?s)(rate_limit:[[:space:]]*\\n([[:space:]]+[^\\n]*\\n)*?[[:space:]]+)cooldown_seconds:[[:space:]]+[0-9]+" -}}
    {{- if not (mustRegexFind $pRlc $cfg) }}{{- fail (printf "helm bridge: rateLimit.cooldownSeconds anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pRlc) }}{{- end }}
    {{- $cfg = regexReplaceAll $pRlc $cfg (printf "${1}cooldown_seconds: %d" (int $rl.cooldownSeconds)) }}
    {{- end }}
    {{- if hasKey $rl "samplingRate" }}
    {{- $pRls := "(?s)(rate_limit:[[:space:]]*\\n([[:space:]]+[^\\n]*\\n)*?[[:space:]]+)sampling_rate:[[:space:]]+[0-9.]+" -}}
    {{- if not (mustRegexFind $pRls $cfg) }}{{- fail (printf "helm bridge: rateLimit.samplingRate anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pRls) }}{{- end }}
    {{- $cfg = regexReplaceAll $pRls $cfg (printf "${1}sampling_rate: %v" $rl.samplingRate) }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 1.15: bridge the chart-side rules knobs into detection.rules.
    The block lives under `detection:` in the rendered olaitan.yaml at
    exact 2-space indent (`  rules:`) with 4-space-indented children
    (`    enabled:`, `    path:`). Anchoring on that precise indent
    structure rather than a literal `detection:` prefix avoids both
    the Go-regex {0,N} repetition limit and the Falco-subchart
    `rules:` collision the auditor flagged (code-review P23): a
    subchart renders its `rules:` at a different scope and indent so
    these anchors will not match it. Each knob is anchor-guarded via
    mustRegexFind so a missing anchor fails render rather than
    silently dropping the operator's --set (mirrors the Story 1.10
    P28 pattern).
    */ -}}
    {{- if .Values.rules }}
    {{- $rs := .Values.rules }}
    {{- if hasKey $rs "enabled" }}
    {{- $pRen := "(\\n  rules:[[:space:]]*\\n    )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if not (mustRegexFind $pRen $cfg) }}{{- fail (printf "helm bridge: detection.rules.enabled anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pRen) }}{{- end }}
    {{- $rEnVal := "false" }}
    {{- if $rs.enabled }}{{- $rEnVal = "true" }}{{- end }}
    {{- $cfg = regexReplaceAll $pRen $cfg (printf "${1}enabled: %s" $rEnVal) }}
    {{- end }}
    {{- if $rs.path }}
    {{- $pRp := "(?s)(\\n  rules:[[:space:]]*\\n    enabled:[[:space:]]+(?:true|false)\\n    )path:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pRp $cfg) }}{{- fail (printf "helm bridge: detection.rules.path anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pRp) }}{{- end }}
    {{- $cfg = regexReplaceAll $pRp $cfg (printf "${1}path: %q" $rs.path) }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 1.17 baselines block bridge. Mirrors the Story 1.15 rules
    bridge pattern: each knob is anchor-guarded against the indent
    structure inside `detection.baselines:` so a chart upgrade that
    drops one of the anchor fields fails render rather than silently
    discarding the operator's --set.
    */ -}}
    {{- if .Values.baselines }}
    {{- $bs := .Values.baselines }}
    {{- if hasKey $bs "enabled" }}
    {{- $pBen := "(\\n  baselines:[[:space:]]*\\n    )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if not (mustRegexFind $pBen $cfg) }}{{- fail (printf "helm bridge: detection.baselines.enabled anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pBen) }}{{- end }}
    {{- $bEnVal := "false" }}
    {{- if $bs.enabled }}{{- $bEnVal = "true" }}{{- end }}
    {{- $cfg = regexReplaceAll $pBen $cfg (printf "${1}enabled: %s" $bEnVal) }}
    {{- end }}
    {{- if $bs.warmupDuration }}
    {{- $pBwd := "(?s)(\\n  baselines:[[:space:]]*\\n    enabled:[[:space:]]+(?:true|false)\\n    )warmup_duration:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pBwd $cfg) }}{{- fail (printf "helm bridge: detection.baselines.warmup_duration anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pBwd) }}{{- end }}
    {{- $cfg = regexReplaceAll $pBwd $cfg (printf "${1}warmup_duration: %q" $bs.warmupDuration) }}
    {{- end }}
    {{- if hasKey $bs "sigmaMultiplier" }}
    {{- $pBsm := "(?s)(\\n    warmup_duration:[[:space:]]+\"[^\"]*\"\\n    )sigma_multiplier:[[:space:]]+[0-9.]+" -}}
    {{- if not (mustRegexFind $pBsm $cfg) }}{{- fail (printf "helm bridge: detection.baselines.sigma_multiplier anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pBsm) }}{{- end }}
    {{- $cfg = regexReplaceAll $pBsm $cfg (printf "${1}sigma_multiplier: %v" $bs.sigmaMultiplier) }}
    {{- end }}
    {{- /* baselines.redisAddr defaults to empty in values.yaml so the
           default install (subchart Redis enabled) resolves to the
           subchart's `<release>-redis-master:6379` Service via the
           olaitan.endpoints.redis helper; the file-side default of
           "redis:6379" in config/olaitan.yaml is a development-host
           shorthand that does not match the chart's Service naming.
           Operators with externally-managed Redis set baselines.redisAddr
           explicitly. */}}
    {{- $effectiveRedisAddr := $bs.redisAddr }}
    {{- if not $effectiveRedisAddr }}
    {{- $effectiveRedisAddr = include "olaitan.endpoints.redis" . }}
    {{- end }}
    {{- $pBra := "(?s)(\\n    sigma_multiplier:[[:space:]]+[0-9.]+\\n    )redis_addr:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pBra $cfg) }}{{- fail (printf "helm bridge: detection.baselines.redis_addr anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pBra) }}{{- end }}
    {{- $cfg = regexReplaceAll $pBra $cfg (printf "${1}redis_addr: %q" $effectiveRedisAddr) }}
    {{- end }}
    {{- /*
    Story 2.1 score block bridge. Mirrors the Story 1.15 / 1.17
    pattern: each weight knob is anchor-guarded against the indent
    structure inside `detection.score:`. The bridge runs BEFORE the
    Story 1.19 evaluation overlay because Story 2.1 deliberately does
    NOT participate in the F / RS / RSL / RSLT arm overlays -- score
    weights are unchanged across arms (the F arm disables rules and
    baselines entirely so no input ever reaches the calculator).
    */ -}}
    {{- if .Values.score }}
    {{- $sc := .Values.score }}
    {{- if hasKey $sc "ruleWeight" }}
    {{- $pScRw := "(\\n  score:[[:space:]]*\\n    )rule_weight:[[:space:]]+[0-9.]+" -}}
    {{- if not (mustRegexFind $pScRw $cfg) }}{{- fail (printf "helm bridge: detection.score.rule_weight anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pScRw) }}{{- end }}
    {{- $cfg = regexReplaceAll $pScRw $cfg (printf "${1}rule_weight: %v" $sc.ruleWeight) }}
    {{- end }}
    {{- if hasKey $sc "baselineWeight" }}
    {{- $pScBw := "(?s)(\\n    rule_weight:[[:space:]]+[0-9.]+\\n    )baseline_weight:[[:space:]]+[0-9.]+" -}}
    {{- if not (mustRegexFind $pScBw $cfg) }}{{- fail (printf "helm bridge: detection.score.baseline_weight anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pScBw) }}{{- end }}
    {{- $cfg = regexReplaceAll $pScBw $cfg (printf "${1}baseline_weight: %v" $sc.baselineWeight) }}
    {{- end }}
    {{- if hasKey $sc "llmWeight" }}
    {{- $pScLw := "(?s)(\\n    baseline_weight:[[:space:]]+[0-9.]+\\n    )llm_weight:[[:space:]]+[0-9.]+" -}}
    {{- if not (mustRegexFind $pScLw $cfg) }}{{- fail (printf "helm bridge: detection.score.llm_weight anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pScLw) }}{{- end }}
    {{- $cfg = regexReplaceAll $pScLw $cfg (printf "${1}llm_weight: %v" $sc.llmWeight) }}
    {{- end }}
    {{- if hasKey $sc "llmCap" }}
    {{- $pScCap := "(?s)(\\n    llm_weight:[[:space:]]+[0-9.]+\\n    )llm_cap:[[:space:]]+[0-9]+" -}}
    {{- if not (mustRegexFind $pScCap $cfg) }}{{- fail (printf "helm bridge: detection.score.llm_cap anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pScCap) }}{{- end }}
    {{- $cfg = regexReplaceAll $pScCap $cfg (printf "${1}llm_cap: %v" $sc.llmCap) }}
    {{- end }}
    {{- end }}
    {{- /*
    Story 2.3 FSM-persistence bridge. persistence_enabled and redis_addr
    are restart-required (they rewire the aggregator's FSM sink + restore
    hook). redisAddr defaults to empty in values.yaml so the default
    install resolves to the subchart's `<release>-redis-master:6379`
    Service via the olaitan.endpoints.redis helper, exactly like
    baselines.redisAddr; the file-side "redis:6379" in config/olaitan.yaml
    is a dev-host shorthand that does not match the chart's Service naming.
    */ -}}
    {{- if .Values.fsm }}
    {{- $fsm := .Values.fsm }}
    {{- if hasKey $fsm "persistenceEnabled" }}
    {{- $pFpe := "(?s)(\\n    deescalation_cooldown_seconds:[[:space:]]+[0-9]+\\n    )persistence_enabled:[[:space:]]+(?:true|false)" -}}
    {{- if not (mustRegexFind $pFpe $cfg) }}{{- fail (printf "helm bridge: detection.fsm.persistence_enabled anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pFpe) }}{{- end }}
    {{- $fpeVal := "false" }}
    {{- if $fsm.persistenceEnabled }}{{- $fpeVal = "true" }}{{- end }}
    {{- $cfg = regexReplaceAll $pFpe $cfg (printf "${1}persistence_enabled: %s" $fpeVal) }}
    {{- end }}
    {{- $fsmRedisAddr := $fsm.redisAddr }}
    {{- if not $fsmRedisAddr }}
    {{- $fsmRedisAddr = include "olaitan.endpoints.redis" . }}
    {{- end }}
    {{- $pFra := "(?s)(\\n    persistence_enabled:[[:space:]]+(?:true|false)\\n    )redis_addr:[[:space:]]+\"[^\"]*\"" -}}
    {{- if not (mustRegexFind $pFra $cfg) }}{{- fail (printf "helm bridge: detection.fsm.redis_addr anchor not found in config/olaitan.yaml (pattern %q). Bridge broken; --set values would be silently dropped." $pFra) }}{{- end }}
    {{- $cfg = regexReplaceAll $pFra $cfg (printf "${1}redis_addr: %q" $fsmRedisAddr) }}
    {{- end }}
    {{- /*
    Story 1.19: Evaluation-matrix overlay (FR53). Replace the file-side
    defaults for detection.rules.enabled, detection.baselines.enabled,
    and analyst.provider with the effective values computed by the
    evaluation-matrix helpers in _helpers.tpl. Setting
    evaluation.config to a canonical arm (F / RS / RSL / RSLT)
    overlays the per-arm canonical values; an empty evaluation.config
    falls through to the operator's individual rules.enabled,
    baselines.enabled, and analyst.provider knobs (which the bridges
    above have already overlaid onto the file-side defaults). These
    three overlays therefore run AFTER the Story 1.15 / 1.17 bridges so
    the evaluation arm takes precedence when set, and is a no-op when
    not set.

    Anchors:
    - rules.enabled and baselines.enabled use the same indent-anchored
      patterns the Story 1.15 / 1.17 bridges use (`\n  rules:` and
      `\n  baselines:` are 2-space-indented children of `detection:`).
    - analyst.provider sits at column 0 in config/olaitan.yaml (see
      lines around `analyst:`), so the anchor uses `\nanalyst:\n  `
      (one newline, no leading whitespace before `analyst:`) to match
      the top-level block rather than a nested substring.
    */ -}}
    {{- $rulesEnabled := include "olaitan.evaluation.effectiveRulesEnabled" . -}}
    {{- $baselinesEnabled := include "olaitan.evaluation.effectiveBaselinesEnabled" . -}}
    {{- $analystProvider := include "olaitan.evaluation.effectiveAnalystProvider" . -}}
    {{- /* The bridge regexes assume `rules:` and `baselines:` are the
           only top-level 2-space-indented blocks of those names in
           config/olaitan.yaml (they currently live exclusively under
           detection:). `analyst:` is the only top-level block at
           column 0. If a future config introduces an RBAC-style
           `rules:` block elsewhere, switch to a parent-anchored
           pattern. Provider char class widened to `[a-z0-9_-]+` so
           future names like `api-v2` do not silently break the
           anchor. */ -}}
    {{- $pEvRules := "(\\n  rules:[[:space:]]*\\n    )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if not (mustRegexFind $pEvRules $cfg) }}{{- fail (printf "helm bridge: evaluation overlay anchor for detection.rules.enabled not found (pattern %q)" $pEvRules) }}{{- end }}
    {{- $cfg = regexReplaceAll $pEvRules $cfg (printf "${1}enabled: %s" $rulesEnabled) }}
    {{- $pEvBaselines := "(\\n  baselines:[[:space:]]*\\n    )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if not (mustRegexFind $pEvBaselines $cfg) }}{{- fail (printf "helm bridge: evaluation overlay anchor for detection.baselines.enabled not found (pattern %q)" $pEvBaselines) }}{{- end }}
    {{- $cfg = regexReplaceAll $pEvBaselines $cfg (printf "${1}enabled: %s" $baselinesEnabled) }}
    {{- $pEvAnalyst := "(\\nanalyst:[[:space:]]*\\n  )provider:[[:space:]]+[a-z0-9_-]+" -}}
    {{- if not (mustRegexFind $pEvAnalyst $cfg) }}{{- fail (printf "helm bridge: evaluation overlay anchor for analyst.provider not found (pattern %q)" $pEvAnalyst) }}{{- end }}
    {{- $cfg = regexReplaceAll $pEvAnalyst $cfg (printf "${1}provider: %s" $analystProvider) }}
    {{- /* AC2: under evaluation.config=F the rendered config must keep
           only the Falco sensor adapter active. Disable audit /
           containerd / calico source adapters and the posture
           on-demand sensor so the Epic 5 F-vs-Olaitan comparison
           measures Falco alone and not Falco + Olaitan-sensors-
           without-detection. The non-falco enables are best-effort
           rewrites: a future config that does not declare one of
           these sources is silently skipped (mustRegexFind would
           false-on-absent; we use regexReplaceAll here which is a
           no-op when the pattern does not match). */ -}}
    {{- if eq (include "olaitan.evaluation.isFArm" .) "true" }}
    {{- /* Source adapter blocks are 4-space indented children of
           detection.sources (which is at 2-space). Posture is a
           2-space child of detection. All four lines are unique in
           config/olaitan.yaml so the bare-anchor pattern is safe.
           mustRegexFind guards each so a future rename surfaces
           loudly rather than silently leaving the source on. */ -}}
    {{- $pFAudit := "(\\n    audit:[[:space:]]*\\n      )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if mustRegexFind $pFAudit $cfg }}{{- $cfg = regexReplaceAll $pFAudit $cfg "${1}enabled: false" }}{{- end }}
    {{- $pFContainerd := "(\\n    containerd:[[:space:]]*\\n      )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if mustRegexFind $pFContainerd $cfg }}{{- $cfg = regexReplaceAll $pFContainerd $cfg "${1}enabled: false" }}{{- end }}
    {{- $pFCalico := "(\\n    calico:[[:space:]]*\\n      )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if mustRegexFind $pFCalico $cfg }}{{- $cfg = regexReplaceAll $pFCalico $cfg "${1}enabled: false" }}{{- end }}
    {{- $pFPosture := "(\\n  posture:[[:space:]]*\\n    )enabled:[[:space:]]+(?:true|false)" -}}
    {{- if mustRegexFind $pFPosture $cfg }}{{- $cfg = regexReplaceAll $pFPosture $cfg "${1}enabled: false" }}{{- end }}
    {{- end }}
    {{- $cfg | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "olaitan.fullname" . }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
# Populated by Story 1.16: every *.yaml under deploy/helm/olaitan/files/rules/
# is enumerated via .Files.Glob and emitted as a ConfigMap key whose
# basename matches the OLT rule-ID regex (OLT-<CAT>-NNN.yaml). The
# files/ tree is staged by `make helm-prepare-rules` from the canonical
# repo-root rules/<category>/ corpus; the staging step is required
# because Helm's .Files.Glob uses path.Match and does not support
# recursive globbing. The else branch renders `data: {}` explicitly so
# a freshly-cloned chart (before `make helm-prepare-rules` runs) still
# produces a parseable ConfigMap and Story 1.15's loader sees an empty
# but valid corpus directory.
{{- $rules := .Files.Glob "files/rules/*.yaml" }}
{{- if $rules }}
data:
{{- range $path, $bytes := $rules }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- else }}
data: {}
{{- end }}
