{{/*
Applog admission-webhook TLS material. Story 1.9. Two paths:

Path A (cert-manager): operators set
  applogSidecar.tls.certManagerEnabled = true
  applogSidecar.tls.issuerName         = <Issuer or ClusterIssuer name>
  applogSidecar.tls.issuerKind         = Issuer | ClusterIssuer (default Issuer)
The chart renders a cert-manager Certificate resource that issues a
TLS Secret named `<fullname>-applog-injector-tls`; the apiserver-side
caBundle is filled in by cert-manager via the cainjector annotation
on the MutatingWebhookConfiguration.

Path B (manual self-signed): operators populate
  applogSidecar.tls.servingCert  -- base64 PEM
  applogSidecar.tls.servingKey   -- base64 PEM
  applogSidecar.tls.caBundle     -- base64 PEM (apiserver-side trust)
The chart renders the kubernetes.io/tls Secret directly with these
values (raw base64, NOT double-quoted; the apiserver and the kubelet
expect plain base64 strings in tls.crt / tls.key / caBundle). The
MutatingWebhookConfiguration's caBundle field is filled from
applogSidecar.tls.caBundle in the sibling template.

Fail-fast guards: when applogSidecar.enabled=true, neither cert-manager
nor a complete manual triple may be missing.
*/}}
{{- if .Values.applogSidecar.enabled -}}
{{- if .Values.applogSidecar.tls.certManagerEnabled }}
{{- $issuer := required "applogSidecar.tls.issuerName is required when certManagerEnabled=true" .Values.applogSidecar.tls.issuerName -}}
{{- $issuerKind := .Values.applogSidecar.tls.issuerKind | default "Issuer" -}}
{{- if and (ne $issuerKind "Issuer") (ne $issuerKind "ClusterIssuer") -}}
{{- fail (printf "applogSidecar.tls.issuerKind must be Issuer or ClusterIssuer (got %q)" $issuerKind) -}}
{{- end -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "olaitan.fullname" . }}-applog-injector-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
spec:
  secretName: {{ include "olaitan.fullname" . }}-applog-injector-tls
  duration: 8760h    # 1 year
  renewBefore: 720h  # 30 days
  dnsNames:
    - {{ include "olaitan.fullname" . }}-applog-injector
    - {{ include "olaitan.fullname" . }}-applog-injector.{{ .Release.Namespace }}
    - {{ include "olaitan.fullname" . }}-applog-injector.{{ .Release.Namespace }}.svc
    - {{ include "olaitan.fullname" . }}-applog-injector.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ $issuer }}
    kind: {{ $issuerKind }}
{{- else }}
{{- $serving := required "applogSidecar.tls.servingCert is required when certManagerEnabled=false (base64-encoded PEM)" .Values.applogSidecar.tls.servingCert -}}
{{- $servingKey := required "applogSidecar.tls.servingKey is required when certManagerEnabled=false (base64-encoded PEM)" .Values.applogSidecar.tls.servingKey -}}
{{- $caBundle := required "applogSidecar.tls.caBundle is required when certManagerEnabled=false (base64-encoded PEM)" .Values.applogSidecar.tls.caBundle -}}
{{- $_ := $caBundle }}{{/* referenced only via the MWC template; suppress unused-var */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olaitan.fullname" . }}-applog-injector-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $serving }}
  tls.key: {{ $servingKey }}
{{- end }}
{{- end }}
