{{/*
Story 3.4 (FR48): optional in-cluster Ollama for air-gapped /
data-residency-restricted deployments. Default OFF (ollama.enabled:
false) so the default render, the goldens, and every existing
deployment are unchanged unless an operator opts in; Story 3.16 wires
this surface into the evaluation modes.

Model provisioning is OPERATOR-OWNED: the chart deploys the server
only. In a true air-gapped cluster the model arrives via a baked image
(FROM ollama/ollama + ollama pull at build time) or a pre-populated
volume mounted at /root/.ollama through ollama.persistence. The
analyst model id itself lives in analyst.local.model, not here -- the
provider pins what the operator provisioned (ErrNoModel otherwise).

First use loads the model into memory; a cold 70b load takes minutes,
during which the provider's Health probe honestly reports unhealthy
(docs/runbook.md air-gapped section documents warm-up guidance).
[Source: architecture.md:263, :963 -- FR48 air-gapped Ollama mode]
*/}}
{{- if .Values.ollama.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olaitan.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  # Single replica: one model server per release; the provider retries
  # transient failures and the FSM tolerates an unhealthy LLM tier
  # (rules-only degradation, FR27).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "olaitan.ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olaitan.ollama.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          {{- with .Values.ollama.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.ollama.persistence.enabled }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          {{- end }}
      {{- if .Values.ollama.persistence.enabled }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.ollama.persistence.existingClaim | required "ollama.persistence.existingClaim is required when ollama.persistence.enabled=true (the chart does not create the model volume; provision it with the pre-pulled model)" }}
      {{- end }}
{{- end }}
