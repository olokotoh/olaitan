{{/*
Story 3.4 (FR48): optional in-cluster Ollama for air-gapped /
data-residency-restricted deployments. Default OFF (ollama.enabled:
false) so the default render, the goldens, and every existing
deployment are unchanged unless an operator opts in; Story 3.16 wires
this surface into the evaluation modes.

Model provisioning is OPERATOR-OWNED: the chart deploys the server
only. In a true air-gapped cluster the model arrives via a baked image
(FROM ollama/ollama + ollama pull at build time) or a pre-populated
volume mounted at /root/.ollama through ollama.persistence. The
analyst model id itself lives in analyst.local.model, not here -- the
provider pins what the operator provisioned (ErrNoModel otherwise).

First use loads the model into memory; a cold 70b load takes minutes.
The readiness probe gates Service routing on the server listening; it
deliberately does NOT prove the model is warm (that is the provider
Health probe's job, and docs/runbook.md documents warm-up guidance).
ollama.extraEnv exists so operators can set OLLAMA_CONTEXT_LENGTH /
OLLAMA_KEEP_ALIVE per the runbook's num_ctx pairing note.

Round-1 review hardening: the pod mounts no ServiceAccount token (it
talks to nobody and nothing in the cluster API), privilege escalation
is off, and the image tag is required (an empty tag would render
"ollama/ollama:" and ImagePullBackOff silently). The official image
runs as root (writes /root/.ollama), so runAsNonRoot is not imposed;
mirror the image by digest in production registries (the pinned tag is
reproducibility hygiene, not tamper-proofing).
[Source: architecture.md:263, :963 -- FR48 air-gapped Ollama mode]

Story 10.6: a profile may now let the chart provision the model
(ollama.pull.models, see ollama-pull-job.yaml). The server then waits in
an init container until every listed model is on the volume, so a
`helm install --wait` returns only once the model can answer. The wait
starts a private, loopback-only server on the shared volume to ask
`ollama show`; it sets OLLAMA_NOPRUNE because a server start otherwise
deletes blobs no manifest references yet, which is exactly what a pull in
progress looks like. The serving pod keeps its declared-empty egress: the
download happens in the pull Job's pod, not here.
*/}}
{{- if (default (dict) .Values.ollama).enabled -}}
{{- $image := include "olaitan.ollama.image" . -}}
{{- $claim := include "olaitan.ollama.claimName" . -}}
{{- $pullModels := include "olaitan.ollama.pullModels" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olaitan.fullname" . }}-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  # Single replica: one model server per release; the provider retries
  # transient failures and the FSM tolerates an unhealthy LLM tier
  # (rules-only degradation, FR27).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "olaitan.ollama.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olaitan.ollama.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if $pullModels }}
      initContainers:
        - name: wait-for-models
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OLAITAN_OLLAMA_MODELS
              value: {{ $pullModels | quote }}
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"
            - name: OLLAMA_NOPRUNE
              value: "1"
            # Review round 1 (P5): give up a little after the pull Job's own
            # deadline instead of waiting in Init forever. A failed Job is
            # not retried by `helm upgrade` (same name, same spec).
            - name: OLAITAN_OLLAMA_WAIT_SECONDS
              value: {{ add (int .Values.ollama.pull.activeDeadlineSeconds) 300 | quote }}
            - name: OLAITAN_OLLAMA_PULL_JOB
              value: {{ include "olaitan.ollama.pullJobName" . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              ollama serve >/dev/null 2>&1 &
              server=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              waited=0
              for m in $OLAITAN_OLLAMA_MODELS; do
                until ollama show "$m" >/dev/null 2>&1; do
                  if [ "$waited" -ge "$OLAITAN_OLLAMA_WAIT_SECONDS" ]; then
                    echo "model $m is still missing after ${waited}s: the pull Job $OLAITAN_OLLAMA_PULL_JOB failed or never ran."
                    echo "See: kubectl logs job/$OLAITAN_OLLAMA_PULL_JOB"
                    echo "A failed Job is not retried by helm upgrade: kubectl delete job $OLAITAN_OLLAMA_PULL_JOB, then run the upgrade again."
                    kill "$server"
                    exit 1
                  fi
                  echo "waiting for model $m (pulled by the Job $OLAITAN_OLLAMA_PULL_JOB, ${waited}s)"
                  sleep 10
                  waited=$((waited+10))
                done
                echo "model $m present"
              done
              kill "$server"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      {{- end }}
      containers:
        - name: ollama
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with .Values.ollama.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ollama.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $claim }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          {{- end }}
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $claim }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ $claim }}
      {{- end }}
{{- end }}
