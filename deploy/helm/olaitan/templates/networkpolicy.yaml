{{/*
Namespace-scoped NetworkPolicy for the Olaitan release. Default-on
(networkPolicy.enabled: true) because architecture treats namespace
isolation as a baseline security control, not an opt-in.

Ingress allowlist:
  - kube-system namespace, on the audit-webhook port. Only matters once
    Story 1.7 enables auditWebhook.enabled — until then no inbound
    traffic to the aggregator is required by the system, and this rule
    is harmless.
  - The release's own namespace, for intra-namespace pod-to-pod traffic
    (collector to aggregator over NATS, aggregator to Redis).

Egress allowlist:
  - DNS to kube-dns (port 53 UDP and TCP). Required to resolve the NATS
    and Redis subchart Service DNS names.
  - Intra-namespace pods (the NATS, Redis, and Falco subchart pods).
  - Operator-supplied extra egress CIDRs and ports for LLM provider
    endpoints. Empty by default; production overlays
    (Story 6.6 — values-production.yaml) populate these for
    api.anthropic.com, api.openai.com, and any private Ollama endpoint.

Operators on flat networks who do not want the policy can disable it
with `--set networkPolicy.enabled=false`. Disabling is the operator's
explicit choice and gets logged in `helm get values`.
[Source: architecture.md:355-360 — Helm chart structure]
*/}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "olaitan.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "olaitan.selectorLabels" . | nindent 6 }}
    {{- /*
    Story 3.4 round-1 review (documented BI-8 amendment): the optional
    ollama pod carries the shared name/instance labels, and
    NetworkPolicies UNION -- without this exclusion the release
    policy's ingress (from every olaitan pod, any port) and egress
    (DNS, apiserver, intra-namespace, extraEgress) would also apply to
    the ollama pod, nullifying ollama-networkpolicy.yaml's
    aggregator-only-11434 ingress and declared-empty egress. Gated so
    the default render is byte-identical when ollama is disabled.
    */}}
    {{- if (default (dict) .Values.ollama).enabled }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["ollama"]
    {{- end }}
{{- /*
  Story 10.5: the API server CIDR discovery is computed ONCE here because
  BOTH directions need it. Egress has used it since Story 10.3 (the
  aggregator could not reach the apiserver). Ingress needs it because the
  kube-apiserver DIALS two of this release's listeners: the audit webhook
  receiver and the applog admission webhook. On a self-managed control
  plane the apiserver is a host-network static pod, so Calico sees its
  traffic as coming from the NODE, not from a workload endpoint in
  kube-system, and a namespaceSelector for kube-system never matches it.
  The applog MutatingWebhookConfiguration ships failurePolicy: Ignore, so
  the resulting timeout is SILENT: pods are admitted with no sidecar and
  no error anywhere except the apiserver log. Found on kind-full, where
  the EndpointSlice for the default/kubernetes Service resolves to the
  control-plane node address.
  */}}
{{- $apiIPs := list }}
{{- /*
  $apiIngressIPs is the subset usable as a SOURCE address. The kubernetes
  Service ClusterIP is a virtual destination that DNAT rewrites before the
  packet is routed; it can never appear as the source of an inbound
  connection, so admitting it on ingress is noise that makes the rendered
  policy claim something it does not mean. Egress keeps it, because there it
  is exactly the destination being dialled.
  */}}
{{- $apiIngressIPs := list }}
{{- $apiPorts := list 443 6443 }}
{{- $svc := lookup "v1" "Service" "default" "kubernetes" }}
{{- if and $svc $svc.spec $svc.spec.clusterIP }}
{{- $apiIPs = append $apiIPs $svc.spec.clusterIP }}
{{- end }}
{{- $slice := lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "kubernetes" }}
{{- if and $slice $slice.endpoints }}
{{- range $slice.endpoints }}{{- range .addresses }}{{- $apiIPs = append $apiIPs . }}{{- $apiIngressIPs = append $apiIngressIPs . }}{{- end }}{{- end }}
{{- range $slice.ports }}{{- if .port }}{{- $apiPorts = append $apiPorts (int .port) }}{{- end }}{{- end }}
{{- else }}
{{- $eps := lookup "v1" "Endpoints" "default" "kubernetes" }}
{{- if and $eps $eps.subsets }}
{{- range $eps.subsets }}
{{- range .addresses }}{{- $apiIPs = append $apiIPs .ip }}{{- $apiIngressIPs = append $apiIngressIPs .ip }}{{- end }}
{{- range .ports }}{{- $apiPorts = append $apiPorts (int .port) }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $apiCIDRs := list }}
{{- range $apiIPs }}{{- $apiCIDRs = append $apiCIDRs (printf "%s/%s" . (ternary "128" "32" (contains ":" .))) }}{{- end }}
{{- with .Values.networkPolicy.apiServerCIDR }}{{- $apiCIDRs = append $apiCIDRs . }}{{- end }}
{{- $apiIngressCIDRs := list }}
{{- range $apiIngressIPs }}{{- $apiIngressCIDRs = append $apiIngressCIDRs (printf "%s/%s" . (ternary "128" "32" (contains ":" .))) }}{{- end }}
{{- /*
  networkPolicy.apiServerCIDR is deliberately NOT appended here. Its
  documented kubeadm value is the kubernetes Service ClusterIP (10.96.0.1),
  and excluding a ClusterIP from ingress sources while re-admitting it through
  the operator-supplied fallback would enforce the rule against the value we
  discover and waive it for the value we are handed. Operators whose apiserver
  reaches pods from an address the EndpointSlice does not list set
  networkPolicy.apiServerIngressCIDR instead.
  */}}
{{- with .Values.networkPolicy.apiServerIngressCIDR }}{{- $apiIngressCIDRs = append $apiIngressCIDRs . }}{{- end }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.auditWebhook.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        {{- /*
        Story 10.5: plus the apiserver's own addresses. A host-network
        apiserver is not a workload endpoint, so the kube-system selector
        above does not admit it. Harmless where the selector already
        matches; load-bearing on every self-managed control plane.
        */}}
        {{- range (uniq $apiIngressCIDRs) }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.auditWebhook.containerPort }}
    {{- end }}
    {{- /*
    Story 10.5: the applog admission webhook. The apiserver dials the
    injector Service on CREATE for every Pod in a selected namespace. Until
    this story nothing ran applogSidecar.enabled together with a CNI that
    actually enforces NetworkPolicy, so the gap never showed: kindnet
    accepts policy and enforces nothing. With Calico the call times out at
    5s and failurePolicy: Ignore admits the Pod with no sidecar, silently.
    */}}
    {{- if .Values.applogSidecar.enabled }}
    {{- $applogPort := (default (dict) .Values.applogSidecar.webhook).port | default 8443 }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        {{- range (uniq $apiIngressCIDRs) }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $applogPort }}
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "olaitan.selectorLabels" . | nindent 14 }}
    {{- /*
    Story 10.2: Falco POSTs alerts to the collector's ingest port. Falco's
    pods carry the Falco chart's own name label, so the rule above does not
    match them, and an enforcing CNI would drop every alert. With the
    bundled Falco this admits exactly this release's Falco. With your own
    Falco (falco.enabled=false) it admits Falco-labelled pods from any
    namespace, since that Falco usually lives in its own; the token is the
    second gate. falcoIngest.extraFrom adds peers for anything else. All of
    it is scoped to the ingest port only.
    */}}
    - from:
        {{- if .Values.falco.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falco
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- else }}
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: falco
        {{- end }}
        {{- with .Values.falcoIngest.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.falcoIngest.port }}
    {{- /*
    Allow kubelet probe traffic from node IPs. Required when the CNI
    enforces NetworkPolicy on host-network traffic (Calico eBPF
    dataplane); harmless on default-iptables Calico where kubelet
    bypasses policy. Off by default — operator opts in by setting
    networkPolicy.nodeCIDR.
    */}}
    {{- with .Values.networkPolicy.nodeCIDR }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    {{- /* DNS — required for service-name resolution. */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- /*
    Kubernetes API server. The correlator resolves every workload through
    it, and the response ring patches pods through it, so without this rule
    detection itself stops on any cluster that enforces NetworkPolicy.

    NetworkPolicy is evaluated AFTER kube-proxy rewrites the Service IP to a
    real API server endpoint on most CNIs, so allowing only the Service IP
    is not enough. At install time the chart reads the cluster's actual
    `kubernetes` Service IP and its endpoints (EndpointSlice, falling back
    to Endpoints) and allows exactly those addresses and ports.

    Story 10.3: this used to allow only networkPolicy.apiServerCIDR, a
    kubeadm default (10.96.0.1). On k3s (10.43.0.1) and minikube (endpoint
    on port 8443) every API call was refused, so the aggregator could not
    resolve a single workload. Found by the portability job's real attack.

    `lookup` returns nothing under `helm template` and `--dry-run`, and an
    endpoint that moves (a managed control plane) is not tracked until the
    next `helm upgrade`. In both cases networkPolicy.apiServerCIDR is the
    fallback: set it to your API server's address range.
    */}}
    {{- if $apiCIDRs }}
    - to:
        {{- range (uniq $apiCIDRs) }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range (uniq $apiPorts) }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- /* Intra-namespace traffic to NATS, Redis, Falco subcharts. */}}
    - to:
        - podSelector: {}
    {{- /*
    Story 1.10: egress to Calico Goldmane in the calico-system
    namespace on port 7443 (the Goldmane mTLS gRPC listener).
    Conditional on calicoSensor.enabled so a chart deploy that does
    not consume Calico flows does not punch this hole.
    */}}
    {{- if .Values.calicoSensor.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: calico-system
          podSelector:
            matchLabels:
              k8s-app: goldmane
      ports:
        - protocol: TCP
          port: 7443
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
