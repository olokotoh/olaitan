{{/*
Calico CNI flow adapter TLS Secret. Story 1.10. Holds the client cert
+ key the agent presents to Goldmane plus the Tigera CA bundle the
agent uses to verify Goldmane's serving cert (mTLS). Mounted onto the
Olaitan collector DaemonSet at /etc/olaitan/cni/.

Renders only when calicoSensor.enabled=true AND Path B is configured.
Path A (cert-manager-issued) consumes the cert-manager-created Secret
directly via volumes[].secret.secretName, so this template renders
zero TLS Secrets in that mode.

The chart fails render with a loud message if calicoSensor.enabled=true
but neither path is configured -- the fail-fast guard lives inline in
this file via the three `required` calls below at lines ~24-26 (Path B),
which fire when certManagerSecretName is unset and any of the three PEM
fields is empty.

Operators populate the three base64-encoded PEM values for Path B:
  calicoSensor.tls.caBundle   -- Tigera CA bundle PEM (from the
                                 `tigera-ca-bundle` ConfigMap in
                                 calico-system)
  calicoSensor.tls.clientCert -- client cert PEM signed by Tigera CA
  calicoSensor.tls.clientKey  -- client cert private key PEM
*/}}
{{- if and .Values.calicoSensor.enabled (not .Values.calicoSensor.tls.certManagerSecretName) -}}
{{- $ca := required "calicoSensor.tls.caBundle is required when calicoSensor.enabled=true and tls.certManagerSecretName is empty (Path B). See CNI.md." .Values.calicoSensor.tls.caBundle -}}
{{- $cert := required "calicoSensor.tls.clientCert is required when calicoSensor.enabled=true and tls.certManagerSecretName is empty (Path B). See CNI.md." .Values.calicoSensor.tls.clientCert -}}
{{- $key := required "calicoSensor.tls.clientKey is required when calicoSensor.enabled=true and tls.certManagerSecretName is empty (Path B). See CNI.md." .Values.calicoSensor.tls.clientKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olaitan.fullname" . }}-cni-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca | quote }}
  client.crt: {{ $cert | quote }}
  client.key: {{ $key | quote }}
{{- end }}
