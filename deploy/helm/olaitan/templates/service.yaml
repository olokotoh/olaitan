{{/*
Audit-webhook receiver Service. ClusterIP-only. It selects the collector
DaemonSet pods, where the receiver listens on auditWebhook.containerPort
(Story 1.7), and renders only when auditWebhook.enabled=true.

kube-apiserver does not use this Service on a self-managed cluster: it
runs on the host network with the node's resolver and cannot resolve the
Service FQDN (Story 10.8, #137 B2). There it dials its own node's
collector at auditWebhook.serverAddress through auditWebhook.hostPort
(AUDIT.md). The Service stays the default kubeconfig target for clusters
whose apiserver does use cluster DNS, and the in-cluster address for
port-forwarding to the receiver.
[Source: architecture.md:355-360 (Helm chart structure)]
*/}}
{{- if .Values.auditWebhook.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "olaitan.fullname" . }}-audit-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-webhook
spec:
  type: ClusterIP
  selector:
    {{- /*
    Story 10.8 (#137, B1): the receiver listens in the COLLECTOR
    DaemonSet (daemonset.yaml opens auditWebhook.containerPort and
    cmd/olaitan/main.go serves it there), not in the aggregator. This
    Service selected the aggregator, so every apiserver audit POST
    reached a pod with nothing listening on that port and the audit
    source never produced a single event.
    */}}
    {{- include "olaitan.collector.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      protocol: TCP
      port: {{ .Values.auditWebhook.servicePort }}
      targetPort: {{ .Values.auditWebhook.containerPort }}
{{- end }}
