{{/*
Audit webhook kubeconfig Secret. Story 1.7. Mounted on the
kube-apiserver pod (operator-side via kubeadm-config
apiServer.extraVolumes) and pointed at by the apiserver's
--audit-webhook-config-file flag. The chart only renders the Secret --
mounting it on the apiserver is operator-side because the apiserver
runs in kube-system, outside this chart's namespace.

Renders only when auditWebhook.enabled=true. Fails render with a loud
message if any of the required mTLS material is empty OR contains
shape-violating characters (newlines, the literal string "null", or
"~"). Post-bmad-code-review hardening (P20, P21): operator-supplied
strings are interpolated into a YAML scalar via printf "%s", so an
embedded newline can smuggle additional kubeconfig keys -- we
pre-validate the alphabet to fail fast.
*/}}
{{- if .Values.auditWebhook.enabled -}}
{{- $caBundle := required "auditWebhook.caBundle is required when auditWebhook.enabled=true (base64-encoded PEM bytes of the receiver's serving-CA)" .Values.auditWebhook.caBundle -}}
{{- $cliCert := required "auditWebhook.apiserverClientCert is required when auditWebhook.enabled=true (base64-encoded PEM, CN=kube-apiserver)" .Values.auditWebhook.apiserverClientCert -}}
{{- $cliKey := required "auditWebhook.apiserverClientKey is required when auditWebhook.enabled=true (base64-encoded PEM)" .Values.auditWebhook.apiserverClientKey -}}

{{- /* Reject literal "null" / "~" -- YAML's nil sentinels would
       silently produce certificate-authority-data: null in the
       rendered kubeconfig. */ -}}
{{- if or (eq $caBundle "null") (eq $caBundle "~") }}
  {{- fail "auditWebhook.caBundle is the literal string \"null\"/\"~\" -- supply a real base64-encoded PEM." }}
{{- end }}
{{- if or (eq $cliCert "null") (eq $cliCert "~") }}
  {{- fail "auditWebhook.apiserverClientCert is the literal string \"null\"/\"~\"." }}
{{- end }}
{{- if or (eq $cliKey "null") (eq $cliKey "~") }}
  {{- fail "auditWebhook.apiserverClientKey is the literal string \"null\"/\"~\"." }}
{{- end }}

{{- /* Reject base64 alphabet violations. base64 -w0 produces
       [A-Za-z0-9+/=]+; multi-line wrapped output (plain `base64`
       without -w0) breaks YAML scalar parsing once embedded inline.
       The regex is anchored to catch any newline/whitespace
       smuggling. */ -}}
{{- $b64Re := "^[A-Za-z0-9+/=]+$" -}}
{{- if not (regexMatch $b64Re $caBundle) }}
  {{- fail "auditWebhook.caBundle contains non-base64 characters (newlines? whitespace? CRLF?). Use `base64 -w0 ca.pem`." }}
{{- end }}
{{- if not (regexMatch $b64Re $cliCert) }}
  {{- fail "auditWebhook.apiserverClientCert contains non-base64 characters. Use `base64 -w0 client.pem`." }}
{{- end }}
{{- if not (regexMatch $b64Re $cliKey) }}
  {{- fail "auditWebhook.apiserverClientKey contains non-base64 characters. Use `base64 -w0 client.key`." }}
{{- end }}

{{- $svcFqdn := include "olaitan.auditWebhookServiceFqdn" . -}}
{{- $kubeconfig := printf "apiVersion: v1\nkind: Config\nclusters:\n  - name: olaitan-audit\n    cluster:\n      server: https://%s:%d/audit\n      certificate-authority-data: %s\nusers:\n  - name: kube-apiserver\n    user:\n      client-certificate-data: %s\n      client-key-data: %s\ncontexts:\n  - name: olaitan-audit\n    context:\n      cluster: olaitan-audit\n      user: kube-apiserver\ncurrent-context: olaitan-audit\n" $svcFqdn (int .Values.auditWebhook.servicePort) $caBundle $cliCert $cliKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olaitan.fullname" . }}-audit-webhook-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook-kubeconfig.yaml: |-
{{ $kubeconfig | indent 4 }}
{{- end }}
