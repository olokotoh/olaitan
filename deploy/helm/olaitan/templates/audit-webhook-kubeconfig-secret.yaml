{{/*
Audit webhook kubeconfig Secret. Story 1.7. Mounted on the
kube-apiserver pod (operator-side via kubeadm-config
apiServer.extraVolumes) and pointed at by the apiserver's
--audit-webhook-config-file flag. The chart only renders the Secret --
mounting it on the apiserver is operator-side because the apiserver
runs in kube-system, outside this chart's namespace.

Renders only when auditWebhook.enabled=true. Fails render with a
loud message if any of the required mTLS material is empty.
*/}}
{{- if .Values.auditWebhook.enabled -}}
{{- $caBundle := required "auditWebhook.caBundle is required when auditWebhook.enabled=true (base64-encoded DER of the receiver's serving-CA)" .Values.auditWebhook.caBundle -}}
{{- $cliCert := required "auditWebhook.apiserverClientCert is required when auditWebhook.enabled=true (base64-encoded PEM, CN=kube-apiserver)" .Values.auditWebhook.apiserverClientCert -}}
{{- $cliKey := required "auditWebhook.apiserverClientKey is required when auditWebhook.enabled=true (base64-encoded PEM)" .Values.auditWebhook.apiserverClientKey -}}
{{- $svcFqdn := include "olaitan.auditWebhookServiceFqdn" . -}}
{{- $kubeconfig := printf "apiVersion: v1\nkind: Config\nclusters:\n  - name: olaitan-audit\n    cluster:\n      server: https://%s:%d/audit\n      certificate-authority-data: %s\nusers:\n  - name: kube-apiserver\n    user:\n      client-certificate-data: %s\n      client-key-data: %s\ncontexts:\n  - name: olaitan-audit\n    context:\n      cluster: olaitan-audit\n      user: kube-apiserver\ncurrent-context: olaitan-audit\n" $svcFqdn (int .Values.auditWebhook.servicePort) $caBundle $cliCert $cliKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olaitan.fullname" . }}-audit-webhook-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
type: Opaque
stringData:
  webhook-kubeconfig.yaml: |-
{{ $kubeconfig | indent 4 }}
{{- end }}
