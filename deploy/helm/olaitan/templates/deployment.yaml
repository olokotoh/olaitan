{{/*
Aggregator — Rings 2-4 cooperative goroutines in one process. Singleton
(replicas: 1, strategy: Recreate) for correctness, NOT convenience.

Ring 2 checkpoints NATS JetStream stream position to Redis key
`checkpoint:correlator:stream_seq`. A RollingUpdate briefly runs two
pods both consuming the stream + both writing the same checkpoint key →
split-brain: events processed twice, recovery breaks.

Recreate kills the old pod and waits for termination before starting
the new one — at-most-one-aggregator semantics preserved during a Helm
upgrade. Horizontal scaling lands with leader election (Story 8.x /
FR39); do NOT raise replicas until then. [See Dev Notes § "The
aggregator-replicas-1 constraint"]
*/}}
{{- /*
Render-time guard: refuse to install if the operator has overridden
replicas above 1, since that silently corrupts the correlator
checkpoint. Story 8.x will lift this once leader election is wired.
*/}}
{{- if gt (int .Values.aggregator.replicas) 1 }}
{{- fail "aggregator.replicas must not exceed 1 — Ring 2 NATS JetStream checkpoint requires at-most-one-aggregator semantics. Leader election lands in Story 8.x; until then, this is a hard constraint. Set aggregator.replicas=1 (the default) to proceed." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olaitan.fullname" . }}-aggregator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: aggregator
spec:
  replicas: {{ .Values.aggregator.replicas }}
  strategy:
    # Recreate (not RollingUpdate) — see header comment. This is load-bearing
    # for Ring 2 correctness. Changing it to RollingUpdate corrupts the
    # correlator checkpoint under a busy upgrade.
    type: Recreate
  selector:
    matchLabels:
      {{- include "olaitan.aggregator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olaitan.aggregator.selectorLabels" . | nindent 8 }}
      {{- /* Story 1.12: Prometheus scrape annotations, gated by
             metrics.scrapeAnnotations so a Prometheus-Operator-driven
             deployment can disable them and rely on a ServiceMonitor
             resource (future Story 1.18 follow-up). */ -}}
      {{- if and .Values.metrics .Values.metrics.scrapeAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.containerPort | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      serviceAccountName: {{ include "olaitan.aggregator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # OnRootMismatch — kubelet skips the recursive chown of the PVC
        # when the volume root already has the right ownership. Without
        # this, pod restart time grows linearly with the number of files
        # in the reports PVC and quickly blows past the readiness probe
        # budget (initialDelay 3s + 10s × 3 failureThreshold = 33s).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.aggregator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aggregator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aggregator
          image: {{ include "olaitan.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/olaitan"]
          args:
            - aggregator
            - --config=/etc/olaitan/olaitan.yaml
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            # Story 1.12: Prometheus metrics surface (FR8, FR50). The
            # aggregator exposes posture counters here; Story 1.14 +
            # 1.18 will register correlator and detection metrics on
            # the same Registry. The if-guard mirrors the configmap.yaml
            # pattern so a chart deploy with `--set metrics=null` fails
            # fast at render rather than panicking on nil
            # .Values.metrics.containerPort (Review P4).
            {{- if .Values.metrics }}
            - name: metrics
              containerPort: {{ .Values.metrics.containerPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: NATS_URL
              value: {{ include "olaitan.endpoints.nats" . | quote }}
            - name: REDIS_ADDR
              value: {{ include "olaitan.endpoints.redis" . | quote }}
            - name: FALCO_SOCKET
              value: {{ .Values.endpoints.falco | quote }}
            # NFR8: Redis AUTH is mandatory. The baseline engine and
            # any future aggregator-side Redis client read the password
            # from this env var rather than parsing the mounted Secret
            # file directly; matches the established 12-factor pattern
            # already used by the subchart for its own Redis pods.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "olaitan.fullname" . }}-secrets
                  key: redis-password
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.aggregator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/olaitan
              readOnly: true
            - name: rules
              mountPath: /etc/olaitan/rules
              readOnly: true
            - name: secrets
              mountPath: /etc/olaitan/secrets
              readOnly: true
            # DFIR reports — RW mount, aggregator-only. The collector
            # pod spec omits this volume entirely.
            - name: reports
              mountPath: /var/lib/olaitan/reports
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "olaitan.fullname" . }}-config
        - name: rules
          configMap:
            name: {{ include "olaitan.fullname" . }}-rules
        - name: secrets
          secret:
            secretName: {{ include "olaitan.fullname" . }}-secrets
            defaultMode: 0400
        - name: reports
          persistentVolumeClaim:
            claimName: {{ include "olaitan.fullname" . }}-reports
        - name: tmp
          emptyDir: {}
