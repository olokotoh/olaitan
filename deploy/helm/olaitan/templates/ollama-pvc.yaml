{{/*
Story 10.6: the chart-created Ollama model claim. Rendered only when the
in-cluster Ollama is on, persistence is on, create is set and no
existingClaim names an operator-provisioned one (that route, the
air-gapped one, is unchanged). ReadWriteOnce is enough: the server and the
pull Job are pinned to the same node by the volume itself, and RWO is a
per-node, not per-pod, restriction.
*/}}
{{- $o := default (dict) .Values.ollama -}}
{{- $p := default (dict) $o.persistence -}}
{{- if and $o.enabled $p.enabled $p.create (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "olaitan.fullname" . }}-ollama-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ required "ollama.persistence.size is required when ollama.persistence.create=true" $p.size | quote }}
  {{- with $p.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
