{{/*
Applog MutatingAdmissionWebhook server Deployment. Story 1.9.

Topology: a separate Deployment from the agent DaemonSet. Replica
count default 2 for HA per the K8s admission-webhook good-practice
guidance (a single-replica webhook is a SPOF on the apiserver path).
The webhook Pod runs the same `olaitan-agent` image as the DaemonSet
and dispatches via the multi-call subcommand `olaitan applog-webhook`.

Renders only when applogSidecar.enabled=true.

Pod-level security posture: nonroot, read-only root FS, all
capabilities dropped, no privilege escalation. The webhook performs
no host-level operations.
*/}}
{{- if .Values.applogSidecar.enabled -}}
{{- $port := .Values.applogSidecar.webhook.port | default 8443 -}}
{{- if or (lt (int $port) 1024) (gt (int $port) 65535) -}}
{{- fail (printf "applogSidecar.webhook.port must be in [1024, 65535] (got %d)" (int $port)) -}}
{{- end -}}
{{- if eq .Values.applogSidecar.stdoutPath .Values.applogSidecar.stderrPath -}}
{{- fail "applogSidecar.stdoutPath and applogSidecar.stderrPath must differ" -}}
{{- end -}}
{{- if not (hasPrefix "/" .Values.applogSidecar.stdoutPath) -}}
{{- fail (printf "applogSidecar.stdoutPath must be absolute (got %q)" .Values.applogSidecar.stdoutPath) -}}
{{- end -}}
{{- if not (hasPrefix "/" .Values.applogSidecar.stderrPath) -}}
{{- fail (printf "applogSidecar.stderrPath must be absolute (got %q)" .Values.applogSidecar.stderrPath) -}}
{{- end -}}
{{- if or (contains ".." .Values.applogSidecar.stdoutPath) (contains "~" .Values.applogSidecar.stdoutPath) -}}
{{- fail (printf "applogSidecar.stdoutPath contains forbidden characters (..,~) (got %q)" .Values.applogSidecar.stdoutPath) -}}
{{- end -}}
{{- if or (contains ".." .Values.applogSidecar.stderrPath) (contains "~" .Values.applogSidecar.stderrPath) -}}
{{- fail (printf "applogSidecar.stderrPath contains forbidden characters (..,~) (got %q)" .Values.applogSidecar.stderrPath) -}}
{{- end -}}
{{- if lt (int .Values.applogSidecar.channelBuffer) 1 -}}
{{- fail (printf "applogSidecar.channelBuffer must be >= 1 (got %d)" (int .Values.applogSidecar.channelBuffer)) -}}
{{- end -}}
{{- if lt (int .Values.applogSidecar.maxLineBytes) 1024 -}}
{{- fail (printf "applogSidecar.maxLineBytes must be >= 1024 (got %d)" (int .Values.applogSidecar.maxLineBytes)) -}}
{{- end -}}
{{/*
  Upper bound: 192 KiB = 196608. Mirrors the adapter's
  MaxLineBytesAbsoluteCap, which leaves 64 KiB envelope headroom under
  the EVENTS_RAW stream's 256 KiB MaxMsgSize.
*/}}
{{- if gt (int .Values.applogSidecar.maxLineBytes) 196608 -}}
{{- fail (printf "applogSidecar.maxLineBytes must be <= 196608 (got %d); the cap leaves envelope headroom below EVENTS_RAW MaxMsgSize" (int .Values.applogSidecar.maxLineBytes)) -}}
{{- end -}}
{{/*
  useNativeSidecar default-true coercion: Helm's `default` returns
  the default whenever the given value is a Go zero-value, so
  `default true false` would return `true` (bool zero-value is
  false). Use hasKey on .Values.applogSidecar against
  "useNativeSidecar" to distinguish "unset" from "explicitly false";
  when unset, default to true; when set, take the operator value
  as-is.
*/}}
{{- $useNative := true -}}
{{- if hasKey .Values.applogSidecar "useNativeSidecar" -}}
{{- $useNative = .Values.applogSidecar.useNativeSidecar -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "olaitan.fullname" . }}-applog-injector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
    app.kubernetes.io/component: applog-injector
spec:
  replicas: {{ .Values.applogSidecar.webhook.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "olaitan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: applog-injector
  template:
    metadata:
      labels:
        {{- include "olaitan.labels" . | nindent 8 }}
        app.kubernetes.io/component: applog-injector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: applog-injector
          image: {{ include "olaitan.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            - olaitan
          args:
            - applog-webhook
          ports:
            - name: tls
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: OLAITAN_WEBHOOK_LISTEN_ADDR
              value: ":{{ $port }}"
            - name: OLAITAN_WEBHOOK_TLS_CERT
              value: /etc/olaitan/tls/tls.crt
            - name: OLAITAN_WEBHOOK_TLS_KEY
              value: /etc/olaitan/tls/tls.key
            - name: OLAITAN_WEBHOOK_USE_NATIVE_SIDECAR
              value: {{ $useNative | quote }}
            - name: OLAITAN_WEBHOOK_SIDECAR_IMAGE
              value: {{ include "olaitan.image" . | quote }}
            # Sidecar runtime knobs forwarded through the webhook env
            # into the injected sidecar's OLAITAN_APPLOG_* env vars.
            # Story 1.9 D1+D2+H3: dead-knobs defect closure.
            - name: OLAITAN_WEBHOOK_SIDECAR_STDOUT_PATH
              value: {{ .Values.applogSidecar.stdoutPath | quote }}
            - name: OLAITAN_WEBHOOK_SIDECAR_STDERR_PATH
              value: {{ .Values.applogSidecar.stderrPath | quote }}
            - name: OLAITAN_WEBHOOK_SIDECAR_CHANNEL_BUFFER
              value: {{ .Values.applogSidecar.channelBuffer | quote }}
            - name: OLAITAN_WEBHOOK_SIDECAR_MAX_LINE_BYTES
              value: {{ .Values.applogSidecar.maxLineBytes | quote }}
            - name: OLAITAN_WEBHOOK_SIDECAR_PUBLISH_STALL_TIMEOUT
              value: {{ .Values.applogSidecar.publishStallTimeout | quote }}
            - name: OLAITAN_WEBHOOK_SIDECAR_STALENESS_TIMEOUT
              value: {{ .Values.applogSidecar.stalenessTimeout | quote }}
            - name: OLAITAN_WEBHOOK_RATE_LIMIT_ENABLED
              value: {{ .Values.rateLimit.enabled | quote }}
            - name: OLAITAN_WEBHOOK_RATE_LIMIT_THRESHOLD_EVENTS_PER_SEC
              value: {{ .Values.rateLimit.thresholdEventsPerSec | quote }}
            - name: OLAITAN_WEBHOOK_RATE_LIMIT_COOLDOWN_SECONDS
              value: {{ .Values.rateLimit.cooldownSeconds | quote }}
            - name: OLAITAN_WEBHOOK_RATE_LIMIT_SAMPLING_RATE
              value: {{ .Values.rateLimit.samplingRate | quote }}
          volumeMounts:
            - name: tls
              mountPath: /etc/olaitan/tls
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: tls
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: tls
              scheme: HTTPS
            initialDelaySeconds: 1
            periodSeconds: 5
      volumes:
        - name: tls
          secret:
            secretName: {{ include "olaitan.fullname" . }}-applog-injector-tls
{{- end }}
