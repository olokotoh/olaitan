{{/*
Audit-webhook TLS Secret. Story 1.7. Holds the receiver's serving cert
+ key plus the cluster-CA bundle the receiver uses to verify the
kube-apiserver's client cert (mTLS). Mounted onto the Olaitan
collector DaemonSet at /etc/olaitan/audit-tls/.

Renders only when auditWebhook.enabled=true. Fails render with a loud
message if any of the required material is empty. The chart leaves
cert lifecycle to the operator (Path B per Story 1.7 Task 7); future
stories may add a cert-manager Certificate resource (Path A).

Operators populate the four base64-encoded PEM values:
  auditWebhook.servingCert        -- receiver serving cert PEM
  auditWebhook.servingKey         -- receiver serving key PEM
  auditWebhook.clusterCAData      -- cluster CA that signs apiserver
                                    client cert (e.g. /etc/kubernetes/pki/ca.crt)
  auditWebhook.caBundle           -- receiver-side CA in the kubeconfig
                                    (often equal to the operator's
                                     own self-signed CA over the
                                     receiver's serving cert)
*/}}
{{- if .Values.auditWebhook.enabled -}}
{{- $serving := required "auditWebhook.servingCert is required when auditWebhook.enabled=true (base64-encoded PEM)" .Values.auditWebhook.servingCert -}}
{{- $servingKey := required "auditWebhook.servingKey is required when auditWebhook.enabled=true (base64-encoded PEM)" .Values.auditWebhook.servingKey -}}
{{- $clusterCA := required "auditWebhook.clusterCAData is required when auditWebhook.enabled=true (base64-encoded PEM of the cluster's root CA)" .Values.auditWebhook.clusterCAData -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "olaitan.fullname" . }}-audit-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $serving | quote }}
  tls.key: {{ $servingKey | quote }}
  ca.crt: {{ $clusterCA | quote }}
{{- end }}
