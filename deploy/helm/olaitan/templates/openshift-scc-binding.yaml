{{- if .Values.openshift.bindSCC }}
{{/*
OpenShift SecurityContextConstraints binding (Story 9.4).

OpenShift admits pods against an SCC, and the default `restricted-v2`
forbids hostPath volumes and pins the UID range. Olaitan's collector
needs both exceptions, for two specific and auditable reasons:

  * hostPath -- it bind-mounts Falco's gRPC socket directory (and, when
    containerdSensor is on, the CRI socket directory). restricted-v2
    lists no hostPath in its allowed volume types, so the DaemonSet is
    refused at admission with "unable to validate against any security
    context constraint".

  * a non-assigned UID -- the falco-socket-permissions container runs as
    UID 0 to chmod the socket (Story 9.6), and the collector itself pins
    UID 65532 rather than accepting OpenShift's per-namespace allocated
    range.

`hostmount-anyuid` grants exactly those two and nothing else. It is
deliberately NOT `privileged`: Olaitan's own containers are unprivileged,
drop ALL capabilities and run with a read-only root filesystem, so
binding `privileged` here would hand the collector far more than it uses.
Falco's own DaemonSet does need `privileged` and the Falco subchart ships
its own SCC for that -- this binding covers Olaitan's pods only.

Bound through RBAC (a RoleBinding to the auto-generated
`system:openshift:scc:<name>` ClusterRole) rather than
`oc adm policy add-scc-to-user`, so the grant is declarative, lives with
the release, and is removed by `helm uninstall`.

Namespaced on purpose: a ClusterRoleBinding would grant the SCC to this
ServiceAccount everywhere, which it never needs.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "olaitan.fullname" . }}-collector-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.openshift.scc }}
subjects:
  - kind: ServiceAccount
    name: {{ include "olaitan.collector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
