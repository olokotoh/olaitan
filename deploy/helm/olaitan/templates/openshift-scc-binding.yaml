{{- if .Values.openshift.bindSCC }}
{{/*
OpenShift SecurityContextConstraints binding (Story 9.4).

OpenShift admits pods against an SCC, and the default `restricted-v2`
pins the UID range and forbids hostPath volumes. Olaitan's collector needs
those exceptions for specific, auditable reasons:

  * a non-assigned UID -- the collector pins UID 65532 rather than
    accepting OpenShift's per-namespace allocated range.

  * hostPath -- only when containerdSensor is on, for the CRI socket
    directory. Since Story 10.2 Falco reaches the collector over HTTP, so
    the default install mounts nothing from the host.

`hostmount-anyuid` grants exactly those. It is deliberately NOT
`privileged`: Olaitan's own containers are unprivileged, drop ALL
capabilities and run with a read-only root filesystem, so binding
`privileged` here would hand the collector far more than it uses. Falco's
own DaemonSet does need `privileged` and the Falco subchart ships its own
SCC for that -- this binding covers Olaitan's pods only.

Until Story 10.2 this stock SCC was NOT sufficient: the Falco
socket-permission container requested CHOWN, which hostmount-anyuid's
`allowedCapabilities: null` rejects. That container no longer exists and
no Olaitan container adds a capability, so the stock SCC now fits.

NONE OF THIS HAS BEEN RUN. OpenShift is template-verified only: the chart
renders and validates for it and no one has installed it on a real cluster.
Treat the SCC name above as researched, not confirmed.

Bound through RBAC (a RoleBinding to the auto-generated
`system:openshift:scc:<name>` ClusterRole) rather than
`oc adm policy add-scc-to-user`, so the grant is declarative, lives with
the release, and is removed by `helm uninstall`.

Namespaced on purpose: a ClusterRoleBinding would grant the SCC to this
ServiceAccount everywhere, which it never needs.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "olaitan.fullname" . }}-collector-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.openshift.scc }}
subjects:
  - kind: ServiceAccount
    name: {{ include "olaitan.collector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
