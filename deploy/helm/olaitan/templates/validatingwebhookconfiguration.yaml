{{/*
ValidatingWebhookConfiguration STUB -- admission control, NOT the
audit-webhook backend.

This template is unrelated to the Story 1.7 audit-webhook receiver.
ValidatingWebhookConfiguration is a Kubernetes admission resource: the
apiserver calls it synchronously on incoming API requests and waits for
an accept/reject response (AdmissionReview payload). That is a
different feature on the future roadmap (admission-time policy
enforcement complementing runtime detection -- see Future Work in the
project context). The audit-webhook backend that Story 1.7 implements
is configured via the apiserver's --audit-webhook-config-file flag
pointing at a kubeconfig Secret rendered by
templates/audit-webhook-kubeconfig-secret.yaml -- there is no
"ValidatingWebhookConfiguration audit variant" in Kubernetes
terminology.

This stub remains default-off via auditWebhook.enabled and continues
to gate on the same flag because the keys (caBundle, servicePort) were
introduced for the future admission-control feature in Story 1.1; they
are also reused by the audit-webhook-receiver story for the
kubeconfig + serving-cert side. When auditWebhook.enabled=true, BOTH
this admission-control stub AND the audit-webhook receiver render. If
operators want the receiver without the admission stub, leave the rule
list narrow as below -- the namespace selector excludes the install
namespace and core control-plane namespaces, so this stub causes no
runtime impact in the absence of additional rules.
*/}}
{{- if .Values.auditWebhook.enabled -}}
{{- /*
caBundle is mandatory when the webhook is enabled -- the apiserver dials
the receiver Service over TLS and a missing caBundle silently fails
the handshake under failurePolicy: Ignore (no enforcement at all). Fail
the chart render rather than installing a broken admission gate.

The value must be base64-encoded DER per the K8s schema. Operators
supplying a PEM file via `--set-file` must base64-encode it first
(`base64 -w0 ca.pem`) -- the chart does NOT auto-encode because Helm's
`b64enc` would double-encode an already-encoded value.
*/ -}}
{{- $caBundle := required "auditWebhook.caBundle is required when auditWebhook.enabled=true (base64-encoded DER; `base64 -w0 ca.pem`)" .Values.auditWebhook.caBundle -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "olaitan.fullname" . }}-audit
  labels:
    {{- include "olaitan.labels" . | nindent 4 }}
webhooks:
  - name: audit.olaitan.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    {{- /*
    Exclude the install namespace and core control-plane namespaces so
    chart-managed pod admission, kube-system controllers, and the
    receiver's own bootstrap don't deadlock on this webhook.
    */}}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - {{ .Release.Namespace }}
            - kube-system
            - kube-public
            - kube-node-lease
    clientConfig:
      service:
        name: {{ include "olaitan.fullname" . }}-audit-webhook
        namespace: {{ .Release.Namespace }}
        port: {{ .Values.auditWebhook.servicePort }}
        path: /audit
      caBundle: {{ $caBundle | quote }}
    {{- /*
    Scope rules to the workload-relevant resources Story 1.7 actually
    needs to audit. Story 1.7 may broaden this list -- but starting
    narrow avoids the chicken-and-egg problem on first install.
    */}}
    rules:
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods", "services", "configmaps", "secrets"]
        scope: "Namespaced"
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "daemonsets", "statefulsets"]
        scope: "Namespaced"
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        resources: ["networkpolicies"]
        scope: "Namespaced"
      - operations: ["CREATE", "UPDATE", "DELETE"]
        apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        resources: ["rolebindings", "clusterrolebindings"]
        scope: "*"
{{- end }}
