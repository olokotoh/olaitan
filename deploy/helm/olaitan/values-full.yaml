# values-full.yaml -- the Story 10.5 reference profile: every source on.
#
# Pairs with hack/kind-full.yaml and hack/install-full-kind.sh. This is the
# profile the README documents as the reference install, and the only one
# where all five sources run together.
#
#   hack/install-full-kind.sh <scratch-dir-outside-this-repo>
#
# Do NOT install this file on its own. It is one of FOUR values files: the
# other three carry per-install key material (audit mTLS, Calico Goldmane
# mTLS, applog webhook serving cert) that cannot live in a committed profile,
# and the chart fails render without them. The script generates all three and
# passes them, in the one order that works.
#
# Why this file exists: values-kind.yaml leaves auditWebhook,
# containerdSensor, calicoSensor and applogSidecar at their chart defaults
# of false, so before Story 10.5 there was no supported way to run the
# whole system at once, and the five-source combination had never been
# exercised on a live cluster.
#
# Falco is not switched on here because it is not switched off anywhere: the
# chart default is already true, and Story 10.4 made that invariant a test
# (tests/e2e/falco_on_test.go plus the deploy/helm guard that scans every
# values overlay, Makefile target, workflow, hack/ and tests/e2e/ file for
# any way of turning Falco off). This profile must never switch Falco off.
#
# That guard matches on text, so do not spell the disabling key and the
# value "false" next to each other even inside a comment: this file tripped
# the guard on its first CI run doing exactly that, which is the guard
# working correctly rather than a false positive.

# --- Source 1: Falco ---------------------------------------------------
# Nothing to set. The chart default already installs Falco and points its
# http_output at the collector's falcoIngest port.

# --- Source 2: Kubernetes audit events ---------------------------------
auditWebhook:
  enabled: true
  servicePort: 8443
  containerPort: 8443

  # kind runs the apiserver as a static pod on the control-plane node's
  # host network, so it uses the node's resolver and cannot resolve the
  # in-cluster Service FQDN that the empty serverAddress default implies.
  #
  # Loopback + hostPort is what makes this profile installable at all.
  # The apiserver needs its audit kubeconfig to exist BEFORE the cluster
  # is created (it is a static pod and refuses to start without the file),
  # so the address in that kubeconfig cannot be a node IP: no node exists
  # yet to have one. 127.0.0.1 is knowable in advance, is stable across
  # recreations, and is reachable because hostPort publishes the receiver
  # on the node's own loopback, where the host-network apiserver dials it.
  serverAddress: "127.0.0.1:8443"
  hostPort: 8443
  hostIP: "127.0.0.1"

  # caBundle, clusterCAData, apiserverClientCert and apiserverClientKey
  # are deliberately NOT set here. They are per-install key material
  # generated by hack/audit-webhook-certs.sh, which emits them ready for
  # `helm install -f`. Committing them to a profile would ship a private
  # key in the repository and pin every install to one CA. The chart
  # fails render when they are missing, which is the correct behaviour:
  # install through hack/install-full-kind.sh, which supplies them.

# --- Source 3: containerd CRI lifecycle --------------------------------
containerdSensor:
  enabled: true
  # kind ships stock containerd, socket 0660 root:root, so group 0 is
  # correct here. Verify on any other runtime layout with
  # `stat -c %g /run/containerd/containerd.sock` on a node.
  socketGroup: 0

# --- Source 4: Calico Goldmane flows -----------------------------------
calicoSensor:
  enabled: true
  # Defaults match the Tigera operator v3.31.5 layout that
  # hack/install-calico-kind.sh installs. Left explicit rather than
  # inherited so that a Tigera upgrade that moves the Service shows up as
  # a diff in this profile rather than as a silent health failure.
  goldmaneAddr: "goldmane.calico-system.svc:7443"
  serverName: "goldmane.calico-system.svc"

# --- Source 5: application log sidecar ---------------------------------
applogSidecar:
  enabled: true
  # kind is 1.29+, so the KEP-753 native sidecar (initContainer with
  # restartPolicy: Always) is available and is the correct pattern.
  useNativeSidecar: true

# --- Collector placement -----------------------------------------------
collector:
  # Required by auditWebhook.hostPort above: the apiserver runs on a
  # control-plane node and dials its OWN node's loopback, so a collector
  # that never schedules there means the audit source is permanently
  # unhealthy while every other source looks fine. kind taints the
  # control-plane NoSchedule by default, so without this the DaemonSet
  # skips exactly the node that matters.
  runOnControlPlane: true

# --- Enforcement -------------------------------------------------------
# AC3: hack/check-netpol-enforcement.sh must return ENFORCED on kind-full.
# That is only meaningful because this cluster runs Calico; on the kindnetd
# e2e cluster NetworkPolicy objects are accepted and never enforced, so the
# same setting there would prove nothing.
response:
  # Story 10.6 (the part of issue #151 it needs): this profile installs into
  # `default`, which is not on the shipped excluded list (kube-system,
  # olaitan). Without this, Olaitan's own aggregator and Ollama crossed the
  # multi-signal threshold at startup and their FR19 chains queued ahead of
  # a real attack. Test workloads run in their own namespaces, so excluding
  # all of `default` costs nothing here. Whether the profile should move to
  # its own namespace instead stays open on issue #151.
  excludeReleaseNamespace: true
  networkPolicy:
    enabled: true
    # MUST match networking.podSubnet and networking.serviceSubnet in
    # hack/kind-full.yaml, and the Tigera Installation ipPools cidr that
    # hack/install-calico-kind.sh derives from that same file. Wrong values
    # here do not fail the install: they silently break in-cluster traffic
    # and DNS for any workload moved to RESTRICTED, which surfaces much
    # later as an unexplained timeout.
    clusterCidrs:
      - "10.244.0.0/16"
      - "10.96.0.0/16"

# --- The LLM analyst tier (Story 10.6) ---------------------------------
# A real model, in-cluster, with no API key. Every chain role (L1, L2,
# Senior) routes to the local provider, which the chart points at its own
# Ollama Service. The trust cap for this family is 25 and is enforced in
# code, not here (cmd/olaitan/analyst_chain.go roleScoreCap).
#
# Model: qwen2.5:3b-instruct (Q4_K_M, about 1.9 GB). The strongest JSON and
# instruction follower at the 3B size, and small enough to sit in memory next to every other component of this
# profile. The provider also sends each role's JSON Schema as Ollama's
# native `format`, so decoding is constrained to schema-valid replies.
# Licence note: the 3B Qwen2.5 weights are under the Qwen Research licence
# (the 0.5B/1.5B/7B/14B/32B sizes are Apache-2.0). For commercial use,
# change BOTH analyst.local.model and ollama.pull.models, for example to
# qwen2.5:7b-instruct (Apache-2.0, about twice as slow on CPU).
#
# SPEED, measured (Story 10.6, AWS m6i.2xlarge, 8 vCPU, no GPU, the whole
# profile running beside it): about 17 to 27 tokens/s to read a prompt and
# about 8.5 tokens/s to write. A chain role's prompt is 8k to 10k tokens
# (the evidence package, the role schema and, for L2 and Senior, the
# earlier verdicts), so each role spends 6.5 to 8 minutes just reading it:
# about 7 minutes per role, over 20 minutes per incident, and incidents
# queue behind each other in the single FSM consumer. That is enough to
# prove the tier runs keyless, not enough to keep up with a live cluster.
# For real-time use give Ollama a GPU node (set ollama.nodeSelector /
# tolerations and a GPU resource), or use a hosted model below.
#
# DeepSeek or Claude instead: layer values-llm-deepseek.yaml or
# values-llm-claude.yaml after this file and supply the key out of band:
# create a Secret holding it under `llm-api-key` and set
# secrets.llmApiKeyExistingSecret to its name (or --set-file
# secrets.llmApiKey=...). This in-cluster model then stays on as the FR28
# fallback for every role.
analyst:
  provider: local
  local:
    # Must name a model in ollama.pull.models below.
    model: "qwen2.5:3b-instruct"

ollama:
  enabled: true
  pull:
    models:
      - "qwen2.5:3b-instruct"
  persistence:
    enabled: true
    create: true
    size: 10Gi
  extraEnv:
    # The evidence package, the role schema and (for L2 and Senior) the
    # earlier verdicts must all fit, or Ollama silently truncates the
    # FRONT of the prompt, which is where the system prompt lives.
    # Measured role prompts run 8k to 10k tokens, so 8192 was too small.
    - name: OLLAMA_CONTEXT_LENGTH
      value: "16384"
    # Keep the model resident: a cold load costs seconds on every call.
    - name: OLLAMA_KEEP_ALIVE
      value: "-1"
    # One chain runs at a time (the FSM consumer is single-threaded), so
    # parallel slots would only multiply the KV cache.
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "1"
  resources:
    # No CPU limit on purpose: inference should use every idle core.
    requests:
      cpu: "2"
      memory: 3Gi
    limits:
      memory: 6Gi

aggregator:
  extraEnv:
    # The per-role LLM budgets (30s L1, 30s L2, 60s Senior) are calibrated
    # for a hosted model. A 3B model on shared CPU reads a few thousand
    # prompt tokens per role before it writes a word (6.5 to 8 minutes on
    # 8 vCPUs, see SPEED above), so the budgets are scaled (DW3.8-1):
    # 600s L1, 600s L2, 1200s Senior.
    - name: OLT_LLM_ROLE_TIMEOUT_MULTIPLIER
      value: "20"

# --- Falco on kind (moved here from the Story 10.7 overlay) -------------
# The kind mount-product-files hook exception, copied verbatim from
# values-kind.yaml (Story 10.3; read the reasoning there). This profile does
# not layer values-kind.yaml, since that file switches NetworkPolicy
# enforcement off, so without this "Drop and execute new binary in
# container" fires on every pod start and opens an incident for the new pod
# before anything has happened to it. The exception is as narrow as in
# values-kind.yaml; the rule still catches everything else. The Story 10.7
# review deferred it here, and Story 10.6 needs it too: the incident the
# real model is asked about must be the attack, not container start-up.
falco:
  customRules:
    olaitan-kind-exceptions.yaml: |-
      - rule: Drop and execute new binary in container
        exceptions:
          - name: kind_mount_product_files_hook
            fields: [proc.pname, proc.exepath]
            comps: [=, in]
            values:
              - [mount-product-f, [/usr/bin/mount, /usr/bin/umount]]
        override:
          exceptions: append
