# values-full.yaml -- the Story 10.5 reference profile: every source on.
#
# Pairs with hack/kind-full.yaml and hack/install-full-kind.sh. This is the
# profile the README documents as the reference install, and the only one
# where all five sources run together.
#
#   hack/install-full-kind.sh <scratch-dir-outside-this-repo>
#
# Do NOT install this file on its own. It is one of FOUR values files: the
# other three carry per-install key material (audit mTLS, Calico Goldmane
# mTLS, applog webhook serving cert) that cannot live in a committed profile,
# and the chart fails render without them. The script generates all three and
# passes them, in the one order that works.
#
# Why this file exists: values-kind.yaml leaves auditWebhook,
# containerdSensor, calicoSensor and applogSidecar at their chart defaults
# of false, so before Story 10.5 there was no supported way to run the
# whole system at once, and the five-source combination had never been
# exercised on a live cluster.
#
# Falco is not switched on here because it is not switched off anywhere: the
# chart default is already true, and Story 10.4 made that invariant a test
# (tests/e2e/falco_on_test.go plus the deploy/helm guard that scans every
# values overlay, Makefile target, workflow, hack/ and tests/e2e/ file for
# any way of turning Falco off). This profile must never switch Falco off.
#
# That guard matches on text, so do not spell the disabling key and the
# value "false" next to each other even inside a comment: this file tripped
# the guard on its first CI run doing exactly that, which is the guard
# working correctly rather than a false positive.

# --- Source 1: Falco ---------------------------------------------------
# Nothing to set. The chart default already installs Falco and points its
# http_output at the collector's falcoIngest port.

# --- Source 2: Kubernetes audit events ---------------------------------
auditWebhook:
  enabled: true
  servicePort: 8443
  containerPort: 8443

  # kind runs the apiserver as a static pod on the control-plane node's
  # host network, so it uses the node's resolver and cannot resolve the
  # in-cluster Service FQDN that the empty serverAddress default implies.
  #
  # Loopback + hostPort is what makes this profile installable at all.
  # The apiserver needs its audit kubeconfig to exist BEFORE the cluster
  # is created (it is a static pod and refuses to start without the file),
  # so the address in that kubeconfig cannot be a node IP: no node exists
  # yet to have one. 127.0.0.1 is knowable in advance, is stable across
  # recreations, and is reachable because hostPort publishes the receiver
  # on the node's own loopback, where the host-network apiserver dials it.
  serverAddress: "127.0.0.1:8443"
  hostPort: 8443
  hostIP: "127.0.0.1"

  # caBundle, clusterCAData, apiserverClientCert and apiserverClientKey
  # are deliberately NOT set here. They are per-install key material
  # generated by hack/audit-webhook-certs.sh, which emits them ready for
  # `helm install -f`. Committing them to a profile would ship a private
  # key in the repository and pin every install to one CA. The chart
  # fails render when they are missing, which is the correct behaviour:
  # install through hack/install-full-kind.sh, which supplies them.

# --- Source 3: containerd CRI lifecycle --------------------------------
containerdSensor:
  enabled: true
  # kind ships stock containerd, socket 0660 root:root, so group 0 is
  # correct here. Verify on any other runtime layout with
  # `stat -c %g /run/containerd/containerd.sock` on a node.
  socketGroup: 0

# --- Source 4: Calico Goldmane flows -----------------------------------
calicoSensor:
  enabled: true
  # Defaults match the Tigera operator v3.31.5 layout that
  # hack/install-calico-kind.sh installs. Left explicit rather than
  # inherited so that a Tigera upgrade that moves the Service shows up as
  # a diff in this profile rather than as a silent health failure.
  goldmaneAddr: "goldmane.calico-system.svc:7443"
  serverName: "goldmane.calico-system.svc"

# --- Source 5: application log sidecar ---------------------------------
applogSidecar:
  enabled: true
  # kind is 1.29+, so the KEP-753 native sidecar (initContainer with
  # restartPolicy: Always) is available and is the correct pattern.
  useNativeSidecar: true

# --- Collector placement -----------------------------------------------
collector:
  # Required by auditWebhook.hostPort above: the apiserver runs on a
  # control-plane node and dials its OWN node's loopback, so a collector
  # that never schedules there means the audit source is permanently
  # unhealthy while every other source looks fine. kind taints the
  # control-plane NoSchedule by default, so without this the DaemonSet
  # skips exactly the node that matters.
  runOnControlPlane: true

# --- Enforcement -------------------------------------------------------
# AC3: hack/check-netpol-enforcement.sh must return ENFORCED on kind-full.
# That is only meaningful because this cluster runs Calico; on the kindnetd
# e2e cluster NetworkPolicy objects are accepted and never enforced, so the
# same setting there would prove nothing.
response:
  networkPolicy:
    enabled: true
    # MUST match networking.podSubnet and networking.serviceSubnet in
    # hack/kind-full.yaml, and the Tigera Installation ipPools cidr that
    # hack/install-calico-kind.sh derives from that same file. Wrong values
    # here do not fail the install: they silently break in-cluster traffic
    # and DNS for any workload moved to RESTRICTED, which surfaces much
    # later as an unexplained timeout.
    clusterCidrs:
      - "10.244.0.0/16"
      - "10.96.0.0/16"
