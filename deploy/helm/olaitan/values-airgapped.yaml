# values-airgapped.yaml -- the FR48 air-gapped / data-residency
# reference overlay (Story 3.4; architecture.md:963).
#
#   helm upgrade --install olaitan deploy/helm/olaitan \
#     -f deploy/helm/olaitan/values-airgapped.yaml
#
# WHY: when analyst.provider is "api", evidence packages cross the
# cluster boundary into a third-party LLM provider's infrastructure.
# Operators under data-residency constraints (GDPR, financial-services
# localisation) run the LLM tier fully in-cluster instead: the local
# (Ollama) provider makes no external call at all (prd.md:241). The
# trade-off is a lower trust cap: the Ollama tier contributes at most
# analyst.score_cap=25 of 100 to the ThreatScore (versus 35 for the
# Claude tier), enforcement landing with Story 3.7.
#
# RESTART-REQUIRED: the analyst ring is constructed at startup; after
# switching provider run
#   kubectl rollout restart deploy/olaitan-aggregator
#
# MODEL PROVISIONING IS OPERATOR-OWNED: the chart deploys the Ollama
# server only. Bake the model into the image or pre-populate a volume
# (ollama.persistence.existingClaim) -- in a true air-gapped cluster
# `ollama pull` has nowhere to pull from. analyst.local.model MUST name
# a model that is actually present; the provider fails construction on
# an empty model and a wrong name surfaces as a permanent 404 (see
# docs/runbook.md, air-gapped section, for the full checklist including
# Health warm-up and the num_ctx <-> MaxContextTokens pairing).

# The in-cluster Ollama surface (Deployment + Service + NetworkPolicy
# restricting ingress to the olaitan controller, egress declared empty).
ollama:
  enabled: true
  # resources: size for the model you provisioned; a 70b-class model
  # wants tens of GiB of memory. Left unset here deliberately -- sizing
  # is cluster-specific.
  # persistence:
  #   enabled: true
  #   existingClaim: ollama-models

analyst:
  # "local" is the config-side selector for the in-cluster Ollama path
  # (the PRD-level name "analyst.provider: ollama" arrives as a Helm
  # alias with Story 3.16's evaluation-mode wiring).
  provider: "local"
  # The Ollama-tier trust cap (PRD ladder: 35 Claude / 30 OpenAI-class
  # / 25 local Ollama). The file-side default targets the Claude tier;
  # this overlay pins the local-tier value. Story 3.7 owns enforcement;
  # the aggregator logs a loud warning if this exceeds 25.
  score_cap: 25
  local:
    # endpoint is deliberately UNSET: with ollama.enabled the chart
    # derives the rendered Service DNS
    # (<release>-olaitan-ollama.<namespace>.svc.cluster.local) for any
    # release name and namespace. Set it only for an EXTERNAL,
    # user-managed Ollama.
    endpoint: ""
    # PRD Journey 3 reference model; replace with what you provisioned.
    model: "llama3.1:70b"

# No external LLM egress: networkPolicy.extraEgress stays EMPTY -- that
# is the point of this overlay. (The release NetworkPolicy's
# intra-namespace egress already covers aggregator -> ollama.)
networkPolicy:
  extraEgress: []

# AC2 RECONCILIATION (Story 6.6). The air-gapped AC names two literals
# that the chart renders differently; both are honoured by the chart's
# own machinery, not by hand-forcing a value:
#
#   - analyst.provider: ollama  -- the chart provider enum is
#     [none, api, local]; "ollama" is valid only as a per-ROLE provider.
#     "local" is the chart-level selector the Go loader maps to the
#     in-cluster Ollama provider (api -> claude, local -> ollama), so
#     provider: "local" above IS the air-gapped Ollama selection.
#   - analyst.endpoint: http://ollama.olaitan.svc.cluster.local:11434 --
#     the chart key is analyst.local.endpoint, and with ollama.enabled
#     the chart DERIVES it to
#     http://<fullname>-ollama.<namespace>.svc.cluster.local:11434
#     (for `helm install olaitan -n olaitan`:
#     http://olaitan-ollama.olaitan.svc.cluster.local:11434). The
#     hostname differs from the AC literal only by the chart's
#     <fullname>-ollama Service-naming convention; the intent (an
#     in-cluster Ollama Service, no external dial) is met. Leaving
#     analyst.local.endpoint empty above lets the chart derive it for
#     any release / namespace.

# No outbound incident notifications: the air-gapped posture has no
# external webhook to reach (FR48). This is the chart default; it is
# stated explicitly here so the no-external-egress commitment is
# self-documenting for the air-gapped operator.
notifications:
  enabled: false

# Redis egress: nothing to set. Before Story 12.6 the bundled Redis was the
# Bitnami subchart, whose NetworkPolicy allowed all egress by default, so
# this overlay closed it down to cluster DNS. The chart's own Redis
# (templates/redis.yaml) declares NO egress at all in every profile: a
# standalone Redis dials nothing, not even DNS.

# --- Container images ------------------------------------------------
# "Air-gapped" in this file means LLM-provider egress (Ollama instead of
# Claude/OpenAI), not registry reachability: the bundled Falco, NATS and
# Redis images still pull from their public registries. Every one is pinned
# by tag and digest (Story 12.6), so mirror them by digest (crane copy,
# skopeo copy --all keep it) and override the image values in values.yaml
# (falco.image, falco.falcoctl.image, nats.*.image.fullImageName,
# redis.image) with your mirror if your nodes cannot reach them. (Story 10.2
# removed the busybox socket-permission container that used to be the first
# default-on image to worry about here.)
