# Default values for the Olaitan chart. Override with `--set key=value`
# or a custom values file (`helm install -f my-values.yaml`). See
# deploy/helm/README.md for the operator-facing configuration guide.

# --- Container image ---------------------------------------------------
# Published image. ghcr.io is free for public repositories and the
# project already uses the olokotoh org there. Tag defaults to
# .Chart.AppVersion so a `helm install` without overrides pins to a
# chart-coherent release.
image:
  repository: ghcr.io/olokotoh/olaitan
  # Empty = fall back to .Chart.AppVersion in _helpers.tpl's
  # "olaitan.image" helper. Set explicitly (e.g. a commit SHA) to pin a
  # pre-release image.
  tag: ""
  # IfNotPresent avoids gratuitous registry traffic on pod restart; use
  # Always only for mutable dev tags (not recommended in production).
  pullPolicy: IfNotPresent

# Private-registry pull credentials. Empty by default -- ghcr.io/olokotoh
# is public. Operators add their own imagePullSecret names here when
# retagging Olaitan into a private registry.
imagePullSecrets: []

# Optional overrides to the chart name / release fullname. Rarely used;
# the defaults (Chart.Name, Release.Name-Chart.Name) are sufficient for
# typical single-release installs.
nameOverride: ""
fullnameOverride: ""

# --- Collector (Ring 1 DaemonSet) --------------------------------------
# One pod per node; consumes Falco gRPC + Kubernetes audit + cgroup
# signals, forwards enriched events to the aggregator over NATS.
collector:
  # Resource envelope sized for the collector's job: decode+enrich+publish
  # on a hot path. 256Mi limit is headroom over observed ~80-120Mi usage
  # on the demo cluster (Falco event rate ~200/s).
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Control-plane nodes have a NoSchedule taint by default (kubeadm
  # convention). When `true`, collector tolerates the taint and runs on
  # master nodes too -- useful for single-node dev clusters. Off by
  # default: production clusters keep control planes isolated.
  runOnControlPlane: false
  # Extra node-selection constraints beyond the DaemonSet default
  # (which already scopes to every schedulable node). Merge, don't
  # replace, in the template.
  nodeSelector: {}
  tolerations: []

# --- Aggregator (Rings 2-4 Deployment) ---------------------------------
# Singleton in MVP; rings are cooperative goroutines inside one process.
# See Dev Notes § "The aggregator-replicas-1 constraint" for why this
# must stay at 1 until Story 8.1 introduces leader election.
aggregator:
  # HARD CONSTRAINT. Do NOT raise above 1 until leader election lands.
  # Two aggregator pods would split-brain the NATS JetStream checkpoint
  # (Redis key checkpoint:correlator:stream_seq) -- events get processed
  # twice, recovery breaks.
  replicas: 1
  # 256Mi request / 512Mi limit. NFR5 targets "< 200 MB steady state",
  # but 256Mi leaves headroom for fsnotify watch buffers (1.6) and
  # future LLM context assembly (Epic 4). The 512Mi limit prevents OOM
  # on a long-running pod as rule sets grow.
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []

# --- Ring-2 correlator ------------------------------------------------
# Story 1.14 -- per-workload sliding-window buffer and EvidencePackage
# assembler. Values are bridged into detection.correlator in the
# rendered olaitan.yaml ConfigMap. maxPackageBytes is intentionally
# fixed at 131072 unless the architecture changes.
correlator:
  windowDuration: "60s"
  maxPackageBytes: 131072
  multiSignalMinSources: 2
  highSeverityThreshold: 50

# --- Service endpoints -------------------------------------------------
# Where Olaitan dials its dependencies. Empty by default -- the templates
# fall back to release-name-derived subchart Service names via the
# `olaitan.endpoints.nats` / `olaitan.endpoints.redis` helpers
# (`<release>-nats`, `<release>-redis-master`). Set explicitly to point
# at externally-managed infra (e.g. when `<name>.enabled=false`).
endpoints:
  # Empty → "nats://<release>-nats:4222" (subchart's headless Service).
  nats: ""
  # Empty → "<release>-redis-master:6379" (subchart's primary Service).
  redis: ""
  # Falco gRPC socket. Mounted via hostPath from the Falco DaemonSet;
  # local-unix-socket is lower-latency than the TCP/gRPC mode.
  # [Source: architecture.md:130]
  falco: "unix:///run/falco/falco.sock"

# --- Operator-provided secrets ----------------------------------------
# All three default to "" so the Secret always renders (downstream pods
# mount it unconditionally). Operators supply real values via
# `--set-file` or an external-secrets-operator reconciliation. Downstream
# ring code (Epic 2+) validates non-empty before dialling; the chart is
# not responsible for secret lifecycle. [Source: Dev Notes § "Secrets"]
secrets:
  # Redis AUTH password (NFR8). Empty at install time; Story 2.x wiring
  # refuses to start the Redis client if empty.
  redisPassword: ""
  # NATS client credentials (for cluster-mode NATS with auth). Empty by
  # default; demo cluster runs NATS without auth.
  natsCreds: ""
  # LLM provider API key (OpenAI/Anthropic/…). Empty by default; Epic 4
  # analyst ring refuses to start when analyst.provider=api with empty.
  llmApiKey: ""

# --- DFIR report PVC ---------------------------------------------------
# Read-write volume for JSON evidence files + markdown narratives (Epic
# 6). Mounted only on the aggregator pod -- collector has no write side.
reports:
  # "" = use the cluster's default StorageClass. Override on clusters
  # where the operator wants a specific class (e.g., `standard-rwo`).
  storageClass: ""
  # 1Gi covers a demo-scale incident volume; operators bump this up for
  # long-running clusters with high detection rates.
  size: 1Gi
  # Set true to skip PVC creation and bind to an externally-managed
  # claim named `<fullname>-reports` in the release namespace. The
  # aggregator Deployment always references the same PVC name.
  externalPvc: false

# --- Probe timing ------------------------------------------------------
# livenessProbe + readinessProbe parameters, shared by DaemonSet and
# Deployment. initialDelaySeconds: 3 -- config load + watcher start +
# health server bind take <1s on a warm image; 3s absorbs cold-start
# variance without masking a real startup failure.
probes:
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 3

# --- NetworkPolicy ----------------------------------------------------
# Namespace-scoped baseline isolation policy. Default-on because the
# architecture treats namespace isolation as a baseline control rather
# than an opt-in. Operators on flat networks (or operating in clusters
# where the CNI does not enforce NetworkPolicy) can disable with
# `--set networkPolicy.enabled=false`. [Source: architecture.md:355-360]
networkPolicy:
  enabled: true
  # CIDR block of node IPs (host network). Required for kubelet to reach
  # pod liveness/readiness probes when the CNI enforces NetworkPolicy on
  # host-network traffic -- Calico in eBPF dataplane is the load-bearing
  # case. Default-iptables Calico bypasses policy on host-network traffic
  # so the policy works without this set. Empty = no kubelet allow-rule.
  # Operators on eBPF dataplane MUST set this to the cluster's node CIDR
  # (e.g. "10.0.0.0/16"); otherwise pods never reach Ready.
  nodeCIDR: ""
  # CIDR for the Kubernetes API server virtual IP. Default 10.96.0.1/32
  # is the kubeadm 1.29 stock service-CIDR ClusterIP for the kubernetes
  # Service. Override on clusters with a non-default service-CIDR. The
  # aggregator's pod-patch path needs egress here.
  apiServerCIDR: "10.96.0.1/32"
  # Extra egress rules merged into the policy as-is. Operators populate
  # this with the LLM provider endpoints they actually use; values are
  # raw NetworkPolicyEgressRule objects so the full schema is available
  # without us having to mirror it in chart-level keys. Production
  # overlays (Story 6.6) will ship a populated default for the common
  # providers.
  extraEgress: []

# --- Audit webhook ----------------------------------------------------
# Story 1.7 -- Kubernetes audit webhook receiver. Default-off so chart
# installs without the operator-side kube-apiserver wiring continue to
# render. Operators flip enabled=true after they have applied the
# kube-apiserver --audit-webhook-config-file + --audit-policy-file
# patches per deploy/helm/olaitan/AUDIT.md.
#
# Note on terminology: the architecture document refers to this as a
# "ValidatingWebhookConfiguration audit-webhook variant" -- that is
# incorrect Kubernetes terminology. Audit webhook backends are NOT
# ValidatingWebhookConfiguration resources; they are configured via
# the apiserver's --audit-webhook-config-file flag pointing at a
# kubeconfig Secret. The existing
# deploy/helm/olaitan/templates/validatingwebhookconfiguration.yaml is
# an admission-webhook stub from Story 1.1 (a separate feature) and is
# left alone by this story. See AUDIT.md for the full reconciliation.
# [Source: epics.md Story 1.7, architecture.md:§Audit Webhook TLS]
auditWebhook:
  enabled: false

  # Service port the apiserver dials. 8443 is the convention for
  # webhook receivers in the K8s ecosystem.
  servicePort: 8443

  # Container port the receiver listens on. Must match the kubeconfig
  # 'server' URL the apiserver dials.
  containerPort: 8443

  # base64-encoded PEM bytes of the CA that signed the receiver's
  # serving cert. The apiserver kubeconfig embeds this as
  # certificate-authority-data so the apiserver trusts the receiver
  # during mTLS. Required when enabled=true; chart fails render
  # otherwise. Operators base64-encode the PEM file themselves
  # (`base64 -w0 ca.pem`); the chart does NOT re-encode (Helm's
  # b64enc would double-encode). Multi-line wrapped output (e.g. plain
  # `base64` without -w0) MUST be stripped to one line before pasting.
  caBundle: ""

  # Operator-supplied cluster-CA data -- the CA that signs the
  # kube-apiserver's client certificate presented during mTLS to the
  # receiver. On kubeadm clusters this is the cluster's root CA at
  # /etc/kubernetes/pki/ca.crt; extract and base64-encode before set.
  # See AUDIT.md for the extraction recipe. Required when enabled=true.
  clusterCAData: ""

  # Audit kubeconfig credentials the apiserver presents to the
  # receiver during mTLS. apiserverClientCert / apiserverClientKey are
  # base64-encoded PEMs of the client cert + private key issued for
  # CN=kube-apiserver. Required when enabled=true.
  apiserverClientCert: ""
  apiserverClientKey: ""

  # Receiver serving cert + key. Operator-supplied (Path B per Story
  # 1.7 Task 7); base64-encoded PEM. Path A (cert-manager) is deferred
  # to a future Helm hardening story per AUDIT.md.
  servingCert: ""
  servingKey: ""

  # Audit policy. When custom is non-empty the chart renders it
  # verbatim into the policy ConfigMap; otherwise the chart's
  # files/audit-policy-default.yaml is used. The default policy is
  # justified in Story 1.7 Task 2.2 (kubelet/controller-manager noise
  # filtered, RBAC + NetPol + Secret + exec/portforward elevated).
  policy:
    custom: ""

  # NOTE: runtime adapter knobs (listen_addr, TLS file paths,
  # max_payload_bytes, staleness_timeout, publish_retry) live in
  # config/olaitan.yaml under detection.sources.audit. The chart
  # renders config/olaitan.yaml verbatim into the ConfigMap via
  # `.Files.Get` -- no Helm-values overlay is applied -- so operators
  # who want to tune these knobs MUST edit config/olaitan.yaml before
  # `make helm-prepare && helm install`. The dual-flag relationship
  # also requires `detection.sources.audit.enabled: true` in
  # config/olaitan.yaml AND `auditWebhook.enabled: true` here for the
  # receiver to actually run; the chart fails render with a clear
  # message if the flags disagree (see templates/audit-policy-
  # configmap.yaml). See AUDIT.md for the full operator workflow.

# --- containerd CRI lifecycle sensor ---------------------------------
# Story 1.8 -- third Ring 1 sensor source (FR3). Subscribes to the
# containerd CRI runtime via RuntimeService.GetContainerEvents over a
# Unix domain socket bind-mounted from the host. Default-off until the
# operator confirms the socket path is correct on their cluster's
# nodes and the security boundary documented in CRI.md is acceptable.
#
# The chart renders the per-node hostPath volume + volumeMount only
# when containerdSensor.enabled=true; the runtime adapter knobs
# (socket_path, dial_timeout, staleness_timeout, retry strategies)
# live in config/olaitan.yaml under detection.sources.containerd. The
# dual-flag relationship requires both blocks set to enabled=true for
# the adapter to actually run.
#
# Security boundary: mounting the containerd CRI socket grants the
# agent the full CRI surface on the node (list+exec+image-pull); see
# CRI.md for the threat model. Privilege equivalent to the existing
# Falco socket mount; threat model unchanged from the post-Story-1.6
# baseline.
containerdSensor:
  enabled: false

  # Path on the host node to the containerd CRI socket. Default for
  # containerd 1.7 on a stock kubeadm 1.29 cluster. Operators using a
  # non-standard install layout (k3s, microk8s, custom containerd
  # build) override here. The value flows through the rendered
  # ConfigMap into detection.sources.containerd.socket_path so a
  # single Helm override updates both the host-path mount and the
  # adapter's runtime knob (mirrors auditWebhook.enabled bridging).
  socketPath: /run/containerd/containerd.sock

  # gRPC dial timeout for the initial wait-for-ready handshake. Bumped
  # past the default for slow nodes where containerd's CRI server
  # takes longer than 10s to come up post-restart. Bridged into
  # detection.sources.containerd.dial_timeout.
  dialTimeout: "10s"

  # Staleness watchdog threshold. CRI lifecycle events are quiet by
  # design: a stable cluster with no Pod churn can go hours without an
  # event, so the watchdog only flips MarkUnhealthy when staleness
  # AND a non-Ready connection coincide. Bridged into
  # detection.sources.containerd.staleness_timeout.
  stalenessTimeout: "5m"

  # Outer connect-loop backoff strategy used when the gRPC dial or
  # GetContainerEvents stream open fails. Equal-jitter exponential
  # backoff; max_attempts=0 means unlimited (the long-lived DaemonSet
  # adapter never gives up on its own). Bridged into
  # detection.sources.containerd.connect_retry.
  connectRetry:
    min: "1s"
    max: "30s"
    multiplier: 2.0
    jitter: 0.5
    maxAttempts: 0

  # Per-publish bounded retry strategy. Combined with the per-attempt
  # 2s deadline this caps total transient backoff at ~9s before the
  # stream loop log+drops. jitter=0.1 matches the code default in
  # internal/collector/cri.DefaultPublishRetry. Bridged into
  # detection.sources.containerd.publish_retry.
  publishRetry:
    min: "100ms"
    max: "1s"
    multiplier: 2.0
    jitter: 0.1
    maxAttempts: 3

# --- Calico CNI flow sensor (FR4) ------------------------------------
# Story 1.10 -- fifth Ring 1 streaming sensor source. Subscribes to
# the Calico Goldmane gRPC API (`goldmane.Flows.Stream`) over mTLS,
# translating each FlowResult into a schema.Event of source=network /
# category=flow. Default-off because Goldmane requires the Tigera
# operator install path on Calico v3.31.5+; see CNI.md for the full
# operator workflow and ADR-2026-04-30-01 / ADR-2026-05-12-01 in
# docs/deferred-decisions.md for the install-path migration rationale.
#
# Dual-flag relationship: calicoSensor.enabled here AND
# detection.sources.calico.enabled in config/olaitan.yaml must both
# be true for the adapter to run. The chart fails render with a clear
# message if calicoSensor.enabled=true but TLS material is missing.
#
# Security boundary: mTLS-authenticated egress to
# `goldmane.calico-system.svc:7443` (within-cluster). The agent must
# present a client cert signed by the Tigera operator's CA. Two
# provisioning paths are supported (Path A cert-manager, Path B
# operator-supplied) -- see CNI.md.
calicoSensor:
  enabled: false

  # gRPC target for the Calico Goldmane Service. Default matches the
  # Tigera operator's v3.31.5 install layout. Operators with
  # non-default cluster install paths override here.
  goldmaneAddr: "goldmane.calico-system.svc:7443"

  # TLS SNI / verify name presented during the mTLS handshake. Default
  # matches the cert the Tigera operator issues for Goldmane.
  serverName: "goldmane.calico-system.svc"

  # FlowStreamRequest knobs. StartTimeGte is negative for "relative
  # to now" (Goldmane convention; -60 means "replay the last 60s").
  # An explicit 0 reaches Goldmane's documented "now" semantic per
  # the v3.31.5 proto contract (goldmane/proto/api.proto line 91:
  # "A value of zero means 'now'"); pass null / omit to fall back
  # to the chart default of -60. Goldmane requires AggregationInterval
  # to be exactly 15s per the same proto contract (line 100: "It
  # must always be 15s.").
  startTimeGte: -60
  aggregationInterval: 15

  # gRPC dial timeout for the initial wait-for-ready handshake.
  # Bridged into detection.sources.calico.dial_timeout.
  dialTimeout: "10s"

  # Staleness watchdog threshold. Goldmane flow records are quiet by
  # design: a cluster with no east-west traffic produces no
  # FlowResults, so the watchdog only flips MarkUnhealthy when
  # staleness AND a non-Ready connection coincide. Bridged into
  # detection.sources.calico.staleness_timeout.
  stalenessTimeout: "10m"

  # Per-event marshalled size cap. The default of 196608 bytes (192
  # KiB) leaves 64 KiB of envelope headroom under JetStream's 256 KiB
  # MaxMsgSize ceiling. Events exceeding this cap are log+dropped at
  # translate time. Floor 4096; ceiling 262144 (256 KiB). Bridged
  # into detection.sources.calico.max_event_bytes.
  maxEventBytes: 196608

  # Outer connect-loop backoff strategy used when the gRPC dial, mTLS
  # handshake, or stream open fails. Equal-jitter exponential
  # backoff; max_attempts=0 means unlimited. Bridged into
  # detection.sources.calico.connect_retry.
  connectRetry:
    min: "1s"
    max: "60s"
    multiplier: 2.0
    jitter: 1.0
    maxAttempts: 0

  # Per-publish bounded retry strategy. Combined with the per-attempt
  # 2s deadline this caps total transient backoff at ~9s before the
  # stream loop log+drops. Bridged into
  # detection.sources.calico.publish_retry.
  publishRetry:
    min: "100ms"
    max: "1s"
    multiplier: 2.0
    jitter: 1.0
    maxAttempts: 3

  # TLS material. Goldmane enforces mTLS; the agent presents a client
  # cert signed by the Tigera CA on every connect. Two provisioning
  # paths:
  #
  #   Path A (preferred, production): cert-manager issues a
  #   Certificate against a ClusterIssuer backed by the Tigera CA.
  #   The chart consumes the resulting Secret directly. Cert rotation
  #   is automatic. To select Path A, set:
  #     calicoSensor.tls.certManagerSecretName: <secret-name>
  #
  #   Path B (dev sandbox): operator extracts the Tigera CA bundle
  #   and a client cert from an existing Tigera-issued Secret and
  #   supplies them base64-encoded here. Cert rotation is manual.
  #   To select Path B, set tls.caBundle, tls.clientCert, and
  #   tls.clientKey.
  #
  # The chart fails render when calicoSensor.enabled=true and neither
  # path is configured. See CNI.md for the full provisioning recipe.
  tls:
    certManagerSecretName: ""
    caBundle: ""
    clientCert: ""
    clientKey: ""

# --- application log sidecar (FR5) -----------------------------------
# Story 1.9 -- fourth Ring 1 sensor source (Story 1.10 takes the fifth slot). The chart deploys a
# MutatingAdmissionWebhook (separate Deployment from the agent
# DaemonSet) that injects an Olaitan applog sidecar into pods bearing
# the annotation `olaitan.io/log-sidecar: "enabled"`. The sidecar
# tails the cooperating application's stdout/stderr from a shared
# emptyDir log volume and publishes lines to subjects.RawAppLog.
#
# Default disabled until the operator confirms (a) the cooperation
# cost (the application must arrange to write its stdout/stderr to
# /var/log/app/stdout.log and /var/log/app/stderr.log) and (b) the
# security review of the admission-webhook surface is complete (see
# APPLOG.md for the threat model).
applogSidecar:
  enabled: false

  # Use the K8s 1.28+ native sidecar pattern (initContainer with
  # restartPolicy: Always per KEP-753). On older clusters where the
  # SidecarContainers feature gate is disabled, set to false to
  # inject as a regular container instead, with the documented
  # trade-off that pod-termination semantics differ.
  useNativeSidecar: true

  # Namespace selector for the MutatingWebhookConfiguration.
  # System namespaces (kube-system, kube-public) are excluded by
  # default per the K8s admission-webhook good-practice guidance.
  # Operators can further scope by editing the matchExpressions.
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - kube-public

  # Sidecar container resource requests and limits. Operators with
  # heterogeneous log volumes can override per-Pod via annotations
  # (FUTURE; not implemented in Story 1.9).
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Adapter knobs. Mirrored into the sidecar's downward-API env vars
  # by the admission webhook at injection time.
  stdoutPath: /var/log/app/stdout.log
  stderrPath: /var/log/app/stderr.log
  channelBuffer: 1024
  maxLineBytes: 65536
  publishStallTimeout: "5s"
  stalenessTimeout: "30m"
  publishRetry:
    min: "100ms"
    max: "1s"
    multiplier: 2.0
    jitter: 0.1
    maxAttempts: 3

  # Webhook server config.
  webhook:
    # HA replica count per the K8s admission-webhook good-practice
    # guidance (a single-replica webhook is a SPOF on the apiserver
    # path). Operators with a single-node cluster can drop to 1.
    replicaCount: 2
    # TLS listen port. Must be in [1024, 65535] (chart fail-fast).
    port: 8443
    # FailurePolicy: Ignore (non-critical mutation) versus Fail
    # (critical). Olaitan applog injection is non-critical -- a pod
    # missing the sidecar still functions, it just doesn't publish
    # log events. The K8s good-practice guidance recommends Ignore
    # for non-critical paths so a webhook outage does NOT block Pod
    # admission cluster-wide.
    failurePolicy: Ignore
    # Apiserver-side timeout for the admission call. The webhook
    # itself is in-memory pure; 5s is generous.
    timeoutSeconds: 5

  # TLS material. Path A: cert-manager Certificate (production).
  # Path B: manual self-signed kubernetes.io/tls Secret (dev). The
  # chart fails fast (Helm `{{ fail }}`) when neither is configured.
  tls:
    certManagerEnabled: false
    issuerName: olaitan-ca
    # cert-manager Issuer reference kind. "Issuer" is namespace-scoped
    # and matches the default olaitan-ca Issuer pattern; operators using
    # a cluster-wide CA can set "ClusterIssuer". Chart rejects other
    # values via fail-fast.
    issuerKind: Issuer
    # When certManagerEnabled=false, the chart renders a Secret
    # containing tls.crt and tls.key from these PEM-encoded values
    # (raw base64 strings, NOT double-quoted -- the kubelet and
    # apiserver require plain base64 in tls.crt / tls.key). Both
    # required when certManagerEnabled=false.
    servingCert: ""
    servingKey: ""
    # CA bundle distributed to the apiserver via the
    # MutatingWebhookConfiguration.clientConfig.caBundle field.
    # Required when certManagerEnabled=false; ignored when
    # certManagerEnabled=true (cert-manager fills in the bundle from
    # the Issuer). Raw base64 string (NOT double-quoted).
    caBundle: ""

# --- Workload posture client (FR7) -----------------------------------
# Story 1.11 -- sixth Ring 1 source, read-on-demand rather than
# streaming. The aggregator queries the K8s API on demand for each
# investigated workload's RBAC bindings, applicable NetworkPolicies,
# and PodSecurityContext per architecture.md:324, :751 (production
# path) and architecture.md:45 (five streaming + one read-on-demand).
#
# Results are cached in-process for cacheTTL seconds keyed by the
# canonical workload identity (`namespace/owner-kind/owner-name`,
# URL-encoded, with `namespace/Pod/<pod-name>` for orphan pods per
# architecture.md:457). The cacheTTL ceiling is 60s per
# architecture.md:324 + Story 1.11 AC3; the chart rejects higher
# values via the fail-fast guard in templates/configmap.yaml.
#
# The Story 3.x orchestrator's fresh-fetch policy for LLM-eligible
# packages (architecture.md:326) is wired through the
# `posture.Client.WithBypassCache()` Go API; the Helm chart has no
# knob for it (the policy is code-side, not configuration).
posture:
  # Whether the aggregator constructs a posture.Client at startup.
  # Disabling here makes the aggregator skip posture queries; the
  # correlator still publishes EvidencePackages but with no posture
  # context. Default on because FR7 declares posture as load-bearing
  # for the multi-agent LLM chain.
  enabled: true

  # Maximum staleness for cached postures. AC3 ceiling is 60s; the
  # chart rejects any value above the ceiling because the
  # read-on-demand pattern depends on staleness staying under the
  # freshness budget.
  cacheTTL: "60s"

  # Per-Get K8s API context timeout. Posture is on the investigation
  # chain critical path; an unbounded fetch would compound LLM
  # budget pressure.
  fetchTimeout: "5s"

# Story 1.12: Prometheus metrics surface (FR8, FR50). Every Olaitan
# process exposes Prometheus metrics on :9090/metrics from a dedicated
# http.Server. The two surfaces (this one and the :8080/healthz kubelet
# probe served by internal/health) never share a port because the
# kubelet probe SLO and the Prometheus scrape SLO have different
# consumer expectations.
metrics:
  # Listen address for the metrics http.Server. Follows net.Listen
  # conventions; ":9090" binds all interfaces (the default expected
  # by the prometheus.io/port: "9090" pod annotation below). Use
  # "127.0.0.1:9090" to restrict to loopback. Empty values are
  # rejected by config.Validate per guardrail 27.
  address: ":9090"

  # Container port exposed on every olaitan ring pod. Must match the
  # numeric port in `address` above (the Helm template wires both
  # from this knob so a single --set keeps them in sync).
  containerPort: 9090

  # Prometheus scrape annotations on every olaitan ring pod. When
  # true the pod carries:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port:   "<metrics.containerPort>"
  #   prometheus.io/path:   "/metrics"
  # Set to false for clusters running a ServiceMonitor-based
  # Prometheus Operator deployment (Story 1.18 may add a
  # ServiceMonitor resource as a follow-up).
  scrapeAnnotations: true

# Story 1.13: per-source per-node rate-limit circuit breaker
# (FR51 sensing half; NFR22). The breaker engages when any of the five
# streaming sensor adapters (falco / audit / runtime / network / applog)
# exceed thresholdEventsPerSec on this node and switches to
# deterministic FNV-1a hash sampling at samplingRate; surviving events
# carry `Sampled=true` and `SamplingRate` so the downstream correlator
# (Story 1.14) and DFIR report writer (Story 4.x) can honestly disclose
# the degradation. The four knobs hot-reload via the
# config.Manager.Subscribe callback per FR49; a `helm upgrade --set
# rateLimit.thresholdEventsPerSec=500` propagates within the watcher's
# debounce window without a process restart.
rateLimit:
  # When false the breaker short-circuits for every adapter: Allow
  # always returns Publish=true / Sampled=false / SamplingRate=1.0.
  # The Prometheus counter olaitan_sensor_circuit_breaker_engaged_total
  # stays at 0; a startup log line records the disable.
  enabled: true

  # Strict-greater-than threshold for engagement, measured on a
  # sliding 1-second window per (source, node). NFR22 / PRD line 439
  # default is 1000; lower values engage the breaker earlier under
  # bursty traffic.
  thresholdEventsPerSec: 1000

  # Contiguous below-threshold seconds before disengagement. PRD line
  # 439 default is 60; the rate must stay below threshold for the full
  # cooldown for the breaker to disengage. A re-burst within the
  # cooldown window resets the timer and the breaker remains engaged
  # (treated as a continuous engagement per guardrail 29).
  cooldownSeconds: 60

  # Fraction in (0, 1] of events that survive the sampling roll while
  # engaged. PRD line 439 default is 0.1 (10%). The sampling decision
  # is deterministic: FNV-1a(event.ID) mod 100 < samplingRate*100 so
  # Epic 5 evaluation re-runs are reproducible (NFR42; guardrail 28).
  samplingRate: 0.1

# Story 1.15: OLT Sigma rule engine wiring (FR15, FR49). The aggregator
# Deployment already mounts the olaitan-rules ConfigMap at the path
# below; Story 1.16 populates the corpus. Set enabled=false to leave
# the rule engine out of startAggregatorRing entirely (sensing-only
# mode); the JetStream consumer olaitan-rules-engine is not created in
# that case. Hot-reload watches the directory for ConfigMap ..data
# symlink swaps and applies new rules without restarting the pod.
#
# Restart semantics (code-review D3):
# - rule corpus contents (the YAML files under `path`): hot-reloaded
#   via fsnotify, no pod restart.
# - rules.path: a K8s volume mountPath; changing this value rewrites
#   the aggregator Deployment spec which K8s rolls anyway. Treated as
#   restart-required by design; the aggregator pod is recreated.
# - rules.enabled: restart-required. Flipping this between true and
#   false drives a new startAggregatorRing wiring; the aggregator
#   pod must be recreated. Use `kubectl rollout restart deploy/
#   olaitan-aggregator` after `helm upgrade --set rules.enabled=...`.
#
# Story 1.19 cross-reference: when `evaluation.config` (below) is set to
# a canonical arm (F / RS / RSL / RSLT), the chart overlays this knob
# with the arm's canonical value; the operator-supplied `rules.enabled`
# is intentionally clobbered. See the `evaluation:` block at the bottom
# of this file for the full arm semantics.
rules:
  # Whether startAggregatorRing constructs the rule engine. Disabling
  # is the sensing-only mode used in the Epic 5 four-way evaluation
  # comparison (config RS). Restart-required (see comment above).
  enabled: true

  # Absolute path the rule loader watches. Must match the aggregator
  # Deployment's ConfigMap volumeMount path. Hot-reload tolerates an
  # in-place ConfigMap data swap; changing the path value itself is a
  # Deployment-spec change so the pod rolls (restart-required).
  path: "/etc/olaitan/rules"

# Story 1.17: Welford baseline engine. Maintains per-workload Gaussian
# baselines for five default metrics (outbound_unique_dst_ips,
# distinct_exec_paths, outbound_bytes, audit_events_per_min,
# container_restarts_per_hour) via Welford's online algorithm and
# emits BaselineDeviation triggers when an observation crosses
# sigmaMultiplier above the rolling mean. Restart-aware warm-up (FR18)
# suppresses emissions for warmupDuration after a container restart so
# the post-restart pattern does not contaminate the baseline.
#
# Restart semantics:
# - warmupDuration: hot-reloadable. Mid-window changes do not retroactively
#   shorten or extend an active warm-up; new restarts pick up the new value.
# - sigmaMultiplier: hot-reloadable. Applied on the next handle() call.
# - enabled: restart-required. Toggling this drives a new
#   startAggregatorRing wiring; use `kubectl rollout restart deploy/
#   olaitan-aggregator` after `helm upgrade --set baselines.enabled=...`.
# - redisAddr: restart-required. The aggregator dials Redis at startup;
#   moving the target requires a pod rollout.
#
# Story 1.19 cross-reference: when `evaluation.config` (below) is set to
# a canonical arm (F / RS / RSL / RSLT), the chart overlays this knob
# with the arm's canonical value; the operator-supplied
# `baselines.enabled` is intentionally clobbered. See the `evaluation:`
# block at the bottom of this file for the full arm semantics.
baselines:
  # Whether startAggregatorRing constructs the baseline engine. Setting
  # to false leaves the Redis client out of the aggregator ring and the
  # JetStream consumer olaitan-baseline-engine is not created.
  enabled: true

  # Warm-up window applied after each detected container restart. AC3
  # default is 30 minutes. Hot-reloadable.
  warmupDuration: "30m"

  # Number of standard deviations above the rolling mean at which a
  # BaselineDeviation is emitted. AC2 default is 3.0. Hot-reloadable.
  sigmaMultiplier: 3.0

  # Redis address the Store and Warmup controllers dial for persisted
  # per-workload state (`baseline:<namespace>:<pod>:metrics`). The
  # 48h key-family TTL is enforced server-side by the Olaitan redis
  # wrapper. Restart-required. Empty (default) falls back to the
  # `olaitan.endpoints.redis` helper that resolves to
  # `<release>-redis-master:6379` when the bundled Bitnami Redis
  # subchart is enabled; matches the env-var path the main aggregator
  # Redis client uses (REDIS_ADDR via templates/daemonset.yaml). Set
  # explicitly to point at externally-managed Redis when redis.enabled=false.
  redisAddr: ""

# Story 2.1: Deterministic ThreatScore calculator (FR30). The
# calculator collapses an EvidencePackage's rule severity and baseline
# deviation contributions into a single [0, 100] score using
#
#   total = rule_weight * max(rule_severity)
#         + baseline_weight * normalised(max_sigma)
#         + llm_weight * llm_capped_confidence
#
# where the LLM term is zero in Epic 2 (the calculator is wired ahead
# of the Epic 3 analyst tier; epics.md:1589 will populate the term).
# Defaults pin the trust-bound max(LLM-only) = 0.3 * 35 = 10.5 below
# the SUSPICIOUS threshold 20 per prd.md:294.
#
# All four knobs are hot-reloadable via FR49. The calculator reads
# config.Manager.Get() on every Score() call, so a
# `helm upgrade --set score.ruleWeight=0.5` lands at the next package
# without a controller restart.
#
# Story 1.19 evaluation-arm interaction: the F / RS / RSL / RSLT arms
# (below) gate detection.rules.enabled, detection.baselines.enabled,
# and analyst.provider. Score weights are NOT overridden by the
# evaluation arm because the F arm disables the rules and baseline
# engines entirely (their JetStream consumers are not created), so no
# rule-match or baseline-deviation ever reaches the calculator in the
# F arm. Documenting this here so a future operator does not "fix" a
# non-bug.
score:
  # FR30 weights. The three weights must sum to <= 1.0; the validator
  # rejects configurations that would break the algebraic trust-bound.
  ruleWeight: 0.4
  baselineWeight: 0.3
  llmWeight: 0.3
  # Per-provider LLM cap in [0, 100]. Default 35 mirrors the Claude
  # Opus cap at prd.md:294; Epic 3 Stories will introduce per-provider
  # caps via the analyst tier.
  llmCap: 35

# Story 2.3: response-ring FSM state persistence in Redis with restart
# recovery (FR37/NFR24). When enabled, the aggregator persists each FSM
# transition to the durable `fsm:{workload_id}` Redis family (no TTL) and
# rehydrates the in-memory FSM map on startup so a restart never silently
# de-escalates a workload to CLEAN.
#
# Restart semantics: both knobs are restart-required (they rewire the FSM
# transition sink and the restore-on-startup hook). Use `kubectl rollout
# restart deploy/olaitan-aggregator` after `helm upgrade --set
# fsm.persistenceEnabled=...`.
fsm:
  # Whether the FSM persists state to Redis and recovers it on restart.
  # Setting to false keeps the in-memory-only no-op sink (Story 2.2
  # behaviour) and skips the restore hook.
  persistenceEnabled: true

  # Redis address the FSM store dials for `fsm:{workload_id}` state.
  # Empty (default) resolves to the bundled subchart's
  # `<release>-redis-master:6379` Service via the olaitan.endpoints.redis
  # helper (mirroring baselines.redisAddr); the file-side default of
  # "redis:6379" in config/olaitan.yaml is a development-host shorthand
  # that does not match the chart's Service naming. Operators with
  # externally-managed Redis set this explicitly. Restart-required.
  redisAddr: ""

  # Story 2.10: FSM ThreatScore thresholds (the detection.confidence_bands
  # watch/alert/act) that drive SUSPICIOUS/RESTRICTED/QUARANTINED escalation.
  # Empty (commented-out / null) leaves the config/olaitan.yaml defaults
  # (20/40/70). Hot-reloadable via the ConfigMap watcher (FR49). Values are
  # ThreatScore points in [0,100]; watch < alert < act is enforced by the
  # config validator.
  thresholds: {}
    # suspicious: 20   # detection.confidence_bands.watch
    # restricted: 40   # detection.confidence_bands.alert
    # quarantined: 70  # detection.confidence_bands.act

  # Story 2.10: per-state dwell guards (seconds) - minimum residence before the
  # FSM may leave a state. Empty leaves the config defaults (0/120/120).
  # Hot-reloadable (FR49).
  dwellSeconds: {}
    # suspicious: 0
    # restricted: 120
    # quarantined: 120

  # Story 2.10: de-escalation cooldown (seconds) before the FSM relaxes a
  # workload to a lower state. Empty leaves the config default (600).
  # Hot-reloadable (FR49). null sentinel so an explicit 0 is distinguishable.
  deescalationCooldownSeconds: null

# Story 2.10: response-ring graduated-isolation controllers (Epic 2). All OFF
# by default; an operator running RS-with-isolation enables them explicitly.
# A block left empty leaves the config/olaitan.yaml defaults untouched.
response:
  # Story 2.4-2.6: RESTRICTED/QUARANTINED NetworkPolicy enforcement (FR33/NFR6).
  networkPolicy:
    enabled: false
    # Cluster pod/service CIDRs allowed for egress under RESTRICTED. Operators
    # MUST set these to their cluster's real CIDRs so in-cluster traffic + DNS
    # survive the egress block. Empty leaves the config kind/Calico defaults.
    clusterCidrs: []
    extraAllowedCidrs: []
    reconcileIntervalSeconds: 30
  # Story 2.7: operator-override controller (FR38/FR39).
  override:
    enabled: false
    pollIntervalSeconds: 15
    defaultTtlSeconds: 3600
  # Story 2.8: append-only SIEM audit subjects (FR40/NFR16). One flag gates the
  # three subjects; retention days drive the AUDIT_* JetStream stream MaxAge.
  audit:
    enabled: false
    retentionTransitionsDays: 90
    retentionOverridesDays: 365
    retentionPoliciesDays: 365

# Story 1.19: Evaluation matrix configuration (FR53). One-flag switch
# that places the chart into one of the canonical evaluation arms (F,
# RS, RSL, RSLT-full). Empty default means "no override; individual
# rules.enabled, baselines.enabled, and analyst.provider knobs apply
# verbatim". Setting evaluation.config to a canonical string OVERLAYS
# the corresponding canonical knob values; the operator-supplied
# overrides for those three knobs are intentionally clobbered to make
# the evaluation arm reproducible.
#
# Canonical arms:
#   "F"    -- Falco-only baseline. rules.enabled=false,
#             baselines.enabled=false, analyst.provider=none. Only the
#             Falco sensor adapter is active. Used to measure Falco
#             alone in the Epic 5 four-way comparison.
#   "RS"   -- Rules + Statistics. rules.enabled=true,
#             baselines.enabled=true, analyst.provider=none. LLM tier
#             bypassed; the deterministic detection layer runs
#             end-to-end. This is the Epic 1 closure target.
#   "RSL"  -- RS plus single-LLM analyst. Reserved for Epic 3 Story 3.x
#             once analyst.provider=api wiring lands. Setting "RSL"
#             today is accepted by the validator but functionally
#             equivalent to "RS" because the LLM driver does not exist
#             yet; the chart-side bridge still flips analyst.provider
#             to "api" so the Epic 3 wire-up is a single-line story.
#   "RSLT" -- RS plus full multi-agent chain (L1 + L2 + Senior).
#             Reserved for Epic 3 Story 3.x; same caveat as RSL.
#
# Restart semantics: changing evaluation.config drives changes to
# rules.enabled, baselines.enabled, and analyst.provider, which are all
# restart-required (see their per-block comments and the Story 1.15 /
# 1.17 restart semantics). Use `kubectl rollout restart deploy/
# olaitan-aggregator` after `helm upgrade --set evaluation.config=...`.
evaluation:
  # One of: "" (default), "F", "RS", "RSL", "RSLT". Chart fails render
  # with a clear message on any other value (see _helpers.tpl
  # olaitan.evaluation.validate).
  config: ""

# Story 1.19: Analyst tier provider selection. Mirrors the
# config/olaitan.yaml analyst.provider field. The chart-side default is
# "none" until Epic 3 Story 3.x lands the L1/L2/Senior chain; the
# in-repo config/olaitan.yaml default of "api" is preserved as the
# future-default and the chart's configmap.yaml bridge overlays the
# chart-side value over the file-side value at render time.
#
# One of: "none" (LLM tier bypassed), "api" (OpenAI-compatible /
# Anthropic via internal/agent/provider/api -- not yet wired; Story
# 3.x), "local" (Ollama for air-gapped fallback -- not yet wired;
# Story 3.x). Chart fails render on any other value.
#
# Restart-required: the analyst ring is constructed at startup; a
# provider change drives a new startAggregatorRing wiring. Use
# `kubectl rollout restart deploy/olaitan-aggregator` after
# `helm upgrade --set analyst.provider=...`.
analyst:
  provider: "none"

  # Story 3.8 (FR25): per-role provider routing. Each *_provider is a
  # concrete family {claude, openai, ollama} or "" to inherit the
  # top-level provider mapping (api -> claude, local -> ollama). Per-role
  # *_model lets a chain mix models (e.g. Haiku for L1/L2, Opus for
  # Senior). Empty values keep the file-side defaults. The per-provider
  # trust-ladder caps are enforced in code (claude 35 / openai 30 /
  # ollama 25, DW3.7-1): an openai-routed role caps at 30, never the
  # claude-tier 35, regardless of analyst.score_cap.
  l1_provider: ""
  l1_model: ""
  l2_provider: ""
  l2_model: ""
  senior_provider: ""
  senior_model: ""

  # Story 3.8 (FR53): RSLT ablation toggles. l2_enabled: false = L1-only
  # (Senior also off); senior_enabled: false = L1+L2. Both default true.
  # Story 3.16 sets these for the RSL / RSLT-full / ablation mode presets.
  l2_enabled: true
  senior_enabled: true

  # Story 3.4 (FR48): the local (Ollama) provider's endpoint and model.
  # Empty values keep the file-side defaults from config/olaitan.yaml
  # (endpoint http://ollama:11434, model gemma:2b); non-empty values are
  # bridged into the rendered olaitan.yaml by configmap.yaml (the same
  # C11-pattern overlay analyst.provider uses, so a Helm-set value is
  # never a silent no-op). Only consulted when provider is "local".
  # The model must be one the operator actually provisioned in the
  # Ollama instance -- there is no cross-model default.
  local:
    endpoint: ""
    model: ""

# Story 3.4 (FR48): optional in-cluster Ollama for air-gapped /
# data-residency-restricted deployments. Default OFF: the default
# render is unchanged unless an operator opts in. See
# values-airgapped.yaml for the documented air-gapped reference
# overlay, and docs/runbook.md (air-gapped section) for model
# provisioning, warm-up, and num_ctx pairing guidance. Story 3.16
# wires this surface into the evaluation modes.
ollama:
  enabled: false
  image:
    repository: ollama/ollama
    # Pinned tag, never latest (reproducibility hygiene, NFR31); mirror
    # by digest in production registries for tamper-proofing.
    tag: "0.9.0"
    pullPolicy: IfNotPresent
  resources: {}
  # Extra environment for the Ollama server, e.g. OLLAMA_CONTEXT_LENGTH
  # (pair with the provider's MaxContextTokens knob per the runbook's
  # air-gapped section) or OLLAMA_KEEP_ALIVE for warm-model policy.
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  # Model volume (mounted at /root/.ollama). The chart does NOT create
  # the claim: provision it with the pre-pulled model and reference it
  # here (model provisioning is operator-owned).
  persistence:
    enabled: false
    existingClaim: ""

# --- Subchart overrides ------------------------------------------------
# Only opinions we impose on the downstream charts live here -- upstream
# defaults are otherwise preserved. To see every available knob, consult
# the subchart's own values.yaml:
#   - https://artifacthub.io/packages/helm/falcosecurity/falco
#   - https://artifacthub.io/packages/helm/nats/nats
#   - https://artifacthub.io/packages/helm/bitnami/redis

# Falco -- host-level signal source (Ring 1). eBPF driver is the modern
# default; the legacy kernel module and `modern_ebpf` are alternatives
# operators can override. gRPC output is required: that is how the
# collector reads Falco events. [Source: architecture.md:130-131]
falco:
  enabled: true
  driver:
    kind: ebpf
  # Falco's gRPC server -- both `grpc.enabled` and `grpc_output.enabled`
  # must be on for the collector to subscribe.
  falco:
    grpc:
      enabled: true
      bind_address: "unix:///run/falco/falco.sock"
    grpc_output:
      enabled: true

# NATS with JetStream persistence -- inter-ring event bus. JetStream
# provides the replay/checkpoint primitive that Story 2.7 + Story 3.1
# lean on for exactly-once recovery semantics. [Source: architecture.md:132-133]
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
  # Story 1.19 D6 escape hatch: when the kind/CI NATS PVC backing is
  # smaller than the production streamConfigs sum (160 GiB across
  # EVENTS/EVENTS_RAW/EVIDENCE), set this to a per-stream byte cap
  # (e.g. "1073741824" for 1 GiB) so JetStream CreateOrUpdateStream
  # does not return err 10047 ("not enough storage"). Production
  # leaves this empty and sizes nats.persistence.size to accommodate
  # the configured sum, rather than overriding fileStore.maxSize.
  streamMaxBytesOverride: ""

# Redis -- state store (per-workload baselines, FSM state, checkpoints).
# Standalone architecture is enough for the single-aggregator MVP;
# Sentinel/Cluster are deferred to the Target-tier HA story. AUTH is
# mandatory (NFR8). The subchart reads its password from the parent
# chart's `<fullname>-secrets` Secret (key `redis-password`) so both
# sides agree on a single source of truth -- the operator-supplied
# `secrets.redisPassword`. NOTE: `existingSecret` is hardcoded for the
# canonical `helm install olaitan ...` release-name pattern; for any
# other release name, also override:
#   --set redis.auth.existingSecret=<release>-olaitan-secrets
# [Source: architecture.md:328, NFR8]
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: olaitan-secrets
    existingSecretPasswordKey: redis-password
