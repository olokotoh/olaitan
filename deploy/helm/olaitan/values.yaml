# Default values for the Olaitan chart. Override with `--set key=value`
# or a custom values file (`helm install -f my-values.yaml`). See
# deploy/helm/README.md for the operator-facing configuration guide.

# --- Container image ---------------------------------------------------
# Published image. ghcr.io is free for public repositories and the
# project already uses the olokotoh org there. Tag defaults to
# .Chart.AppVersion so a `helm install` without overrides pins to a
# chart-coherent release.
image:
  repository: ghcr.io/olokotoh/olaitan
  # Empty = fall back to .Chart.AppVersion in _helpers.tpl's
  # "olaitan.image" helper. Set explicitly (e.g. a commit SHA) to pin a
  # pre-release image.
  tag: ""
  # IfNotPresent avoids gratuitous registry traffic on pod restart; use
  # Always only for mutable dev tags (not recommended in production).
  pullPolicy: IfNotPresent

# Private-registry pull credentials. Empty by default -- ghcr.io/olokotoh
# is public. Operators add their own imagePullSecret names here when
# retagging Olaitan into a private registry.
imagePullSecrets: []

# Optional overrides to the chart name / release fullname. Rarely used;
# the defaults (Chart.Name, Release.Name-Chart.Name) are sufficient for
# typical single-release installs.
nameOverride: ""
fullnameOverride: ""

# --- Collector (Ring 1 DaemonSet) --------------------------------------
# One pod per node; consumes Falco gRPC + Kubernetes audit + cgroup
# signals, forwards enriched events to the aggregator over NATS.
collector:
  # Resource envelope sized for the collector's job: decode+enrich+publish
  # on a hot path. 256Mi limit is headroom over observed ~80-120Mi usage
  # on the demo cluster (Falco event rate ~200/s).
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Control-plane nodes have a NoSchedule taint by default (kubeadm
  # convention). When `true`, collector tolerates the taint and runs on
  # master nodes too -- useful for single-node dev clusters. Off by
  # default: production clusters keep control planes isolated.
  runOnControlPlane: false
  # Extra node-selection constraints beyond the DaemonSet default
  # (which already scopes to every schedulable node). Merge, don't
  # replace, in the template.
  nodeSelector: {}
  tolerations: []

# --- Aggregator (Rings 2-4 Deployment) ---------------------------------
# Singleton in MVP; rings are cooperative goroutines inside one process.
# See Dev Notes § "The aggregator-replicas-1 constraint" for why this
# must stay at 1 until Story 8.1 introduces leader election.
aggregator:
  # HARD CONSTRAINT. Do NOT raise above 1 until leader election lands.
  # Two aggregator pods would split-brain the NATS JetStream checkpoint
  # (Redis key checkpoint:correlator:stream_seq) -- events get processed
  # twice, recovery breaks.
  replicas: 1
  # 256Mi request / 512Mi limit. NFR5 targets "< 200 MB steady state",
  # but 256Mi leaves headroom for fsnotify watch buffers (1.6) and
  # future LLM context assembly (Epic 4). The 512Mi limit prevents OOM
  # on a long-running pod as rule sets grow.
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []

# --- Service endpoints -------------------------------------------------
# Where Olaitan dials its dependencies. Empty by default -- the templates
# fall back to release-name-derived subchart Service names via the
# `olaitan.endpoints.nats` / `olaitan.endpoints.redis` helpers
# (`<release>-nats`, `<release>-redis-master`). Set explicitly to point
# at externally-managed infra (e.g. when `<name>.enabled=false`).
endpoints:
  # Empty → "nats://<release>-nats:4222" (subchart's headless Service).
  nats: ""
  # Empty → "<release>-redis-master:6379" (subchart's primary Service).
  redis: ""
  # Falco gRPC socket. Mounted via hostPath from the Falco DaemonSet;
  # local-unix-socket is lower-latency than the TCP/gRPC mode.
  # [Source: architecture.md:130]
  falco: "unix:///run/falco/falco.sock"

# --- Operator-provided secrets ----------------------------------------
# All three default to "" so the Secret always renders (downstream pods
# mount it unconditionally). Operators supply real values via
# `--set-file` or an external-secrets-operator reconciliation. Downstream
# ring code (Epic 2+) validates non-empty before dialling; the chart is
# not responsible for secret lifecycle. [Source: Dev Notes § "Secrets"]
secrets:
  # Redis AUTH password (NFR8). Empty at install time; Story 2.x wiring
  # refuses to start the Redis client if empty.
  redisPassword: ""
  # NATS client credentials (for cluster-mode NATS with auth). Empty by
  # default; demo cluster runs NATS without auth.
  natsCreds: ""
  # LLM provider API key (OpenAI/Anthropic/…). Empty by default; Epic 4
  # analyst ring refuses to start when analyst.provider=api with empty.
  llmApiKey: ""

# --- DFIR report PVC ---------------------------------------------------
# Read-write volume for JSON evidence files + markdown narratives (Epic
# 6). Mounted only on the aggregator pod -- collector has no write side.
reports:
  # "" = use the cluster's default StorageClass. Override on clusters
  # where the operator wants a specific class (e.g., `standard-rwo`).
  storageClass: ""
  # 1Gi covers a demo-scale incident volume; operators bump this up for
  # long-running clusters with high detection rates.
  size: 1Gi
  # Set true to skip PVC creation and bind to an externally-managed
  # claim named `<fullname>-reports` in the release namespace. The
  # aggregator Deployment always references the same PVC name.
  externalPvc: false

# --- Probe timing ------------------------------------------------------
# livenessProbe + readinessProbe parameters, shared by DaemonSet and
# Deployment. initialDelaySeconds: 3 -- config load + watcher start +
# health server bind take <1s on a warm image; 3s absorbs cold-start
# variance without masking a real startup failure.
probes:
  initialDelaySeconds: 3
  periodSeconds: 10
  failureThreshold: 3

# --- NetworkPolicy ----------------------------------------------------
# Namespace-scoped baseline isolation policy. Default-on because the
# architecture treats namespace isolation as a baseline control rather
# than an opt-in. Operators on flat networks (or operating in clusters
# where the CNI does not enforce NetworkPolicy) can disable with
# `--set networkPolicy.enabled=false`. [Source: architecture.md:355-360]
networkPolicy:
  enabled: true
  # CIDR block of node IPs (host network). Required for kubelet to reach
  # pod liveness/readiness probes when the CNI enforces NetworkPolicy on
  # host-network traffic -- Calico in eBPF dataplane is the load-bearing
  # case. Default-iptables Calico bypasses policy on host-network traffic
  # so the policy works without this set. Empty = no kubelet allow-rule.
  # Operators on eBPF dataplane MUST set this to the cluster's node CIDR
  # (e.g. "10.0.0.0/16"); otherwise pods never reach Ready.
  nodeCIDR: ""
  # CIDR for the Kubernetes API server virtual IP. Default 10.96.0.1/32
  # is the kubeadm 1.29 stock service-CIDR ClusterIP for the kubernetes
  # Service. Override on clusters with a non-default service-CIDR. The
  # aggregator's pod-patch path needs egress here.
  apiServerCIDR: "10.96.0.1/32"
  # Extra egress rules merged into the policy as-is. Operators populate
  # this with the LLM provider endpoints they actually use; values are
  # raw NetworkPolicyEgressRule objects so the full schema is available
  # without us having to mirror it in chart-level keys. Production
  # overlays (Story 6.6) will ship a populated default for the common
  # providers.
  extraEgress: []

# --- Audit webhook ----------------------------------------------------
# Story 1.7 -- Kubernetes audit webhook receiver. Default-off so chart
# installs without the operator-side kube-apiserver wiring continue to
# render. Operators flip enabled=true after they have applied the
# kube-apiserver --audit-webhook-config-file + --audit-policy-file
# patches per deploy/helm/olaitan/AUDIT.md.
#
# Note on terminology: the architecture document refers to this as a
# "ValidatingWebhookConfiguration audit-webhook variant" -- that is
# incorrect Kubernetes terminology. Audit webhook backends are NOT
# ValidatingWebhookConfiguration resources; they are configured via
# the apiserver's --audit-webhook-config-file flag pointing at a
# kubeconfig Secret. The existing
# deploy/helm/olaitan/templates/validatingwebhookconfiguration.yaml is
# an admission-webhook stub from Story 1.1 (a separate feature) and is
# left alone by this story. See AUDIT.md for the full reconciliation.
# [Source: epics.md Story 1.7, architecture.md:§Audit Webhook TLS]
auditWebhook:
  enabled: false

  # Service port the apiserver dials. 8443 is the convention for
  # webhook receivers in the K8s ecosystem.
  servicePort: 8443

  # Container port the receiver listens on. Must match the kubeconfig
  # 'server' URL the apiserver dials.
  containerPort: 8443

  # base64-encoded PEM bytes of the CA that signed the receiver's
  # serving cert. The apiserver kubeconfig embeds this as
  # certificate-authority-data so the apiserver trusts the receiver
  # during mTLS. Required when enabled=true; chart fails render
  # otherwise. Operators base64-encode the PEM file themselves
  # (`base64 -w0 ca.pem`); the chart does NOT re-encode (Helm's
  # b64enc would double-encode). Multi-line wrapped output (e.g. plain
  # `base64` without -w0) MUST be stripped to one line before pasting.
  caBundle: ""

  # Operator-supplied cluster-CA data -- the CA that signs the
  # kube-apiserver's client certificate presented during mTLS to the
  # receiver. On kubeadm clusters this is the cluster's root CA at
  # /etc/kubernetes/pki/ca.crt; extract and base64-encode before set.
  # See AUDIT.md for the extraction recipe. Required when enabled=true.
  clusterCAData: ""

  # Audit kubeconfig credentials the apiserver presents to the
  # receiver during mTLS. apiserverClientCert / apiserverClientKey are
  # base64-encoded PEMs of the client cert + private key issued for
  # CN=kube-apiserver. Required when enabled=true.
  apiserverClientCert: ""
  apiserverClientKey: ""

  # Receiver serving cert + key. Operator-supplied (Path B per Story
  # 1.7 Task 7); base64-encoded PEM. Path A (cert-manager) is deferred
  # to a future Helm hardening story per AUDIT.md.
  servingCert: ""
  servingKey: ""

  # Audit policy. When custom is non-empty the chart renders it
  # verbatim into the policy ConfigMap; otherwise the chart's
  # files/audit-policy-default.yaml is used. The default policy is
  # justified in Story 1.7 Task 2.2 (kubelet/controller-manager noise
  # filtered, RBAC + NetPol + Secret + exec/portforward elevated).
  policy:
    custom: ""

  # NOTE: runtime adapter knobs (listen_addr, TLS file paths,
  # max_payload_bytes, staleness_timeout, publish_retry) live in
  # config/olaitan.yaml under detection.sources.audit. The chart
  # renders config/olaitan.yaml verbatim into the ConfigMap via
  # `.Files.Get` -- no Helm-values overlay is applied -- so operators
  # who want to tune these knobs MUST edit config/olaitan.yaml before
  # `make helm-prepare && helm install`. The dual-flag relationship
  # also requires `detection.sources.audit.enabled: true` in
  # config/olaitan.yaml AND `auditWebhook.enabled: true` here for the
  # receiver to actually run; the chart fails render with a clear
  # message if the flags disagree (see templates/audit-policy-
  # configmap.yaml). See AUDIT.md for the full operator workflow.

# --- containerd CRI lifecycle sensor ---------------------------------
# Story 1.8 -- third Ring 1 sensor source (FR3). Subscribes to the
# containerd CRI runtime via RuntimeService.GetContainerEvents over a
# Unix domain socket bind-mounted from the host. Default-off until the
# operator confirms the socket path is correct on their cluster's
# nodes and the security boundary documented in CRI.md is acceptable.
#
# The chart renders the per-node hostPath volume + volumeMount only
# when containerdSensor.enabled=true; the runtime adapter knobs
# (socket_path, dial_timeout, staleness_timeout, retry strategies)
# live in config/olaitan.yaml under detection.sources.containerd. The
# dual-flag relationship requires both blocks set to enabled=true for
# the adapter to actually run.
#
# Security boundary: mounting the containerd CRI socket grants the
# agent the full CRI surface on the node (list+exec+image-pull); see
# CRI.md for the threat model. Privilege equivalent to the existing
# Falco socket mount; threat model unchanged from the post-Story-1.6
# baseline.
containerdSensor:
  enabled: false

  # Path on the host node to the containerd CRI socket. Default for
  # containerd 1.7 on a stock kubeadm 1.29 cluster. Operators using a
  # non-standard install layout (k3s, microk8s, custom containerd
  # build) override here. The value flows through the rendered
  # ConfigMap into detection.sources.containerd.socket_path so a
  # single Helm override updates both the host-path mount and the
  # adapter's runtime knob (mirrors auditWebhook.enabled bridging).
  socketPath: /run/containerd/containerd.sock

  # gRPC dial timeout for the initial wait-for-ready handshake. Bumped
  # past the default for slow nodes where containerd's CRI server
  # takes longer than 10s to come up post-restart. Bridged into
  # detection.sources.containerd.dial_timeout.
  dialTimeout: "10s"

  # Staleness watchdog threshold. CRI lifecycle events are quiet by
  # design: a stable cluster with no Pod churn can go hours without an
  # event, so the watchdog only flips MarkUnhealthy when staleness
  # AND a non-Ready connection coincide. Bridged into
  # detection.sources.containerd.staleness_timeout.
  stalenessTimeout: "5m"

  # Outer connect-loop backoff strategy used when the gRPC dial or
  # GetContainerEvents stream open fails. Equal-jitter exponential
  # backoff; max_attempts=0 means unlimited (the long-lived DaemonSet
  # adapter never gives up on its own). Bridged into
  # detection.sources.containerd.connect_retry.
  connectRetry:
    min: "1s"
    max: "30s"
    multiplier: 2.0
    jitter: 0.5
    maxAttempts: 0

  # Per-publish bounded retry strategy. Combined with the per-attempt
  # 2s deadline this caps total transient backoff at ~9s before the
  # stream loop log+drops. jitter=0.1 matches the code default in
  # internal/collector/cri.DefaultPublishRetry. Bridged into
  # detection.sources.containerd.publish_retry.
  publishRetry:
    min: "100ms"
    max: "1s"
    multiplier: 2.0
    jitter: 0.1
    maxAttempts: 3

# --- Calico CNI flow sensor (FR4) ------------------------------------
# Story 1.10 -- fourth Ring 1 streaming sensor source. Subscribes to
# the Calico Goldmane gRPC API (`goldmane.Flows.Stream`) over mTLS,
# translating each FlowResult into a schema.Event of source=network /
# category=flow. Default-off because Goldmane requires the Tigera
# operator install path on Calico v3.31.5+; see CNI.md for the full
# operator workflow and ADR-2026-04-30-01 / ADR-2026-05-12-01 in
# docs/deferred-decisions.md for the install-path migration rationale.
#
# Dual-flag relationship: calicoSensor.enabled here AND
# detection.sources.calico.enabled in config/olaitan.yaml must both
# be true for the adapter to run. The chart fails render with a clear
# message if calicoSensor.enabled=true but TLS material is missing.
#
# Security boundary: mTLS-authenticated egress to
# `goldmane.calico-system.svc:7443` (within-cluster). The agent must
# present a client cert signed by the Tigera operator's CA. Two
# provisioning paths are supported (Path A cert-manager, Path B
# operator-supplied) -- see CNI.md.
calicoSensor:
  enabled: false

  # gRPC target for the Calico Goldmane Service. Default matches the
  # Tigera operator's v3.31.5 install layout. Operators with
  # non-default cluster install paths override here.
  goldmaneAddr: "goldmane.calico-system.svc:7443"

  # TLS SNI / verify name presented during the mTLS handshake. Default
  # matches the cert the Tigera operator issues for Goldmane.
  serverName: "goldmane.calico-system.svc"

  # FlowStreamRequest knobs. StartTimeGte is negative for "relative to
  # now" (Goldmane convention; -60 means "last 60s"). AggregationInterval
  # has a 15s minimum at the Goldmane layer.
  startTimeGte: -60
  aggregationInterval: 15

  # gRPC dial timeout for the initial wait-for-ready handshake.
  # Bridged into detection.sources.calico.dial_timeout.
  dialTimeout: "10s"

  # Staleness watchdog threshold. Goldmane flow records are quiet by
  # design: a cluster with no east-west traffic produces no
  # FlowResults, so the watchdog only flips MarkUnhealthy when
  # staleness AND a non-Ready connection coincide. Bridged into
  # detection.sources.calico.staleness_timeout.
  stalenessTimeout: "10m"

  # Per-event marshalled size cap. The default of 196608 bytes (192
  # KiB) leaves 64 KiB of envelope headroom under JetStream's 256 KiB
  # MaxMsgSize ceiling. Events exceeding this cap are log+dropped at
  # translate time. Floor 4096; ceiling 262144 (256 KiB). Bridged
  # into detection.sources.calico.max_event_bytes.
  maxEventBytes: 196608

  # Outer connect-loop backoff strategy used when the gRPC dial, mTLS
  # handshake, or stream open fails. Equal-jitter exponential
  # backoff; max_attempts=0 means unlimited. Bridged into
  # detection.sources.calico.connect_retry.
  connectRetry:
    min: "1s"
    max: "60s"
    multiplier: 2.0
    jitter: 1.0
    maxAttempts: 0

  # Per-publish bounded retry strategy. Combined with the per-attempt
  # 2s deadline this caps total transient backoff at ~9s before the
  # stream loop log+drops. Bridged into
  # detection.sources.calico.publish_retry.
  publishRetry:
    min: "100ms"
    max: "1s"
    multiplier: 2.0
    jitter: 1.0
    maxAttempts: 3

  # TLS material. Goldmane enforces mTLS; the agent presents a client
  # cert signed by the Tigera CA on every connect. Two provisioning
  # paths:
  #
  #   Path A (preferred, production): cert-manager issues a
  #   Certificate against a ClusterIssuer backed by the Tigera CA.
  #   The chart consumes the resulting Secret directly. Cert rotation
  #   is automatic. To select Path A, set:
  #     calicoSensor.tls.certManagerSecretName: <secret-name>
  #
  #   Path B (dev sandbox): operator extracts the Tigera CA bundle
  #   and a client cert from an existing Tigera-issued Secret and
  #   supplies them base64-encoded here. Cert rotation is manual.
  #   To select Path B, set tls.caBundle, tls.clientCert, and
  #   tls.clientKey.
  #
  # The chart fails render when calicoSensor.enabled=true and neither
  # path is configured. See CNI.md for the full provisioning recipe.
  tls:
    certManagerSecretName: ""
    caBundle: ""
    clientCert: ""
    clientKey: ""

# --- application log sidecar (FR5) -----------------------------------
# Story 1.9 -- fifth Ring 1 sensor source. The chart deploys a
# MutatingAdmissionWebhook (separate Deployment from the agent
# DaemonSet) that injects an Olaitan applog sidecar into pods bearing
# the annotation `olaitan.io/log-sidecar: "enabled"`. The sidecar
# tails the cooperating application's stdout/stderr from a shared
# emptyDir log volume and publishes lines to subjects.RawAppLog.
#
# Default disabled until the operator confirms (a) the cooperation
# cost (the application must arrange to write its stdout/stderr to
# /var/log/app/stdout.log and /var/log/app/stderr.log) and (b) the
# security review of the admission-webhook surface is complete (see
# APPLOG.md for the threat model).
applogSidecar:
  enabled: false

  # Use the K8s 1.28+ native sidecar pattern (initContainer with
  # restartPolicy: Always per KEP-753). On older clusters where the
  # SidecarContainers feature gate is disabled, set to false to
  # inject as a regular container instead, with the documented
  # trade-off that pod-termination semantics differ.
  useNativeSidecar: true

  # Namespace selector for the MutatingWebhookConfiguration.
  # System namespaces (kube-system, kube-public) are excluded by
  # default per the K8s admission-webhook good-practice guidance.
  # Operators can further scope by editing the matchExpressions.
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - kube-system
          - kube-public

  # Sidecar container resource requests and limits. Operators with
  # heterogeneous log volumes can override per-Pod via annotations
  # (FUTURE; not implemented in Story 1.9).
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Adapter knobs. Mirrored into the sidecar's downward-API env vars
  # by the admission webhook at injection time.
  stdoutPath: /var/log/app/stdout.log
  stderrPath: /var/log/app/stderr.log
  channelBuffer: 1024
  maxLineBytes: 65536
  publishStallTimeout: "5s"
  stalenessTimeout: "30m"
  publishRetry:
    min: "100ms"
    max: "1s"
    multiplier: 2.0
    jitter: 0.1
    maxAttempts: 3

  # Webhook server config.
  webhook:
    # HA replica count per the K8s admission-webhook good-practice
    # guidance (a single-replica webhook is a SPOF on the apiserver
    # path). Operators with a single-node cluster can drop to 1.
    replicaCount: 2
    # TLS listen port. Must be in [1024, 65535] (chart fail-fast).
    port: 8443
    # FailurePolicy: Ignore (non-critical mutation) versus Fail
    # (critical). Olaitan applog injection is non-critical -- a pod
    # missing the sidecar still functions, it just doesn't publish
    # log events. The K8s good-practice guidance recommends Ignore
    # for non-critical paths so a webhook outage does NOT block Pod
    # admission cluster-wide.
    failurePolicy: Ignore
    # Apiserver-side timeout for the admission call. The webhook
    # itself is in-memory pure; 5s is generous.
    timeoutSeconds: 5

  # TLS material. Path A: cert-manager Certificate (production).
  # Path B: manual self-signed kubernetes.io/tls Secret (dev). The
  # chart fails fast (Helm `{{ fail }}`) when neither is configured.
  tls:
    certManagerEnabled: false
    issuerName: olaitan-ca
    # cert-manager Issuer reference kind. "Issuer" is namespace-scoped
    # and matches the default olaitan-ca Issuer pattern; operators using
    # a cluster-wide CA can set "ClusterIssuer". Chart rejects other
    # values via fail-fast.
    issuerKind: Issuer
    # When certManagerEnabled=false, the chart renders a Secret
    # containing tls.crt and tls.key from these PEM-encoded values
    # (raw base64 strings, NOT double-quoted -- the kubelet and
    # apiserver require plain base64 in tls.crt / tls.key). Both
    # required when certManagerEnabled=false.
    servingCert: ""
    servingKey: ""
    # CA bundle distributed to the apiserver via the
    # MutatingWebhookConfiguration.clientConfig.caBundle field.
    # Required when certManagerEnabled=false; ignored when
    # certManagerEnabled=true (cert-manager fills in the bundle from
    # the Issuer). Raw base64 string (NOT double-quoted).
    caBundle: ""

# --- Subchart overrides ------------------------------------------------
# Only opinions we impose on the downstream charts live here -- upstream
# defaults are otherwise preserved. To see every available knob, consult
# the subchart's own values.yaml:
#   - https://artifacthub.io/packages/helm/falcosecurity/falco
#   - https://artifacthub.io/packages/helm/nats/nats
#   - https://artifacthub.io/packages/helm/bitnami/redis

# Falco -- host-level signal source (Ring 1). eBPF driver is the modern
# default; the legacy kernel module and `modern_ebpf` are alternatives
# operators can override. gRPC output is required: that is how the
# collector reads Falco events. [Source: architecture.md:130-131]
falco:
  enabled: true
  driver:
    kind: ebpf
  # Falco's gRPC server -- both `grpc.enabled` and `grpc_output.enabled`
  # must be on for the collector to subscribe.
  falco:
    grpc:
      enabled: true
      bind_address: "unix:///run/falco/falco.sock"
    grpc_output:
      enabled: true

# NATS with JetStream persistence -- inter-ring event bus. JetStream
# provides the replay/checkpoint primitive that Story 2.7 + Story 3.1
# lean on for exactly-once recovery semantics. [Source: architecture.md:132-133]
nats:
  enabled: true
  config:
    jetstream:
      enabled: true

# Redis -- state store (per-workload baselines, FSM state, checkpoints).
# Standalone architecture is enough for the single-aggregator MVP;
# Sentinel/Cluster are deferred to the Target-tier HA story. AUTH is
# mandatory (NFR8). The subchart reads its password from the parent
# chart's `<fullname>-secrets` Secret (key `redis-password`) so both
# sides agree on a single source of truth -- the operator-supplied
# `secrets.redisPassword`. NOTE: `existingSecret` is hardcoded for the
# canonical `helm install olaitan ...` release-name pattern; for any
# other release name, also override:
#   --set redis.auth.existingSecret=<release>-olaitan-secrets
# [Source: architecture.md:328, NFR8]
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: olaitan-secrets
    existingSecretPasswordKey: redis-password
